<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc">
<title id="title">FULL104 reader-fit scope</title>
<desc id="desc">A dashboard summarizing the lawful reader-fit corpus, source composition, operators, strata and firewall.</desc>
<rect width="100%" height="100%" fill="white"/>
<style>
text { font-family: Inter, Arial, Helvetica, sans-serif; fill: #202A35; }
.title { font-size: 38px; font-weight: 700; }
.kicker { font-size: 18px; font-weight: 700; letter-spacing: 1.2px; fill: #2F6BFF; }
.head { font-size: 23px; font-weight: 700; }
.body { font-size: 18px; }
.small { font-size: 15px; fill: #5E6A78; }
.metric { font-size: 38px; font-weight: 750; fill: #0F2747; }
.metriclabel { font-size: 16px; fill: #5E6A78; }
.card { stroke: #D9E0E8; stroke-width: 1.5; rx: 18; }
</style>
<text x="60" y="70" class="kicker">FULL104 READER-FIT AUTHORITY</text>
<text x="60" y="112" class="title">A multi-dataset problem, reconciled at the donor level</text><text x="60" y="150" class="title">and across 42 measurement operators</text>
<rect x="60" y="180" width="290" height="125" fill="#F6F8FB" class="card"/><text x="88" y="237" class="metric">4,553,407</text><text x="88" y="274" class="metriclabel">lawful cells</text><rect x="380" y="180" width="290" height="125" fill="#F6F8FB" class="card"/><text x="408" y="237" class="metric">104</text><text x="408" y="274" class="metriclabel">reader-fit donors</text><rect x="700" y="180" width="290" height="125" fill="#F6F8FB" class="card"/><text x="728" y="237" class="metric">42</text><text x="728" y="274" class="metriclabel">measurement operators</text><rect x="1020" y="180" width="290" height="125" fill="#F6F8FB" class="card"/><text x="1048" y="237" class="metric">41,238</text><text x="1048" y="274" class="metriclabel">molecular addresses</text>
<text x="60" y="365" class="head">Source composition</text>
<text x="60" y="397" class="small">Exact lawful row counts. Source abundance is not used as a biological label.</text>
<rect x="60" y="430" width="1157.6634023710158" height="42" fill="#2F6BFF"/><rect x="1217.6634023710158" y="430" width="66.47534033307367" height="42" fill="#7B61C9"/><rect x="1284.1387427040895" y="430" width="55.86125729591051" height="42" fill="#1C9A8B"/>
<rect x="60" y="500" width="390" height="95" fill="white" class="card"/><rect x="60" y="500" width="8" height="95" rx="4" fill="#2F6BFF"/><text x="88" y="537" class="head">SEA-AD</text><text x="88" y="569" class="body">4,118,213 cells  ·  90.4%</text>
<rect x="480" y="500" width="390" height="95" fill="white" class="card"/><rect x="480" y="500" width="8" height="95" rx="4" fill="#7B61C9"/><text x="508" y="537" class="head">NPH52</text><text x="508" y="569" class="body">236,476 cells  ·  5.2%</text>
<rect x="900" y="500" width="390" height="95" fill="white" class="card"/><rect x="900" y="500" width="8" height="95" rx="4" fill="#1C9A8B"/><text x="928" y="537" class="head">HVS</text><text x="928" y="569" class="body">198,718 cells  ·  4.4%</text>
<rect x="60" y="644" width="1280" height="38" rx="12" fill="#FFF4E7"/><text x="78" y="670" class="small">1,400 donor×operator strata are tracked explicitly. Reader-validation, reader-oracle, DEV, SEALED and pathology expression remain outside this scope.</text>
</svg>