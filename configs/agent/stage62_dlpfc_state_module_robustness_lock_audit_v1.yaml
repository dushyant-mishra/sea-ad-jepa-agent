  gene_availability: results/tables/stage62_gene_availability_v1.csv
  branch_matrix_summary: results/tables/stage62_branch_matrix_summary_v1.csv
  frozen_probe_results: results/tables/stage62_frozen_probe_results_v1.csv
  target_level_results: results/tables/stage62_target_level_results_v1.csv
  branch_comparison: results/tables/stage62_branch_comparison_v1.csv
  seed_stability_summary: results/tables/stage62_seed_stability_summary_v1.csv
  delta_summary: results/tables/stage62_delta_summary_v1.csv
  bootstrap_summary: results/tables/stage62_bootstrap_summary_v1.csv
