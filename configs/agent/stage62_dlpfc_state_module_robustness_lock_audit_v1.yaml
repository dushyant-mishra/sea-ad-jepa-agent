stage: Stage62
version: v1
stage_name: Stage62_dlpfc_state_module_robustness_lock_audit_v1
description: Strict robustness and lock-gate audit for corrected Stage61 DLPFC Microglia-PVM state-module signal.

inputs:
  local_h5ad: data/sea_ad/stage45/cellxgene/h5ad_assets/100c6145-7b0e-4ba6-81c1-ffebed0d1ac4.h5ad
  programming_matrix: data/processed/sea_ad_mtg_microglia_pvm_pseudobulk.csv
  pathology_targets: data/processed/metadata/sea_ad_mtg_donor_pathology_targets.csv
  stage61_branch_comparison: results/tables/stage61_branch_comparison_v1.csv
  stage61_feature_inventory: results/tables/stage61_dlpfc_feature_inventory_v1.csv
  stage61_gene_availability: results/tables/stage61_dlpfc_gene_availability_v1.csv
  stage61_pass_fail: results/tables/stage61_pass_fail_v1.csv
  active_status: docs/ACTIVE_V3_STATUS.md
  v3_scorecard_md: docs/V3_SCORECARD.md
  v3_scorecard_csv: results/tables/v3_scorecard_status_v1.csv

parameters:
  donor_column_candidates: [Donor ID, donor_id]
  state_column_candidates: [Supertype, supertype, cell_type]
  max_programming_features: 3000
  latent_dims: [8, 16]
  random_seeds: [107, 211, 307, 401, 503, 607, 701, 809, 911, 1009]
  n_splits: 5
  ridge_alpha: 1.0
  high_cell_quantile: 0.90
  min_cells_per_donor_state: 5
  bootstrap_iterations: 500
  control_seed: 6201
  primary_branch: mtg_programming_plus_dlpfc_state_modules_full

