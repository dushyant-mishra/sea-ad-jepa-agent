  lock_gate_decision: results/tables/stage62_lock_gate_decision_v1.csv
  claim_boundary_audit: results/tables/stage62_claim_boundary_audit_v1.csv
  pass_fail: results/tables/stage62_pass_fail_v1.csv
  report: results/reports/stage62_dlpfc_state_module_robustness_lock_audit_report_v1.md
