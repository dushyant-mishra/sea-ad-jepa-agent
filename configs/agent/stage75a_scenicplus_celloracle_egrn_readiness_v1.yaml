stage: stage75a_scenicplus_celloracle_egrn_readiness_v1
description: >
  Readiness and handoff package for upgrading Stage74 from static directed
  coactivity propagation to a SCENIC+/CellOracle-style state-specific
  perturbation framework. This stage does not run SCENIC+, CellOracle, model
  training, or external validation. It audits local prerequisites, freezes the
  intended staged design, and records the missing resources needed for true
  TF->region->gene eRegulon construction.

inputs:
  stage72b_edges: results/tables/stage72b_tf_target_candidate_edges_v1.csv
  stage72b_readiness: results/tables/stage72b_grn_readiness_decision_v1.csv
  stage73r_control_integrity: results/tables/stage73r_graph_control_integrity_audit_v1.csv
  stage74_decision: results/tables/stage74_decision_audit_v1.csv
  gse174367_snrna_matrix: data/external/gse174367/GSE174367_snRNA-seq_filtered_feature_bc_matrix.h5
  gse174367_snrna_metadata: data/external/gse174367/GSE174367_snRNA-seq_cell_meta.csv.gz
  gse174367_snatac_matrix: data/external/gse174367/GSE174367_snATAC-seq_filtered_peak_bc_matrix.h5
  gse174367_snatac_metadata: data/external/gse174367/GSE174367_snATAC-seq_cell_meta.csv.gz
  mtg_h5ad: data/processed/sea_ad_mtg_microglia_pvm_all_hvg3k_module_preserved.h5ad
  dlpfc_h5ad: data/sea_ad/stage45/cellxgene/h5ad_assets/100c6145-7b0e-4ba6-81c1-ffebed0d1ac4.h5ad
  active_status: docs/ACTIVE_V3_STATUS.md
  v3_scorecard_md: docs/V3_SCORECARD.md
  v3_scorecard_csv: results/tables/v3_scorecard_status_v1.csv

required_python_modules:
  - scenicplus
  - pycisTopic
  - ctxcore
  - arboreto
  - celloracle
  - pyranges
  - pybiomart
  - mudata
  - scanpy

required_external_resources:
  - motif_collection
  - cistarget_rankings_or_motif_rankings
  - chromosome_sizes
  - gene_annotation_gtf_or_bed
  - peak_to_gene_or_region_to_gene_map
  - tf_annotation_list

outputs:
  input_inventory: results/tables/stage75a_input_inventory_v1.csv
  dependency_audit: results/tables/stage75a_dependency_audit_v1.csv
  regulatory_resource_gap_audit: results/tables/stage75a_regulatory_resource_gap_audit_v1.csv
  egrn_design_spec: results/tables/stage75a_egrn_design_spec_v1.csv
  state_specific_model_plan: results/tables/stage75a_state_specific_model_plan_v1.csv
  perturbation_engine_plan: results/tables/stage75a_perturbation_engine_plan_v1.csv
  claim_boundary_audit: results/tables/stage75a_claim_boundary_audit_v1.csv
  pass_fail: results/tables/stage75a_pass_fail_v1.csv
  report: results/reports/stage75a_scenicplus_celloracle_egrn_readiness_report_v1.md
  pi_summary: results/reports/stage75a_pi_summary_v1.md
  claim_boundary_final_check: results/reports/stage75a_claim_boundary_final_check_v1.md

safety:
  no_scenicplus_run: true
  no_celloracle_run: true
  no_model_training: true
  no_prediction_benchmark_update: true
  no_external_validation_claim: true
  no_causal_knockout_claim: true
  no_therapeutic_claim: true
  no_validated_grn_claim: true
