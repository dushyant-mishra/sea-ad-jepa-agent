stage: Stage61
version: v1
stage_name: Stage61_dlpfc_microglia_pvm_support_audit_v1
description: Controlled DLPFC Microglia-PVM H5AD acquisition, schema inspection, and regional support audit.

inputs:
  collection_api: https://api.cellxgene.cziscience.com/curation/v1/collections/1ca90a2d-2943-483d-b678-b809bf464c30
  dataset_id: 100c6145-7b0e-4ba6-81c1-ffebed0d1ac4
