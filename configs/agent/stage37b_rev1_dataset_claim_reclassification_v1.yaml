seed_manual_acquisition_candidates:
  - dataset_id: GSE160936
    dataset_name: GSE160936
    aliases: GSE160936;pTau;AT8;glial
    suggested_claim_level: external_biological_support_candidate
    reason: High-priority external biological support candidate for pTau/AT8-linked glial mechanisms if metadata and independence are confirmed.
  - dataset_id: ROSMAP_AMP_AD
    dataset_name: ROSMAP / AMP-AD
    aliases: ROSMAP;AMP-AD;AMPAD
    suggested_claim_level: manual_metadata_review_required
    reason: High-value validation data acquisition/manual metadata review candidate if access, frozen readouts, and independence are confirmed.

outputs:
  claim_level_matrix: results/tables/stage37b_rev1_dataset_claim_level_matrix_v1.csv
  reclassification_summary: results/tables/stage37b_rev1_reclassification_summary_v1.csv
