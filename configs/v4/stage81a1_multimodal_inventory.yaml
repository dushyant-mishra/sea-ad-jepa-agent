audit_policy:
  read_only_source_access: true
  no_downloads: true
  no_model_training: true
  pathology_schema_only: true
  pathology_values_used: false
  bounded_row_indices: [0, 1, 99, 20000, -1]
  canonical_gene_policy: preserve_source_symbol_and_ensembl_id_without_alias_conversion
  primary_expression_selection_rule: prefer_the_resolved_40k_microglia_pvm_matrix_for_immediate_v4a_compatibility_and_retain_the_full_source_for_stage81a2_vocabulary_design

primary_expression_candidate: sea_ad_mtg_microglia_pvm_expanded
stage81a2_vocabulary_source: sea_ad_mtg_full_source
