stage: stage75f_out_of_core_v1
description: >
  Out-of-core Stage75F preparation for bounded SCENIC+/pycisTarget execution.
  F1/F2 stream GSE174367 microglia-only snRNA/snATAC subsets from 10x HDF5
  into disk-backed sparse CSC arrays. Later steps create regulator/target/region
  batches for resumable motif-enrichment pilots. This stage does not infer a
  validated GRN, update prediction benchmarks, or make causal/therapeutic
  claims.

container_image: scenicplus:1.0a2-container.1

inputs:
  snrna_matrix: data/external/gse174367/GSE174367_snRNA-seq_filtered_feature_bc_matrix.h5
  snrna_metadata: data/external/gse174367/GSE174367_snRNA-seq_cell_meta.csv.gz
  snatac_matrix: data/external/gse174367/GSE174367_snATAC-seq_filtered_peak_bc_matrix.h5
  snatac_metadata: data/external/gse174367/GSE174367_snATAC-seq_cell_meta.csv.gz
  stage72b_edges: results/tables/stage72b_tf_target_candidate_edges_v1.csv
  stage75c_peak_to_gene: results/tables/stage75c_peak_to_gene_preflight_v1.csv
  stage75e_pycistarget_smoke: results/reports/stage75e_pycistarget_smoke_v1.json
  motif_annotation: data/external_resources/stage75b/motifs-v10nr_clust-nr.hgnc-m0.001-o0.0.tbl
  cistarget_rankings: data/external_resources/stage75b/hg38_screen_v10_clust.regions_vs_motifs.rankings.feather
  cistarget_scores: data/external_resources/stage75b/hg38_screen_v10_clust.regions_vs_motifs.scores.feather

metadata_schema:
  snrna:
    cell_type_column: Cell.Type
    microglia_label: MG
    sample_column: SampleID
    barcode_column: Barcode
  snatac:
    cell_type_column: Cell.Type
    microglia_label: MG
    sample_column: Sample.ID
    barcode_column: Barcode

streaming_10x:
  backend: hdf5
  sparse_nnz_chunk: 2000000
  progress_every_cells: 1000
  outputs:
    manifest_json: results/reports/stage75f_stream_microglia_10x_manifest_v1.json
    snrna:
      store: data/processed/stage75f/gse174367_mg_snrna.csc.h5
      cell_metadata: data/processed/stage75f/gse174367_mg_snrna_cell_metadata.parquet
      feature_metadata: data/processed/stage75f/gse174367_mg_snrna_feature_metadata.parquet
    snatac:
      store: data/processed/stage75f/gse174367_mg_snatac.csc.h5
      cell_metadata: data/processed/stage75f/gse174367_mg_snatac_cell_metadata.parquet
      feature_metadata: data/processed/stage75f/gse174367_mg_snatac_feature_metadata.parquet

regulators:
  primary_passed_all_stage74_gates:
    - IRF8
    - STAT1
  descriptive_secondary_hypotheses:
    - ELF1
    - RELA
    - BACH1
    - NRF1
    - SPI1
    - CEBPA
    - STAT3
    - MITF

batching:
  target_mode: stage72b_candidate_edges
  top_targets_per_tf: 50
  top_peaks_per_target: 10
  max_regions_per_batch: 5000
  peak_chunksize: 250000
  prefer_peak_classes:
    - promoter_proximal
    - proximal_100kb
  include_secondary_regulators: true
  purpose: out_of_core_prep_not_candidate_selection

cistarget_region_mapping:
  # Build the coordinate sidecar from the smaller scores database.
  database: scores
  column_batch_size: 4096
  mapping_chunksize: 250000
  schema_parity_sample_columns: 32

  # Match pycisTarget target_to_query:
  # overlap/query_length > 0.4 OR overlap/database_length > 0.4
  fraction_overlap: 0.4

  index_csv_gz: data/processed/stage75f/hg38_screen_v10_clust_scores_region_index_v2.csv.gz
  index_manifest_json: data/processed/stage75f/hg38_screen_v10_clust_scores_region_index_manifest_v2.json
  mapping_csv: results/tables/stage75f_cistarget_region_mapping_v1.csv
  coverage_csv: results/tables/stage75f_cistarget_region_coverage_v1.csv
  summary_json: results/reports/stage75f_cistarget_region_mapping_v1.json

outputs:
  candidate_edges: results/tables/stage75f_candidate_tf_target_edges_v1.csv
  candidate_peak_gene_links: results/tables/stage75f_candidate_peak_gene_links_v1.csv
  batch_manifest_csv: results/tables/stage75f_batch_manifest_v1.csv
  manifest_json: results/reports/stage75f_out_of_core_manifest_v1.json
  batch_dir: results/stage75f_batches

safety:
  prediction_benchmark_updated: false
  causal_validation_pass: false
  therapeutic_target_claim: false
  validated_grn_claim: false
  motif_enrichment_completed: false
  approved_wording: Model-based, enhancer-informed perturbation hypotheses requiring experimental validation.

cistarget_primary_pilot:
  tfs:
    - IRF8
    - STAT1

  # pycisTarget cisTarget defaults.
  auc_threshold: 0.005
  nes_threshold: 3.0
  rank_threshold_fraction: 0.05

  # Bounds temporary recovery-curve memory.
  recovery_motif_batch_size: 64

  output_dir: results/stage75f_motif_pilot
  outputs:
    all_motifs_csv_gz: results/tables/stage75f_primary_motif_enrichment_all_v1.csv.gz
    enriched_motifs_csv: results/tables/stage75f_primary_motif_enrichment_enriched_v1.csv
    motif_hits_csv: results/tables/stage75f_primary_motif_hits_v1.csv
    tf_support_summary_csv: results/tables/stage75f_primary_tf_motif_support_summary_v1.csv
    report_json: results/reports/stage75f_primary_motif_pilot_v1.json

primary_tf_region_gene_evidence:
  outputs:
    evidence_csv: results/tables/stage75f_primary_tf_region_gene_evidence_v1.csv
    target_summary_csv: results/tables/stage75f_primary_tf_target_gene_evidence_summary_v1.csv
    tf_summary_csv: results/tables/stage75f_primary_tf_region_gene_summary_v1.csv
    report_json: results/reports/stage75f_primary_tf_region_gene_evidence_v1.json

cistarget_secondary_pilot:
  # Ordered by the existing F4 batch IDs 3-10.
  tfs:
    - BACH1
    - CEBPA
    - ELF1
    - MITF
    - NRF1
    - RELA
    - SPI1
    - STAT3

  # Same cisTarget parameters used for the primary F5b pilot.
  auc_threshold: 0.005
  nes_threshold: 3.0
  rank_threshold_fraction: 0.05
  recovery_motif_batch_size: 64

  output_dir: results/stage75f_secondary_motif_pilot
  outputs:
    all_motifs_csv_gz: results/tables/stage75f_secondary_motif_enrichment_all_v1.csv.gz
    enriched_motifs_csv: results/tables/stage75f_secondary_motif_enrichment_enriched_v1.csv
    motif_hits_csv: results/tables/stage75f_secondary_motif_hits_v1.csv
    tf_support_summary_csv: results/tables/stage75f_secondary_tf_motif_support_summary_v1.csv
    report_json: results/reports/stage75f_secondary_motif_pilot_v1.json

secondary_tf_region_gene_evidence:
  outputs:
    evidence_csv: results/tables/stage75f_secondary_tf_region_gene_evidence_v1.csv
    target_summary_csv: results/tables/stage75f_secondary_tf_target_gene_evidence_summary_v1.csv
    tf_summary_csv: results/tables/stage75f_secondary_tf_region_gene_summary_v1.csv
    gate_csv: results/tables/stage75f_secondary_tf_evidence_gate_v1.csv
    report_json: results/reports/stage75f_secondary_tf_region_gene_evidence_v1.json
integrated_stage75_evidence_freeze:
  sources:
    primary_regulator_summary: results/tables/stage75f_primary_tf_region_gene_summary_v1.csv
    primary_tf_target_summary: results/tables/stage75f_primary_tf_target_gene_evidence_summary_v1.csv
    primary_motif_support_summary: results/tables/stage75f_primary_tf_motif_support_summary_v1.csv
    secondary_evidence_gate: results/tables/stage75f_secondary_tf_evidence_gate_v1.csv
    secondary_regulator_summary: results/tables/stage75f_secondary_tf_region_gene_summary_v1.csv
    secondary_tf_target_summary: results/tables/stage75f_secondary_tf_target_gene_evidence_summary_v1.csv
    secondary_motif_support_summary: results/tables/stage75f_secondary_tf_motif_support_summary_v1.csv
  tiers:
    Tier A:
      - STAT1
      - ELF1
      - SPI1
    Tier B:
      - IRF8
      - BACH1
      - CEBPA
      - RELA
    Tier C:
      - MITF
      - NRF1
      - STAT3
  parameters:
    cistarget_global_region_count: 1837304
    motif_count_per_batch: 5876
    overlap_threshold: 0.4
    auc_threshold: 0.005
    nes_threshold: 3.0
    recovery_rank_fraction: 0.05
  outputs:
    regulator_summary_csv: results/tables/stage75_integrated_regulator_summary_v1.csv
    tf_target_summary_csv: results/tables/stage75_integrated_tf_target_summary_v1.csv
    negative_regulator_gate_csv: results/tables/stage75_integrated_negative_regulator_gate_v1.csv
    manifest_json: results/reports/stage75_integrated_evidence_manifest_v1.json
stage76_directionality_audit:
  sources:
    integrated_regulator_summary: results/tables/stage75_integrated_regulator_summary_v1.csv
    integrated_tf_target_summary: results/tables/stage75_integrated_tf_target_summary_v1.csv
    integrated_negative_regulator_gate: results/tables/stage75_integrated_negative_regulator_gate_v1.csv
    integrated_manifest: results/reports/stage75_integrated_evidence_manifest_v1.json
  sign_thresholds:
    source: configs/agent/stage72b_external_morabito_micro_pvm_grn_construction_v1.yaml
    min_abs_spearman: 0.20
    min_bootstrap_sign_stability: 0.70
  direction_policy:
    desired_tf_change_requires_existing_tf_level_state_association: true
    if_absent: unresolved
    preserve_unresolved_simulation_directions: up_and_down
  outputs:
    signed_tf_target_csv: results/tables/stage76_signed_tf_target_hypotheses_v1.csv
    regulator_directionality_csv: results/tables/stage76_regulator_directionality_summary_v1.csv
    unresolved_directionality_csv: results/tables/stage76_unresolved_directionality_v1.csv
    report_json: results/reports/stage76_directionality_audit_v1.json
stage76_perturbation_readiness:
  sources:
    integrated_regulator_summary: results/tables/stage75_integrated_regulator_summary_v1.csv
    integrated_tf_target_summary: results/tables/stage75_integrated_tf_target_summary_v1.csv
    integrated_negative_regulator_gate: results/tables/stage75_integrated_negative_regulator_gate_v1.csv
    integrated_manifest: results/reports/stage75_integrated_evidence_manifest_v1.json
    signed_tf_target_hypotheses: results/tables/stage76_signed_tf_target_hypotheses_v1.csv
    regulator_directionality_summary: results/tables/stage76_regulator_directionality_summary_v1.csv
    unresolved_directionality: results/tables/stage76_unresolved_directionality_v1.csv
    directionality_report: results/reports/stage76_directionality_audit_v1.json
  jepa:
    checkpoint_path: results/models/microglia_pvm_jepa_ema_var_expanded_balanced_e40/gene_jepa_epoch_030.pt
    architecture_loader_path: src/sea_ad_jepa/evaluation_utils.py
    model_family: GeneJEPA
    feature_h5ad: data/processed/sea_ad_mtg_microglia_pvm_all_hvg3k_expanded_modules.h5ad
    feature_order_source: h5ad_var_index
    baseline_reference_embeddings: results/tables/microglia_pvm_jepa_ema_var_expanded_balanced_e30_cell_embeddings.csv
    preprocessing:
      matrix_source: h5ad_X
      feature_order: var_names
      assumed_transform_from_training_lineage: existing_processed_h5ad_values
      independent_preprocessing_verification_required: true
    deterministic_inference:
      subset_n_cells: 32
      batch_size: 64
      seed: 7
      device: cpu
    metadata_columns:
      - Donor ID
      - Brain Region
      - Class
      - Supertype
      - Overall AD neuropathological Change
  outputs:
    feature_coverage_csv: results/tables/stage76_jepa_feature_coverage_v1.csv
    edge_coverage_csv: results/tables/stage76_perturbation_graph_edge_coverage_v1.csv
    regulator_readiness_csv: results/tables/stage76_regulator_readiness_v1.csv
    baseline_reproduction_csv: results/tables/stage76_jepa_baseline_reproduction_v1.csv
    report_json: results/reports/stage76_perturbation_readiness_v1.json
