name: G7 #476 exact-type review against immutable Macha #482 (fixture only)
on:
  pull_request:
    paths:
      - 'scripts/v5/td_real_g7_content_enforcement_v1.py'
      - 'tests/v5/test_td_real_g7_content_enforcement_v1_macha_476_red.py'
      - '.github/workflows/td-g7-476-macha482-exact-type-recheck.yml'
permissions:
  contents: read
jobs:
  exact-type-hostile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Entire original Macha #482 independent review unchanged
        run: python -m pytest -q -rA tests/v5/test_td_real_g7_content_enforcement_v1_macha_476_red.py
      - name: Inherited G7 content and V3 tests except external R1/R1D/R2 physical blockers
        run: >-
          python -m pytest -q
          tests/v5/test_td_real_g7_content_enforcement_v1.py
          tests/v5/test_td_real_g7_content_enforcement_v1_macha_hostile.py
          tests/v5/test_td_real_g7_content_enforcement_v1_macha_recheck.py
          tests/v5/test_td_real_g7_content_enforcement_v1_macha_470_red.py
          tests/v5/test_td_real_g7_terminal_decision_v3.py
          -k "not test_r1_ and not test_r2_ and not test_r1d_"
