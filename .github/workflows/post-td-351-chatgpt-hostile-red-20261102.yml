name: Post-TD PR351 GPT hostile RED characterization (no acceptance)

on:
  pull_request:
    paths:
      - "tests/v5/test_jepa_post_td_351_chatgpt_hostile_red_20261102.py"
      - ".github/workflows/post-td-351-chatgpt-hostile-red-20261102.yml"
      - "scripts/v5/jepa_post_td_harness_contract_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserved-red:
    name: Five expected RED cases / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all five original source defects reproduce as expected failures
        run: python tests/v5/test_jepa_post_td_351_chatgpt_hostile_red_20261102.py
