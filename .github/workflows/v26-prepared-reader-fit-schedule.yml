name: V26 prepared reader-fit schedule synthetic proof
on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/v5/prepared_reader_fit_development_schedule_v1.py'
      - 'tests/test_v26_prepared_reader_fit_development_schedule_v1.py'
      - '.github/workflows/v26-prepared-reader-fit-schedule.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepared-schedule-parity-and-spillover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact CPU fixtures
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pytest==8.3.4
      - name: Run prepared parity plus frozen-population predecessor tests
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q \
            tests/test_v26_prepared_reader_fit_development_schedule_v1.py \
            tests/test_v26_reader_fit_development_sampler_v1.py \
            tests/test_v26_reader_fit_population_preflight_v1.py \
            tests/test_v26_frozen_pass1_reader_fit_count_bridge_v1.py \
            --junitxml=/tmp/v26-prepared.xml
      - name: Require exact test count zero skips and adversarial controls
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse("/tmp/v26-prepared.xml").getroot()
          suite=root if root.tag=="testsuite" else root.find("testsuite")
          if suite is None: raise SystemExit("STOP_MISSING_JUNIT_SUITE")
          count={k:int(suite.attrib.get(k,0)) for k in ("tests","skipped","failures","errors")}
          cases={x.attrib.get("name","").split("[")[0] for x in suite.iter("testcase")}
          required={
            "test_prepared_replays_original_pr135_exactly",
            "test_planned_contiguous_cursors_match_separate_single_update_replay",
            "test_prepared_one_time_index_requires_no_per_update_argsort",
            "test_population_snapshot_is_not_physical_authority",
            "test_frozen_synthetic_input_mutation_after_prepare_does_not_change_snapshot",
            "test_per_cursor_cell_uniqueness_and_marginal_q",
            "test_capacity_violation_rejected_before_rng_draw",
            "test_overflowing_schedule_and_zero_horizon_fail",
            "test_real_factory_requires_actual_frozen_sources",
            "test_exact_positive_control_and_no_training_authority",
            "test_even_potential_capacity_oversubscription_rejected_before_draw",
          }
          if count["tests"]!=99 or any(count[k] for k in ("skipped","failures","errors")) or not required<=cases:
            raise SystemExit(f"STOP_PREPARED_SCHEDULE_INCOMPLETE {count} missing={sorted(required-cases)}")
          print(f"PASS_PREPARED_READER_FIT_SYNTHETIC_ONLY {count['tests']} passed; zero skipped")
          PY
