name: V5 journal v2 linear checkpoint read budget (NO TRAINING)
on:
  pull_request:
    paths:
      - scripts/v5/jepa_synth2048_attempt_journal_v2.py
      - tests/test_jepa_synth2048_attempt_journal_v2_incremental_io_sol_red.py
      - .github/workflows/jepa-v5-journal-v2-incremental-io-no-training.yml
      - docs/agent/JEPA_20261105_V5_JOURNAL_V2_INCREMENTAL_IO_LOCAL_RESOURCE_BUDGET_NO_TRAINING.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-bytes-and-corruption-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.9", "3.12.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Byte-read-budget regression, stale metadata, audit full scrub
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_jepa_synth2048_attempt_journal_v2_incremental_io_sol_red.py
      - name: Retain all Macha original V2 and Sol fork regression behavior
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_jepa_synth2048_attempt_journal_v2.py \
            tests/test_jepa_synth2048_attempt_journal_v2_macha_red.py \
            tests/test_jepa_synth2048_attempt_journal_v2_macha_controls.py \
            tests/test_jepa_synth2048_attempt_journal_v2_fork_writer_sol_red.py
