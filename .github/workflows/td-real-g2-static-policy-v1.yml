name: TD real G2 static policy V1

on:
  push:
    branches:
      - implementation/td-real-g2-static-policy-v1-20261014
  pull_request:
    paths:
      - 'scripts/v5/td_real_g2_static_policy_v1.py'
      - 'tests/v5/test_td_real_g2_static_policy_v1.py'
      - '.github/workflows/td-real-g2-static-policy-v1.yml'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Run G2 static-policy RED
        run: python -m pytest -q tests/v5/test_td_real_g2_static_policy_v1.py
      - name: Authority guard
        run: |
          ! grep -R "REAL_TRAINING_ON\|STAGE4_AUTHORIZED\|TARGET_WINNER_" scripts/v5/td_real_g2_static_policy_v1.py 2>/dev/null
