name: V27 independent candidate authority audit
on:
  pull_request:
    paths:
      - 'scripts/v5/v27_six_candidate_authority_audit_v1.py'
      - 'tests/test_v27_six_candidate_authority_audit_v1.py'
      - '.github/workflows/v27-six-candidate-validators.yml'
      - 'docs/agent/JEPA_V27_INDEPENDENT_REPLAY_AND_ROOT_AUDIT_20260926.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-role-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.4
      - name: Exercise all six defining class validators without granting closure
        run: |
          PYTHONPATH=src:. python scripts/v5/v27_six_candidate_authority_audit_v1.py . /tmp/v27_candidate_authority_audit.json
      - name: Run exact adversarial corpus, zero-skip census
        run: PYTHONPATH=src:. python -m pytest -q tests/test_v27_six_candidate_authority_audit_v1.py --junitxml=/tmp/v27_authority_tests.xml
      - name: Fail on vacuous, skipped, failed or missing negative controls
        run: |
          python - <<'PY'
          from xml.etree import ElementTree as ET
          suite=ET.parse('/tmp/v27_authority_tests.xml').getroot()
          if suite.tag!='testsuite': suite=suite.find('testsuite')
          if suite is None: raise SystemExit('STOP_NO_V27_CENSUS')
          counts={k:int(suite.get(k,0)) for k in ('tests','skipped','errors','failures')}
          names={x.get('name') for x in suite.iter('testcase')}
          required={'test_all_six_original_candidate_validators_pass_and_none_close',
                    'test_registry_observation_role_splicing_rejected',
                    'test_registry_model_field_leakage_rejected',
                    'test_rng_false_self_digest_rejected',
                    'test_mask_parameter_wrong_role_digest_rejected',
                    'test_missing_candidate_cannot_be_reported_valid'}
          if counts['tests']!=11 or any(counts[k] for k in ('skipped','errors','failures')) or not required<=names:
            raise SystemExit(f'STOP_V27_TEST_GAP {counts} missing={sorted(required-names)}')
          print('PASS_V27_SIX_CANDIDATE_VALIDATION 11 tests 0 skipped, not training authority')
          PY
