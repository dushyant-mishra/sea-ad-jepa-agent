name: v64-runtime-core-reconciliation

on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/v5/prefreeze_runtime_authority.py'
      - 'src/sea_ad_jepa/v5/inactive_guarded_update_v1.py'
      - 'src/sea_ad_jepa/v5/inactive_checkpoint_binding_v1.py'
      - 'src/sea_ad_jepa/v5/inactive_update_reference.py'
      - 'tests/test_v5_prefreeze_runtime_authority_reconciliation.py'
      - 'tests/test_v5_prefreeze_runtime_authority_redteam.py'
      - 'tests/test_v5_prefreeze_runtime_torch_integration.py'
      - 'tests/test_v5_canonical_runtime_convergence_red.py'
      - 'tests/test_v5_prefreeze_checkpoint_binding_v1.py'
      - 'tests/test_teacher_student_v5_inactive_update_reference.py'
      - 'tests/test_v5_durable_checkpoint_completion_v1.py'
      - 'docs/agent/JEPA_V64_RUNTIME_CORE_RECONCILIATION_20261006.md'
      - '.github/workflows/v64-runtime-core-reconciliation.yml'
      - 'docs/agent/JEPA_PREMISE_QUALIFICATION_V3_STATE_20261006.json'
  push:
    branches:
      - 'reconcile/v64-runtime-core-onto-prefreeze-main-20261006'
    paths:
      - 'src/sea_ad_jepa/v5/prefreeze_runtime_authority.py'
      - 'src/sea_ad_jepa/v5/inactive_guarded_update_v1.py'
      - 'src/sea_ad_jepa/v5/inactive_checkpoint_binding_v1.py'
      - 'src/sea_ad_jepa/v5/inactive_update_reference.py'
      - 'tests/test_v5_prefreeze_runtime_authority_reconciliation.py'
      - 'tests/test_v5_prefreeze_runtime_authority_redteam.py'
      - 'tests/test_v5_prefreeze_runtime_torch_integration.py'
      - 'tests/test_v5_canonical_runtime_convergence_red.py'
      - 'tests/test_v5_prefreeze_checkpoint_binding_v1.py'
      - 'tests/test_teacher_student_v5_inactive_update_reference.py'
      - 'tests/test_v5_durable_checkpoint_completion_v1.py'
      - 'docs/agent/JEPA_V64_RUNTIME_CORE_RECONCILIATION_20261006.md'
      - '.github/workflows/v64-runtime-core-reconciliation.yml'
      - 'docs/agent/JEPA_PREMISE_QUALIFICATION_V3_STATE_20261006.json'

jobs:
  runtime-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: >-
          python -m pip install pytest numpy torch
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple
      - name: Run focused runtime reconciliation tests
        env:
          PYTHONPATH: src:.
        run: >-
          python -m pytest -q
          tests/test_v5_prefreeze_runtime_authority_reconciliation.py
          tests/test_v5_prefreeze_runtime_authority_redteam.py
          tests/test_v5_prefreeze_runtime_torch_integration.py
          tests/test_v5_canonical_runtime_convergence_red.py
          tests/test_v5_prefreeze_checkpoint_binding_v1.py
          tests/test_teacher_student_v5_inactive_update_reference.py
          tests/test_v5_durable_checkpoint_completion_v1.py
