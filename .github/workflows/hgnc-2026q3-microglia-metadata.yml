name: HGNC 2026 microglia mapping check
on:
  push:
    paths:
      - 'analysis/therapeutic_perturbation_etl/scripts/hgnc_2026q3_microglia_metadata_crosswalk_v1.py'
      - 'analysis/therapeutic_perturbation_etl/scripts/test_hgnc_2026q3_microglia_metadata_crosswalk_v1.py'
      - 'analysis/therapeutic_perturbation_etl/scripts/freeze_verified_microglia_hgnc_v1.py'
      - 'analysis/therapeutic_perturbation_etl/scripts/test_freeze_verified_microglia_hgnc_v1.py'
      - 'analysis/therapeutic_perturbation_etl/scripts/gse335887_target_row_coverage_v1.py'
      - 'analysis/therapeutic_perturbation_etl/scripts/test_gse335887_target_row_coverage_v1.py'
      - '.github/workflows/hgnc-2026q3-microglia-metadata.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal frozen-contract dependency
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Run tests
        run: python -m unittest -v analysis/therapeutic_perturbation_etl/scripts/test_hgnc_2026q3_microglia_metadata_crosswalk_v1.py
      - name: FrozenAnnotation contract tests
        run: python -m unittest -v analysis/therapeutic_perturbation_etl/scripts/test_freeze_verified_microglia_hgnc_v1.py
      - name: Check published sources
        run: python analysis/therapeutic_perturbation_etl/scripts/hgnc_2026q3_microglia_metadata_crosswalk_v1.py --repo . --out HGNC_2026Q3_MICROGLIA_METADATA_CROSSWALK_V1.json
      - name: Freeze verified HGNC primary IDs through existing feature contract
        run: python analysis/therapeutic_perturbation_etl/scripts/freeze_verified_microglia_hgnc_v1.py --crosswalk-json HGNC_2026Q3_MICROGLIA_METADATA_CROSSWALK_V1.json --out GSE335887_PRIMARY_HGNC_FROZEN_ANNOTATION_V1.json
      - name: Assert no invented assay or training authority
        run: |
          python - <<'PY'
          import json
          x=json.load(open('GSE335887_PRIMARY_HGNC_FROZEN_ANNOTATION_V1.json'))
          assert x['HGNC_source_sha256']=='e73e9259177884b5994fc81ed733c1b3d4df34c84290bc9dddc86e960d5d6419'
          assert x['mapped_common_measured_feature_labels']==13373
          assert x['unresolved_shared_feature_count']==116
          assert x['mapped_common_intervention_target_labels']==31
          assert not x['full104_alignment_authorized'] and not x['training_authorized']
          assert not x['assay_detection_masks_verified'] and not x['perturbation_prediction_authorized']
          print('PASS: source-pinned existing feature contract, no biological/prediction authority')
          PY
      - name: Adversarial per-target published-row metadata tests
        run: python -m unittest -v analysis/therapeutic_perturbation_etl/scripts/test_gse335887_target_row_coverage_v1.py
      - name: Physically authenticate per-target published-row support without DE/FDR values
        run: |
          python analysis/therapeutic_perturbation_etl/scripts/gse335887_target_row_coverage_v1.py \
            --repo . --frozen-annotation-json GSE335887_PRIMARY_HGNC_FROZEN_ANNOTATION_V1.json \
            --out GSE335887_TARGET_SPECIFIC_PUBLISHED_DE_ROW_SUPPORT_V1.json
      - name: Bound the claims to released DE rows, not the raw assay
        run: |
          python - <<'PY'
          import json
          r=json.load(open("GSE335887_TARGET_SPECIFIC_PUBLISHED_DE_ROW_SUPPORT_V1.json"))
          assert r["targets"]==31 and len(r["per_target"])==31
          assert r["shared_screenwide_published_gene_label_count"]==13489
          assert r["shared_primary_HGNC_count"]==13373
          assert r["raw_assay_gene_detection_NOT_VERIFIED"] and r["no_effect_or_FDR_values_examined"]
          assert r["independent_confirmation_NOT_AUTHORIZED"] and not r["jepa_training_authorized"]
          assert sum(x["iTF_published_self_row"] for x in r["per_target"])==30
          assert sum(x["iMG_published_self_row"] for x in r["per_target"])==29
          print("PASS: genuine two-screen, 31-target released-row support; assay chemistry/QC still open")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HGNC-2026Q3-MICROGLIA-METADATA
          path: |
            HGNC_2026Q3_MICROGLIA_METADATA_CROSSWALK_V1.json
            GSE335887_PRIMARY_HGNC_FROZEN_ANNOTATION_V1.json
            GSE335887_TARGET_SPECIFIC_PUBLISHED_DE_ROW_SUPPORT_V1.json
