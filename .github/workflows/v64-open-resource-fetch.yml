name: V64 fetch open promoter-regulatory resources

on:
  pull_request:
    paths:
      - 'results/v64/V64_OPEN_RESOURCE_FETCH_MANIFEST_V1.json'
      - 'scripts/v64/fetch_open_promoter_resources_v1.py'
      - 'scripts/v64/validate_open_promoter_resource_bytes_v1.py'
      - 'scripts/v64/build_promoter_dual_ledger_v2.py'
      - '.github/workflows/v64-open-resource-fetch.yml'
  workflow_dispatch:

jobs:
  fetch-open-resources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch public resources and bind exact hashes
        run: |
          python scripts/v64/fetch_open_promoter_resources_v1.py \
            --download \
            --manifest results/v64/V64_OPEN_RESOURCE_FETCH_MANIFEST_V1.json \
            --outdir open_resource_cache_v1 \
            --receipt V64_OPEN_RESOURCE_FETCH_RECEIPT_V1.json
      - name: Validate downloaded bytes fail-closed
        run: |
          python scripts/v64/validate_open_promoter_resource_bytes_v1.py \
            --fetch-receipt V64_OPEN_RESOURCE_FETCH_RECEIPT_V1.json \
            --output V64_OPEN_RESOURCE_BYTE_VALIDATION_RECEIPT_V1.json
      - name: Install ledger dependency
        run: python -m pip install openpyxl
      - name: Build annotation-first dual promoter ledger
        run: |
          mkdir -p promoter_dual_ledger_v2
          python scripts/v64/build_promoter_dual_ledger_v2.py \
            --gencode-gtf open_resource_cache_v1/GENCODE_V50_COMPREHENSIVE_CHR_GTF__01__gencode.v50.annotation.gtf.gz \
            --screen-pls open_resource_cache_v1/SCREEN_REGISTRY_V4_GRCH38_PLS__01__GRCh38-cCREs.PLS.bed \
            --dong-data7 open_resource_cache_v1/DONG_ROUSSOS_2024_AUTOMATED_SUPPLEMENTS_7_9__01__41467_2024_54448_MOESM9_ESM.xlsx \
            --fantom-bed 'open_resource_cache_v1/FANTOM5_HG38_CAGE_PEAK_COORDINATES__01__hg38_fair+new_CAGE_peaks_phase1and2.bed.gz' \
            --transcript-output promoter_dual_ledger_v2/PROMOTER_TRANSCRIPT_LEDGER.tsv.gz \
            --tss-output promoter_dual_ledger_v2/EXACT_TSS_LEDGER.tsv.gz \
            --membership-output promoter_dual_ledger_v2/TRANSCRIPT_TO_TSS_MEMBERSHIP.tsv.gz \
            --receipt promoter_dual_ledger_v2/V65_PROMOTER_DUAL_LEDGER_RECEIPT_V1.json
      - name: Enforce frozen denominator counts
        run: |
          python - <<'PY'
          import json
          p=json.load(open("promoter_dual_ledger_v2/V65_PROMOTER_DUAL_LEDGER_RECEIPT_V1.json"))
          assert p["transcript_promoter_records"] == 644292, p
          assert p["exact_tss_loci"] == 389280, p
          assert p["genes"] == 78733, p
          assert p["denominator_rule"] == "Evidence annotates GENCODE candidates and never removes them."
          e=p["exact_tss_evidence_coverage"]
          assert e["screen_pls_overlap"] == 178778, e
          assert e["fantom_same_strand_overlap"] == 126712, e
          assert e["fantom_exact_representative_tss"] == 25321, e
          assert e["screen_fantom_joint_states"] == {
              "screen_and_fantom":102060,
              "screen_only":76718,
              "fantom_only":24652,
              "neither":185850,
          }, e
          print("DUAL_LEDGER_DENOMINATORS_AND_EVIDENCE_PASS",
                p["transcript_promoter_records"], p["exact_tss_loci"], p["genes"], e)
          PY
      - name: Show custody receipts
        run: |
          cat V64_OPEN_RESOURCE_FETCH_RECEIPT_V1.json
          cat V64_OPEN_RESOURCE_BYTE_VALIDATION_RECEIPT_V1.json
          cat promoter_dual_ledger_v2/V65_PROMOTER_DUAL_LEDGER_RECEIPT_V1.json
      - name: Upload exact resource bytes, ledgers and receipts
        uses: actions/upload-artifact@v4
        with:
          name: v65-open-promoter-resources-and-dual-ledger
          path: |
            open_resource_cache_v1/
            promoter_dual_ledger_v2/
            V64_OPEN_RESOURCE_FETCH_RECEIPT_V1.json
            V64_OPEN_RESOURCE_BYTE_VALIDATION_RECEIPT_V1.json
          if-no-files-found: error
          retention-days: 30
