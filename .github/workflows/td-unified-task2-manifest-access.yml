name: TD unified Task 2 manifest access

on:
  pull_request:
    paths:
      - 'scripts/v5/td_unified/manifest_v1.py'
      - 'schemas/target_discovery/unified_v1/**'
      - 'tests/v5/td_unified/test_manifest_v1.py'
      - 'tests/v5/td_unified/test_manifest_access_session_v1.py'
      - 'tests/v5/td_unified/test_manifest_population_custody_v1.py'
      - 'docs/agent/UNIFIED_TASK2_EXECUTION_LEDGER_20261015.md'
      - '.github/workflows/td-unified-task2-manifest-access.yml'

jobs:
  task2-manifest-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'pytest>=9,<10' 'numpy>=2,<3'
      - name: Run Unified Task 2 manifest/access RED-GREEN suite
        run: python -m pytest -q tests/v5/td_unified/test_manifest_v1.py tests/v5/td_unified/test_manifest_access_session_v1.py tests/v5/td_unified/test_manifest_population_custody_v1.py
      - name: Run accepted Task 1 regression
        run: python -m pytest -q tests/v5/td_unified/test_canonical_v1.py tests/v5/td_unified/test_authority_v1.py tests/v5/td_unified/test_task1_macha_repairs_v1.py
