name: Unified Task 5 fixture handoff firewall
on:
  pull_request:
    paths:
      - 'scripts/v5/td_unified/casebundle_v1.py'
      - 'scripts/v5/td_unified/mode_equivalence_v1.py'
      - 'tests/v5/td_unified/test_task5_fixture_handoff_v1.py'
      - '.github/workflows/td-unified-task5-fixture-handoff.yml'
permissions:
  contents: read
jobs:
  task5-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1 numpy==1.26.4
      - name: Task5 scientific and authority firewalls
        run: python -m pytest -q tests/v5/td_unified/test_task5_fixture_handoff_v1.py
