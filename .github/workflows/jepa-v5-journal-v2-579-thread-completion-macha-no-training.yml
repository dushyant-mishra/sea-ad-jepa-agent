name: V5 journal v2 #579 review - attempt-thread recovery, completion mirror, loader workers (Macha, NO TRAINING)
on:
  pull_request:
    paths:
      - scripts/v5/jepa_synth2048_attempt_journal_v2.py
      - tests/test_jepa_synth2048_attempt_journal_v2*.py
      - .github/workflows/jepa-v5-journal-v2-579-thread-completion-macha-no-training.yml
      - scripts/v5/jepa_v5_ci_explicit_nonstepping_allowlist_v1.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fake-bytes-thread-loader-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.9", "3.12.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest and CPU-only PyTorch (DataLoader workers only; no model)
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1"
      - name: Fail closed on new/unsafe test files before ANY pytest collection
        run: python scripts/v5/jepa_v5_ci_explicit_nonstepping_allowlist_v1.py --suite thread --verify
      - name: Macha #579 review RED and controls (fake bytes, no optimizer)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_jepa_synth2048_attempt_journal_v2_macha_579_review_red.py \
            tests/test_jepa_synth2048_attempt_journal_v2_macha_579_review_controls.py
      - name: Every earlier V2 journal suite unchanged (Sol #570/#573/#574/#579, Macha #572/#577)
        env:
          PYTHONPATH: .
        run: python scripts/v5/jepa_v5_ci_explicit_nonstepping_allowlist_v1.py --suite thread --pytest
      - name: I/O read budget (1 KiB fake states, 40 updates)
        env:
          PYTHONPATH: .
        run: python scripts/v5/measure_attempt_journal_v2_io_no_training.py ci "$RUNNER_TEMP/io" 1024 40
