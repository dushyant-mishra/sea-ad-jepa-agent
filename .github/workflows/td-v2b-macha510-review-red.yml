name: TD V2B Macha #510 review (tests only; RED expected)
on:
  pull_request:
    paths:
      - 'tests/v5/td_unified/test_v2b_public_student_gate_510_macha_review_red.py'
      - 'tests/v5/td_unified/test_v2_bound_content_502_macha_review_red.py'
      - '.github/workflows/td-v2b-macha510-review-red.yml'
permissions:
  contents: read
jobs:
  inherited-510-unchanged:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        numpy: ['1.26.4', '2.2.6']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1 numpy==${{ matrix.numpy }}
      - name: '#510 suites, unchanged'
        run: >-
          python -m pytest -q -rf
          tests/v5/td_unified/test_observation_v2b_public_student_gate.py
          tests/v5/td_unified/test_observation_normalization_v2_bound_content.py
          tests/v5/td_unified/test_observation_v2_private_pair_coherence_v1.py
          tests/v5/td_unified/test_observation_v2_503_with_macha504_a4_integration.py
          tests/v5/td_unified/test_q_excluded_depth_v1_a4_repair.py

  macha510-review:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        numpy: ['1.26.4', '2.2.6']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1 numpy==${{ matrix.numpy }}
      - name: Unchanged Macha #507 reviewer file is byte-identical (blob d5981430)
        shell: bash
        run: test "$(git hash-object tests/v5/td_unified/test_v2_bound_content_502_macha_review_red.py)" = d59814301715bbffe3e07501fe7be305358140cc
      - name: 'Macha #510 hostile review + unchanged #507 (14 RED expected at ef51325d)'
        run: >-
          python -m pytest -q -rf
          tests/v5/td_unified/test_v2b_public_student_gate_510_macha_review_red.py
          tests/v5/td_unified/test_v2_bound_content_502_macha_review_red.py
