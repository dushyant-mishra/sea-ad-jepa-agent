name: V21 authority restoration guard

on:
  push:
    branches:
      - 'repair/t0-v21-*'
      - 'review/t0-v21-*'
    paths:
      - 'scripts/v4/t0_v21_authority_v1.py'
      - 'scripts/v4/t0_v21_authority_legacy_v1.py.txt'
      - 'scripts/v4/t0_v21_selection_and_power_v1.py'
      - 'scripts/v4/test_t0_v21_authority_v1.py'
      - 'scripts/v4/test_t0_v21_authority_restoration_v2.py'
      - 'scripts/v4/test_t0_v21_authority_api_surface_v1.py'
      - 'scripts/v4/test_t0_v21_selection_and_power_v1.py'
      - 'scripts/v4/test_t0_v21_measurement_and_freeze_v1.py'
      - '.github/workflows/v21-authority-restoration-tests.yml'
  pull_request:
    paths:
      - 'scripts/v4/t0_v21_authority_v1.py'
      - 'scripts/v4/t0_v21_authority_legacy_v1.py.txt'
      - 'scripts/v4/t0_v21_selection_and_power_v1.py'
      - 'scripts/v4/test_t0_v21_authority_v1.py'
      - 'scripts/v4/test_t0_v21_authority_restoration_v2.py'
      - 'scripts/v4/test_t0_v21_authority_api_surface_v1.py'
      - 'scripts/v4/test_t0_v21_selection_and_power_v1.py'
      - 'scripts/v4/test_t0_v21_measurement_and_freeze_v1.py'
      - '.github/workflows/v21-authority-restoration-tests.yml'
  workflow_dispatch:

jobs:
  verify-restoration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip pytest numpy scipy
      - name: Compile active authority modules
        run: python -m py_compile scripts/v4/t0_v21_authority_v1.py scripts/v4/t0_v21_selection_and_power_v1.py
      - name: Run authority restoration and API-surface guards
        run: python -m pytest -q scripts/v4/test_t0_v21_authority_v1.py scripts/v4/test_t0_v21_authority_restoration_v2.py scripts/v4/test_t0_v21_authority_api_surface_v1.py
      - name: Run executor successor regression suite
        run: python -m pytest -q scripts/v4/test_t0_v21_selection_and_power_v1.py
      - name: Run measurement and freeze regression suite
        run: python -m pytest -q scripts/v4/test_t0_v21_measurement_and_freeze_v1.py
