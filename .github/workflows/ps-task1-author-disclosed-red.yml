name: PS Task 1 author-disclosed RED

on:
  pull_request:
    branches:
      - implementation/production-synthetic-v3-1-1-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task1-task2-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install --upgrade pip "pytest==9.1.1" "numpy==2.4.6"
      - name: Existing Task 1 and Task 2 suites
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/production_synthetic/test_canonical_v1.py \
            tests/production_synthetic/test_custody_v1.py \
            tests/production_synthetic/test_custody_v1_hostile.py
      - name: Author-disclosed Task 1 RED
        if: always()
        run: python -m pytest -q -p no:cacheprovider -rA tests/production_synthetic/test_canonical_v1_author_disclosed_red.py
