name: TD relational successor focused qualification

on:
  push:
    branches:
      - science/td-fine-rare-relational-successor-prefreeze-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scipy scikit-learn
      - name: Record exact environment
        run: |
          set -euo pipefail
          mkdir -p qualification
          HEAD="$(git rev-parse HEAD)"
          STATUS="$(git status --short)"
          test -z "$STATUS"
          {
            echo "HEAD=$HEAD"
            echo "STATUS_BEFORE=[]"
            python --version
            python - <<'PY'
          import numpy, pandas, scipy, sklearn, pytest
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('scipy', scipy.__version__)
          print('sklearn', sklearn.__version__)
          print('pytest', pytest.__version__)
          PY
          } | tee qualification/environment.txt
      - name: Compile TD implementation
        run: |
          set -o pipefail
          python -m compileall -q scripts/v5 | tee qualification/compileall.txt
      - name: Run TD relational successor qualification tests
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/v5/test_td_test_qualification_package_v1.py \
            tests/v5/test_td_test_of_test_controller_v1.py \
            tests/v5/test_td_relational_successor_estimability_v1.py \
            tests/v5/test_td_relational_successor_gate_v1.py \
            tests/v5/test_td_relational_successor_synthetic_adapter_v1.py \
            tests/v5/test_td_relational_successor_observed_executor_v1.py \
            tests/v5/test_td_relational_successor_prepared_context_v1.py \
            tests/v5/test_td_relational_successor_capability_reducer_v1.py \
            tests/v5/test_td_relational_successor_qualification_runner_v1.py \
            tests/v5/test_td_relational_successor_readiness_v1.py \
            | tee qualification/pytest-focused.txt
      - name: Run branch-local relational replay spillover tests
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/v5/test_build_td_relational_replay_manifest.py \
            tests/v5/test_run_td_relational_replay_preflight.py \
            tests/v5/test_audit_td_relational_replay_mapping_preflight.py \
            | tee qualification/pytest-spillover.txt
      - name: Confirm tracked worktree unchanged
        run: |
          STATUS="$(git status --short --untracked-files=no)"
          echo "STATUS_AFTER_TRACKED=[$STATUS]" | tee qualification/worktree.txt
          test -z "$STATUS"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td-relational-successor-qualification-${{ github.sha }}
          path: qualification/
          if-no-files-found: error
          retention-days: 90
