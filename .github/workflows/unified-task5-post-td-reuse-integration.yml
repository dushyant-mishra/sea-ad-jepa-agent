name: Unified Task5 and existing post-TD harness integration
on:
  pull_request:
    paths:
      - 'scripts/v5/td_unified/**'
      - 'scripts/v5/jepa_post_td_*.py'
      - 'tests/v5/td_unified/test_*fixture*.py'
      - 'tests/v5/test_jepa_post_td_*.py'
      - '.github/workflows/unified-task5-post-td-reuse-integration.yml'
permissions:
  contents: read
jobs:
  fixture-and-existing-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies for inherited accepted test infrastructure
        run: python -m pip install pytest==9.1.1 numpy==1.26.4
      - name: Run Task5 and Task5 to post-TD bridge
        run: >-
          python -m pytest -q
          tests/v5/td_unified/test_task5_fixture_handoff_v1.py
          tests/v5/td_unified/test_post_td_fixture_bridge_v1.py
      - name: Run existing post-TD harness suites, unchanged
        run: >-
          python -m pytest -q
          tests/v5/test_jepa_post_td_harness_contract_v1.py
          tests/v5/test_jepa_post_td_c4_requires_c6_v1.py
          tests/v5/test_jepa_post_td_rehearsal_preflight_v1.py
          tests/v5/test_jepa_post_td_tournament_controller_v1.py
          tests/v5/test_jepa_post_td_presentation_ema_v1.py
