name: V26 G3 explicit attacker objective synthetic preflight
on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/v5/g3_explicit_attacker_fit_objective_v1.py'
      - 'tests/test_v26_g3_explicit_attacker_fit_objective_v1.py'
      - '.github/workflows/v26-g3-fit-objective-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fit-objective-mass-and-row-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pytest==8.3.4
      - name: Run synthetic G3 controls and record JUnit census
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q tests/test_v26_g3_explicit_attacker_fit_objective_v1.py --junitxml=/tmp/g3.xml
      - name: Reject missing or skipped adversaries
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/g3.xml').getroot()
          suite=root if root.tag=='testsuite' else root.find('testsuite')
          if suite is None: raise SystemExit('STOP_MISSING_G3_SUITE')
          counts={k:int(suite.attrib.get(k,0)) for k in ('tests','skipped','failures','errors')}
          tests={x.attrib.get('name','').split('[')[0] for x in suite.iter('testcase')}
          required={
            'test_weighted_sufficient_statistics_match_independent_row_level_reference',
            'test_conflicting_source_effects_change_fit_objective_without_changing_data',
            'test_historical_cell_mass_is_not_donor_uniform',
            'test_no_implicit_fit_objective',
            'test_no_heldout_or_unexpected_donor_sufficient_statistics',
            'test_nonfinite_moments_do_not_produce_false_clean_fit',
            'test_equal_donor_counts_recover_cell_equals_donor_uniform',
            'test_all_constant_targets_return_zero_without_pretending_scientific_power',
          }
          if counts['tests']!=28 or any(counts[k] for k in ('skipped','failures','errors')) or not required<=tests:
            raise SystemExit(f'STOP_G3_INCOMPLETE {counts} missing={sorted(required-tests)}')
          print(f'PASS_G3_SYNTHETIC_ONLY {counts["tests"]} passed, zero skipped')
          PY
