name: V5 Sol independent #581/#582 optimizer group identity RED/GREEN (NO TRAINING)
on:
  pull_request:
    paths:
      - scripts/v5/jepa_v5_structured_journal_preflight_v1.py
      - tests/test_jepa_v5_structured_journal_preflight_v1_sol_optimizer_identity_red.py
      - .github/workflows/jepa-v5-sol-independent-macha581-582-optimizer-identity-no-training.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabricated-cpu-snapshot-no-step:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.9", "3.12.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest and CPU-only torch (no datasets / GPU)
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1"
      - name: Original #581 structure tests and Sol new hostile named optimizer-ID test
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_jepa_v5_structured_journal_preflight_v1_macha_structure_red.py \
            tests/test_jepa_v5_structured_journal_preflight_v1_sol_optimizer_identity_red.py
