name: V5 full-state READ ONLY optimizer coverage (NO STEPS OR TRAINING)
on:
  pull_request:
    paths:
      - scripts/v5/jepa_v5_full_state_readonly_audit_v1.py
      - tests/test_jepa_v5_full_state_readonly_audit_v1.py
      - docs/agent/JEPA_20261105_V5_FULL_STATE_READONLY_ADAM_PREFLIGHT_NO_STEPS.md
      - .github/workflows/jepa-v5-full-state-readonly-audit-no-optimizer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-tensor-shapes-optimizer-moments:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.9", "3.12.7"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU-only PyTorch and pytest (NO datasets/CUDA)
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1"
      - name: Read-only snapshot / identity / Adam refusal regression
        env:
          PYTHONPATH: .
          CUDA_VISIBLE_DEVICES: ""
        run: |
          python -m pytest -q tests/test_jepa_v5_full_state_readonly_audit_v1.py
      - name: Confirm no execution authority in module
        env:
          PYTHONPATH: .
          CUDA_VISIBLE_DEVICES: ""
        run: |
          python - <<'PY'
          from scripts.v5 import jepa_v5_full_state_readonly_audit_v1 as v
          assert v.AUTHORITY == "TARGET_WINNER_NONE__REPRESENTATION_WINNER_NONE__REAL_TRAINING_OFF__STAGE4_NOT_AUTHORIZED"
          assert not hasattr(v,"restore_reference_checkpoint")
          assert not hasattr(v,"train")
          print("READ_ONLY_TENSOR_STRUCTURE_AND_SAFE_SHA_BYTES_ONLY__NO_OPTIMIZER_STEP")
          PY
