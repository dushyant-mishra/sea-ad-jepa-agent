name: TD unified query-excluded depth producer V1
on:
  pull_request:
    paths:
      - 'scripts/v5/td_unified/q_excluded_depth_v1.py'
      - 'scripts/v5/td_unified/casebundle_v1.py'
      - 'tests/v5/td_unified/test_q_excluded_depth_v1.py'
      - '.github/workflows/td-unified-q-excluded-depth-v1.yml'
permissions:
  contents: read
jobs:
  q-excluded-depth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Task 0 B5 regressions diff against the controlling plan head
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=9,<10' 'numpy>=2,<3'
      - name: Producer laws, CaseBundle conformance and hostile inputs
        run: python -m pytest -q -rf tests/v5/td_unified/test_q_excluded_depth_v1.py
      - name: Existing CaseBundle and bridge suites unchanged
        run: python -m pytest -q tests/v5/td_unified
