name: V5 typed onset + physical journal INTEGRATION (NO TRAINING)
on:
  pull_request:
    paths:
      - scripts/v5/jepa_synth2048_typed_onset_disk_integration_v2.py
      - scripts/v5/jepa_synth2048_checkpoint_capture_prefreeze_v1.py
      - scripts/v5/jepa_synth2048_atomic_checkpoint_bytes_v1.py
      - tests/test_jepa_synth2048_typed_onset_disk_integration_v2.py
      - tests/test_jepa_synth2048_checkpoint_failed_attempt_macha_red.py
      - tests/test_jepa_synth2048_failed_onset_cause_macha_red.py
      - tests/test_jepa_synth2048_failed_onset_journal_macha_red.py
      - docs/agent/JEPA_20261105_V5_TYPED_ONSET_DISK_INTEGRATION_NO_TRAINING.md
      - .github/workflows/jepa-synth2048-typed-onset-disk-integration-no-training.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-opaque-disk-only:
    strategy:
      matrix:
        python: ["3.11.9", "3.12.7"]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Minimal pytest only (NO torch/model/CUDA)
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Unchanged REDs #557/#560/#561 + all author suites + integration smoke
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_jepa_synth2048_checkpoint_capture_prefreeze_v1.py \
            tests/test_jepa_synth2048_checkpoint_failed_attempt_macha_red.py \
            tests/test_jepa_synth2048_failed_onset_repair_sol_v1.py \
            tests/test_jepa_synth2048_failed_onset_cause_macha_red.py \
            tests/test_jepa_synth2048_failed_onset_cause_successor_v1.py \
            tests/test_jepa_synth2048_atomic_checkpoint_bytes_v1.py \
            tests/test_jepa_synth2048_failed_onset_atomic_journal_v1.py \
            tests/test_jepa_synth2048_failed_onset_journal_macha_red.py \
            tests/test_jepa_synth2048_forensic_prefix_e2_successor_v1.py \
            tests/test_jepa_synth2048_write_intent_e1_scoped_v1.py \
            tests/test_jepa_synth2048_typed_onset_disk_integration_v2.py
      - name: Verify no promotion of opaque bytes into neural authority
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from scripts.v5 import jepa_synth2048_typed_onset_disk_integration_v2 as t
          from scripts.v5 import jepa_synth2048_atomic_checkpoint_bytes_v1 as d
          assert t.AUTHORITY.endswith("REAL_TRAINING_OFF__STAGE4_NOT_AUTHORIZED")
          assert d.STATUS == "OPAQUE_BYTES_STORAGE_ONLY__NO_TRAINING_OR_RESUME_AUTHORITY"
          print("TYPED_RECEIPT_AND_SHA_BYTES_ONLY__NO_NEURAL_TRAINING_AUTHORITY")
          PY
