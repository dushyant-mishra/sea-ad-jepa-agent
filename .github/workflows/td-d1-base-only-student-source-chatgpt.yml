name: TD D1 base-only student source-edge V1 (no library total, fixture only)
on:
  pull_request:
    paths:
      - 'scripts/v5/td_unified/observation_d1_base_only_student_fixture_v1.py'
      - 'tests/v5/td_unified/test_observation_d1_base_only_student_fixture_v1.py'
      - '.github/workflows/td-d1-base-only-student-source-chatgpt.yml'
permissions:
  contents: read
jobs:
  base-only-d1:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        numpy: ['1.26.4', '2.2.6']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install pytest==9.1.1 numpy==${{ matrix.numpy }}
      - name: D1 already-redacted source-edge and residual-vs-old-V2 hostiles
        run: python -m pytest -q -rA tests/v5/td_unified/test_observation_d1_base_only_student_fixture_v1.py
      - name: Inherited student-only V2B oracle defenses, fresh process
        run: python -m pytest -q tests/v5/td_unified/test_observation_v2b_public_student_gate.py
      - name: Inherited exact-source Macha #504 integration, fresh process
        run: python -m pytest -q tests/v5/td_unified/test_observation_v2_503_with_macha504_a4_integration.py
      - name: Inherited source producer and original A4, fresh process
        run: >-
          python -m pytest -q
          tests/v5/td_unified/test_q_excluded_depth_v1_a4_repair.py
          tests/v5/td_unified/test_q_excluded_depth_v1.py
      - name: Inherited bound V2 content, fresh process
        run: python -m pytest -q tests/v5/td_unified/test_observation_normalization_v2_bound_content.py
