name: V79 V2_CORE realization audit freeze

on:
  pull_request:
    paths:
      - 'results/v79/v2_core_realization_audit_freeze_v1/**'
      - 'scripts/v79/freeze_v79_v2_core_realization_audit.py'
      - 'tests/v79/test_v79_v2_core_realization_audit_freeze.py'
      - '.github/workflows/v79-v2-core-realization-audit-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-freeze-bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Audit-freeze bundle tests (records the exact head)
        shell: bash
        run: |
          echo "audit_freeze_head=$(git rev-parse HEAD)"
          python -m pytest tests/v79/test_v79_v2_core_realization_audit_freeze.py -q -rA -p no:cacheprovider
