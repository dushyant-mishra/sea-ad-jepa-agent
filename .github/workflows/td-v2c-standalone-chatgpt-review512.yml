name: TD V2C standalone student-only + Macha512 adapted review (fixture)
on:
  pull_request:
    paths:
      - 'scripts/v5/td_unified/observation_v2c_standalone_student_gate_v1.py'
      - 'tests/v5/td_unified/test_observation_v2c_standalone_student_gate_v1.py'
      - '.github/workflows/td-v2c-standalone-chatgpt-review512.yml'
permissions:
  contents: read
jobs:
  independent-case-adaptation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        numpy: ['1.26.4', '2.2.6']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 numpy==${{ matrix.numpy }}
      - name: New standalone validator and hostile Macha512-case adaptation
        run: python -m pytest -q -rA tests/v5/td_unified/test_observation_v2c_standalone_student_gate_v1.py
      - name: Inherited V2B author mechanics (distinct process)
        run: python -m pytest -q tests/v5/td_unified/test_observation_v2b_public_student_gate.py
      - name: Inherited base-only D1 student producer (distinct process)
        run: python -m pytest -q tests/v5/td_unified/test_observation_d1_base_only_student_fixture_v1.py
      - name: Standalone module must import without legacy producer availability
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, subprocess, sys, tempfile
          src=pathlib.Path("scripts/v5/td_unified/observation_v2c_standalone_student_gate_v1.py")
          tree=ast.parse(src.read_text())
          allowed={"__future__","hashlib"}
          imports=set()
          for item in ast.walk(tree):
              if isinstance(item,ast.Import):
                  imports.update(n.name for n in item.names)
              if isinstance(item,ast.ImportFrom):
                  imports.add(item.module)
          assert imports==allowed,imports
          with tempfile.TemporaryDirectory() as td:
              dest=pathlib.Path(td)/"student_only.py"
              dest.write_bytes(src.read_bytes())
              code=("import importlib.util,sys;"
                    "s=importlib.util.spec_from_file_location('student_only',r'"+str(dest.resolve())+"');"
                    "m=importlib.util.module_from_spec(s);s.loader.exec_module(m);"
                    "assert 'scripts.v5.td_unified.observation_normalization_view_v2_bound_content_v1' not in sys.modules;"
                    "assert not hasattr(m,'B');"
                    "assert m.StudentV2CRefusal.__name__=='StudentV2CRefusal'")
              subprocess.run([sys.executable,"-I","-B","-c",code],check=True,cwd=td)
          PY
