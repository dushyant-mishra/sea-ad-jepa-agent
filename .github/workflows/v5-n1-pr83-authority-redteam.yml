name: FULL104 N1 independent physical-authority red-team

on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/v5/audit_b_n1_physical_lineage_adapter_v1.py'
      - 'tests/test_v5_audit_b_n1_physical_lineage_adapter_v1.py'
      - 'tests/test_v5_n1_pr83_physical_authority_redteam_20260923.py'
      - '.github/workflows/v5-n1-pr83-authority-redteam.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-authority-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Test historical and independent actual adapter entry points
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m pytest -q tests/test_v5_audit_b_n1_physical_lineage_adapter_v1.py tests/test_v5_n1_pr83_physical_authority_redteam_20260923.py | tee /tmp/n1-authority.txt
      - name: Fail closed on skipped controls
        run: |
          if grep -qiE '^SKIPPED|[0-9]+ skipped' /tmp/n1-authority.txt; then
            echo "N1 AUTHORITY RED-TEAM SKIPPED CONTROLS — STOP"
            exit 1
          fi
