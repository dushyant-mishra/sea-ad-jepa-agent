name: JEPA Oct28 master science takeover source custody (no authority)
on:
  pull_request:
    paths:
      - 'docs/agent/JEPA_LANE_TAKEOVER_MASTER_20261028.md'
      - 'docs/agent/chat_exclusive_20261027/g7_local_input_admissibility*_original.md'
      - 'results/target_discovery/unified_qualification_v1/JEPA_LANE_TAKEOVER_MASTER_20261028.json'
      - 'scripts/v5/verify_jepa_lane_takeover_master_20261028.py'
      - 'tests/v5/test_verify_jepa_lane_takeover_master_20261028.py'
      - '.github/workflows/jepa-oct28-master-takeover-custody-v1.yml'
permissions:
  contents: read
jobs:
  source-audit-and-hostile-nonpromotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static test runner only
        run: python -m pip install pytest==9.1.1
      - name: Verify byte-identical original G7 Markdown, science results and no false source authority
        run: python scripts/v5/verify_jepa_lane_takeover_master_20261028.py
      - name: Hostile claim-erasure and scientific-custody mutations
        run: python -m pytest -q tests/v5/test_verify_jepa_lane_takeover_master_20261028.py
