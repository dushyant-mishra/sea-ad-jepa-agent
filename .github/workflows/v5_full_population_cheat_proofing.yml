name: V5 full-population cheat-proofing candidate

on:
  push:
    branches:
      - planning/v5-full-population-cheat-proofing-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest numpy scipy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run candidate tests
        env:
          PYTHONPATH: src:.
        run: >
          python -m pytest -q
          tests/test_teacher_student_v5_full_population_coverage_v1.py
          tests/test_teacher_student_v5_representation_firewall_v1.py
          tests/v5_anticheat/test_full_population_coverage_conditioning_audit_v1.py
          tests/test_full_population_conditioning_authority_v1.py
          tests/test_same_cell_technical_intervention_probe_v1.py
          tests/test_same_cell_qc_bridge_v2.py
          tests/test_same_cell_qc_bridge_v3.py
          tests/test_qc_qualification_authority_v1.py
          tests/test_qc_qualification_authority_v2.py
          tests/test_qc_qualification_authority_v3.py
          tests/test_teacher_student_v5_full_population_horizon_candidate_v2.py
          tests/test_teacher_student_v5_full_population_horizon_candidate_v3.py
          tests/test_biology_observation_adapter_v1.py
          tests/test_relational_shortcut_increment_guard_v1.py
          tests/test_relational_shortcut_superiority_guard_v2.py
          tests/test_relational_measurement_shortcut_results_v1.py
          tests/test_representation_collapse_guard_v1.py
          tests/test_pretraining_qualification_bundle_v1.py
          tests/test_qualification_phase_contract_v1.py
          tests/test_qualification_phase_contract_v2.py
          tests/test_rejection_gate_power_calibration_v1.py
          tests/test_rejection_gate_power_calibration_v2.py
          tests/test_rejection_gate_power_calibration_v3.py
          tests/test_postqualification_dependency_guard_v1.py
          tests/test_v5_group_presentation_floor_relevance_v1.py
          tests/test_v5_real_data_parameter_and_dimension_contract_v1.py
          tests/test_full_reader_expression_location_builder_v2.py
          tests/test_dimension_authority_guard_v1.py
          tests/test_dimension_authority_guard_v2.py
          tests/test_full_reader_expression_identity_closure_v3.py
          tests/test_bind_full104_expression_blocks_v4.py
          tests/test_dimension_authority_guard_v3.py
          tests/test_v5_parameter_provenance_classification_v1.py
          tests/test_v5_ema_exposure_and_query_precision_v1.py
          tests/test_v5_repeat_cap_conditioning_pareto_v1.py
          tests/test_v5_affine_order_update_conditioning_v1.py
          tests/test_critical_test_execution_guard_v1.py
          tests/test_dimension_execution_firewall_v1.py
          tests/test_v5_support_family_mass_derivation_v1.py
          tests/test_trainer_preexecution_contract_v2.py
          tests/test_trainer_preexecution_contract_v3.py
          tests/test_v5_c2_gpu_critical_manifest_v1.py
          tests/test_v5_c2_gpu_qualification_harness_v1.py
          tests/test_v5_schedule_governance_resolution_v1.py
          tests/test_materialize_full_population_schedule_v4.py
      - name: Prove C2 critical tests executed
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q tests/test_c2_mandatory_gradient_gate_v1.py --junitxml=c2-critical-junit.xml
          python scripts/v5_anticheat/validate_v5_critical_test_execution_v1.py \
            --junit c2-critical-junit.xml \
            --manifest docs/agent/TEACHER_STUDENT_V5_CRITICAL_TEST_EXECUTION_MANIFEST_V1.json \
            --out c2-critical-execution-receipt.json
      - name: Compile candidate sources
        run: >
          python -m py_compile
          src/sea_ad_jepa/v5/full_population_coverage_schedule_v1.py
          src/sea_ad_jepa/v5/full_population_conditioning_authority_v1.py
          src/sea_ad_jepa/v5/representation_firewall_v1.py
          src/sea_ad_jepa/v5/same_cell_technical_intervention_probe_v1.py
          src/sea_ad_jepa/v5/same_cell_qc_bridge_v2.py
          src/sea_ad_jepa/v5/same_cell_qc_bridge_v3.py
          src/sea_ad_jepa/v5/qc_qualification_authority_v1.py
          src/sea_ad_jepa/v5/qc_qualification_authority_v2.py
          src/sea_ad_jepa/v5/qc_qualification_authority_v3.py
          src/sea_ad_jepa/v5/biology_observation_adapter_v1.py
          src/sea_ad_jepa/v5/relational_shortcut_increment_guard_v1.py
          src/sea_ad_jepa/v5/relational_shortcut_superiority_guard_v2.py
          src/sea_ad_jepa/v5/representation_collapse_guard_v1.py
          src/sea_ad_jepa/v5/pretraining_qualification_bundle_v1.py
          src/sea_ad_jepa/v5/qualification_phase_contract_v1.py
          src/sea_ad_jepa/v5/qualification_phase_contract_v2.py
          src/sea_ad_jepa/v5/rejection_gate_power_calibration_v1.py
          src/sea_ad_jepa/v5/rejection_gate_power_calibration_v2.py
          src/sea_ad_jepa/v5/rejection_gate_power_calibration_v3.py
          src/sea_ad_jepa/v5/postqualification_dependency_guard_v1.py
          src/sea_ad_jepa/v5/dimension_authority_guard_v1.py
          src/sea_ad_jepa/v5/dimension_authority_guard_v2.py
          src/sea_ad_jepa/v5/dimension_authority_guard_v3.py
          src/sea_ad_jepa/v5/critical_test_execution_guard_v1.py
          src/sea_ad_jepa/v5/dimension_execution_firewall_v1.py
          src/sea_ad_jepa/v5/trainer_preexecution_contract_v2.py
          src/sea_ad_jepa/v5/trainer_preexecution_contract_v3.py
          scripts/v5_anticheat/audit_full_population_coverage_conditioning_v1.py
          scripts/v5_anticheat/derive_full_population_schedule_optimum_v3.py
          scripts/v5_anticheat/materialize_full_population_schedule_v4.py
          scripts/v5_anticheat/derive_v5_real_data_parameter_registry_v1.py
          scripts/v5_anticheat/build_full_reader_expression_location_manifest_v2.py
          scripts/v5_anticheat/build_full_reader_expression_identity_closure_v3.py
          scripts/v5_anticheat/bind_full104_expression_blocks_v4.py
          scripts/v5_anticheat/derive_actual_presentation_exposure_geometry_v2.py
          scripts/v5_anticheat/derive_singleton_query_floor_v3.py
          scripts/v5_anticheat/derive_repeat_cap_conditioning_pareto_v1.py
          scripts/v5_anticheat/audit_affine_order_update_conditioning_v1.py
          scripts/v5_anticheat/derive_support_family_mass_v1.py
          scripts/v5_anticheat/run_v5_c2_gpu_qualification_v1.py
