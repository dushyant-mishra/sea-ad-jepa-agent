name: PR118 independent GSE301119 R matrix red team SYNTHETIC
on:
  push:
    paths:
      - 'analysis/therapeutic_perturbation_etl/scripts/r/independently_verify_gse301119_all_effects_v1.R'
      - 'tests/r/test_gse301119_independent_full_matrix_v1.R'
      - '.github/workflows/pr118-independent-gse301119-r-synthetic.yml'
  pull_request:
    paths:
      - 'analysis/therapeutic_perturbation_etl/scripts/r/independently_verify_gse301119_all_effects_v1.R'
      - 'tests/r/test_gse301119_independent_full_matrix_v1.R'
      - '.github/workflows/pr118-independent-gse301119-r-synthetic.yml'
  workflow_dispatch:
jobs:
  independent-r-math:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install digest required for SHA-256 roots
        run: Rscript -e 'install.packages("digest", repos="https://cloud.r-project.org")'
      - name: Independently recompute toy target×donor contrasts and inject adversaries
        run: |
          set -o pipefail
          Rscript --vanilla tests/r/test_gse301119_independent_full_matrix_v1.R | tee synthetic_R_test.log
          grep 'SYNTHETIC R RED TEAM PASS:' synthetic_R_test.log
          grep 'NO PHYSICAL EFFECT DATA READ' synthetic_R_test.log
      - name: Verify no physical GSE301119 assets were accessed
        run: |
          test ! -f CRISPRi_guide_donor_raw_counts.rds
          test ! -f CRISPRa_guide_donor_raw_counts.rds
          echo 'CI IS SYNTHETIC ONLY. Independent full physical matrix reproduction remains PENDING.'
