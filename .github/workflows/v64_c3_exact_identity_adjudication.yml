name: V64 C3 exact-identity adjudication

on:
  push:
    branches:
      - chatgpt/v64-parallel-execution-readiness-20260929
    paths:
      - '.github/workflows/v64_c3_exact_identity_adjudication.yml'
      - 'scripts/v64/nott_c3_exact_identity_adjudication_v1.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Fetch exact UCSC tool and chains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .c3_inputs .c3_out
          curl -fL --retry 3 https://hgdownload.soe.ucsc.edu/admin/exe/linux.x86_64.v479/liftOver -o .c3_inputs/liftOver_v479
          curl -fL --retry 3 https://hgdownload.soe.ucsc.edu/goldenPath/hg19/liftOver/hg19ToHg38.over.chain.gz -o .c3_inputs/hg19ToHg38.over.chain.gz
          curl -fL --retry 3 https://hgdownload.soe.ucsc.edu/goldenPath/hg38/liftOver/hg38ToHg19.over.chain.gz -o .c3_inputs/hg38ToHg19.over.chain.gz
          chmod +x .c3_inputs/liftOver_v479
          echo "80c77de53b8bbd5fec661242f24d4b2f0ac54446df6954d934d1a838927dd19c  .c3_inputs/liftOver_v479" | sha256sum -c -
          echo "5c0598e500ceb5a78c73086929e8ef993aec309bcafb595139b53d440b125a1d  .c3_inputs/hg19ToHg38.over.chain.gz" | sha256sum -c -
          echo "14a712e8e147d9fc8e9d87d51977b46f6f8ddb93efbe5d0843d86b6205f587b1  .c3_inputs/hg38ToHg19.over.chain.gz" | sha256sum -c -

      - name: Fetch exact Nott Table S5
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://pmc.ncbi.nlm.nih.gov/articles/PMC7028213/bin/NIHMS1066836-supplement-Table_S5.xlsx"
            "https://pmc.ncbi.nlm.nih.gov/articles/instance/7028213/bin/NIHMS1066836-supplement-Table_S5.xlsx"
          )
          ok=0
          for u in "${urls[@]}"; do
            rm -f .c3_inputs/Table_S5.xlsx
            if curl -fL --retry 2 "$u" -o .c3_inputs/Table_S5.xlsx; then
              got="$(sha256sum .c3_inputs/Table_S5.xlsx | awk '{print $1}')"
              if [[ "$got" == "81c99689533d9da372cecdd469e7ff02cc985720105b83b3bd66c3ac8c93972e" ]]; then
                echo "Authenticated Table S5 from $u"
                ok=1
                break
              else
                echo "Downloaded bytes had wrong SHA-256 from $u: $got" >&2
              fi
            fi
          done
          if [[ "$ok" != "1" ]]; then
            echo "STOP_TABLE_S5_EXACT_BYTES_UNAVAILABLE" >&2
            exit 31
          fi

      - name: Apply prospectively frozen exact-identity rule
        run: |
          python scripts/v64/nott_c3_exact_identity_adjudication_v1.py             --table-s5 .c3_inputs/Table_S5.xlsx             --forward-chain .c3_inputs/hg19ToHg38.over.chain.gz             --reverse-chain .c3_inputs/hg38ToHg19.over.chain.gz             --liftover .c3_inputs/liftOver_v479             --out-dir .c3_out | tee .c3_out/console.txt

      - name: Upload adjudication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v64-c3-exact-identity-adjudication
          path: .c3_out/
          if-no-files-found: warn
