name: JEPA Oct28 complete takeover audit and hostile no-promotion
on:
  pull_request:
    paths:
      - 'docs/agent/JEPA_COMPLETE_LANE_TAKEOVER_FREEZE_20261028.md'
      - 'docs/agent/JEPA_MACHA_V2_G7_OBSERVATION_CONTRACT_DELTA_20261028.md'
      - 'docs/agent/review_probes/macha_20261028/**'
      - 'scripts/v5/review_probes/macha_20261028/**'
      - 'results/target_discovery/unified_qualification_v1/JEPA_MACHA_V2_G7_OBSERVATION_CONTRACT_DELTA_20261028.json'
      - 'results/target_discovery/unified_qualification_v1/JEPA_CURRENT_SUCCESSOR_FREEZE_20261028.json'
      - 'scripts/v5/verify_jepa_successor_freeze_20261028.py'
      - 'tests/v5/test_verify_jepa_successor_freeze_20261028.py'
      - '.github/workflows/jepa-oct28-complete-takeover-freeze.yml'
permissions:
  contents: read
jobs:
  preserve-reviewed-sources-and-historical-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Assert twelve original review/probe Git blobs unchanged
        run: python scripts/v5/verify_jepa_successor_freeze_20261028.py
      - name: Hostile original verdict / source / scientific authority tampering
        run: python -m pytest -q tests/v5/test_verify_jepa_successor_freeze_20261028.py
