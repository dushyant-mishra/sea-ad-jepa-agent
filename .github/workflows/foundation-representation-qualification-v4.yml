name: Foundation representation qualification V4

on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/v4/foundation_qualification_v4.py'
      - 'src/sea_ad_jepa/v4/foundation_sampling.py'
      - 'src/sea_ad_jepa/v4/foundation_resource_guard.py'
      - 'src/sea_ad_jepa/v4/observation_process.py'
      - 'src/sea_ad_jepa/v4/foundation_state_stability.py'
      - 'scripts/v4/requalify_foundation_representation_v4.py'
      - 'tests/v4/test_foundation_representation_qualification_v4.py'
      - 'tests/v4/test_foundation_representation_qualification_v4_cli.py'
      - '.github/workflows/foundation-representation-qualification-v4.yml'
  workflow_dispatch:

jobs:
  qualification-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --upgrade numpy scipy pytest
      - name: Run focused qualification suite
        run: >-
          python -m pytest -q
          tests/v4/test_foundation_representation_qualification_v4.py
          tests/v4/test_foundation_representation_qualification_v4_cli.py
