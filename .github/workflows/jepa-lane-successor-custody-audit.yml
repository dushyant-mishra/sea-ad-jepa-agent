name: JEPA lane successor custody audit

on:
  push:
    branches:
      - 'science/jepa-robust-pipeline-post-jepa-anything-audit-20261013'
      - 'handoff/jepa-lane-takeover-20261013'
    paths:
      - 'docs/agent/JEPA_LANE_SUCCESSOR_AUDIT_UPDATE_20261013.md'
      - 'results/target_discovery/JEPA_LANE_SUCCESSOR_AUDIT_STATE_20261013.json'
      - 'docs/agent/TD_PHASE1_INDEPENDENT_RECEIPT_AUDIT_20261013.md'
      - 'scripts/v5/jepa_post_td_harness_contract_v1.py'
      - 'scripts/v5/jepa_post_td_rehearsal_preflight_v1.py'
      - 'scripts/v5/jepa_post_td_tournament_controller_v1.py'
      - 'scripts/v5/jepa_post_td_presentation_ema_v1.py'
      - 'tests/v5/test_jepa_post_td_harness_contract_v1.py'
      - 'tests/v5/test_jepa_post_td_rehearsal_preflight_v1.py'
      - 'tests/v5/test_jepa_post_td_tournament_controller_v1.py'
      - 'tests/v5/test_jepa_post_td_presentation_ema_v1.py'
      - '.github/workflows/jepa-post-td-harness-prefreeze.yml'
      - '.github/workflows/jepa-lane-successor-custody-audit.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custody-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact post-TD harness
        run: |
          python -m py_compile \
            scripts/v5/jepa_post_td_harness_contract_v1.py \
            scripts/v5/jepa_post_td_rehearsal_preflight_v1.py \
            scripts/v5/jepa_post_td_tournament_controller_v1.py \
            scripts/v5/jepa_post_td_presentation_ema_v1.py \
            tests/v5/test_jepa_post_td_harness_contract_v1.py \
            tests/v5/test_jepa_post_td_rehearsal_preflight_v1.py \
            tests/v5/test_jepa_post_td_tournament_controller_v1.py \
            tests/v5/test_jepa_post_td_presentation_ema_v1.py
      - name: Run post-TD harness tests
        run: |
          python -m unittest \
            tests.v5.test_jepa_post_td_harness_contract_v1 \
            tests.v5.test_jepa_post_td_rehearsal_preflight_v1 \
            tests.v5.test_jepa_post_td_tournament_controller_v1 \
            tests.v5.test_jepa_post_td_presentation_ema_v1 \
            -v
      - name: Verify exact source blob identities
        run: |
          python - <<'PY'
          import subprocess
          expected = {
            '.github/workflows/jepa-post-td-harness-prefreeze.yml': '22630ce12b01c490f6695ca6556cee1283453d35',
            'scripts/v5/jepa_post_td_harness_contract_v1.py': 'a03495766dccfe1ce1042ecb02d60a421a21d34b',
            'scripts/v5/jepa_post_td_rehearsal_preflight_v1.py': 'f4dc57cae1dbdd86ace1faec6e171eddde10c30f',
            'scripts/v5/jepa_post_td_tournament_controller_v1.py': 'd4aee423902799cc5026c622217a701ac741ad48',
            'scripts/v5/jepa_post_td_presentation_ema_v1.py': '1e6126ce189f3ecdef799150541f3cc882c6eee7',
            'tests/v5/test_jepa_post_td_harness_contract_v1.py': '74d4ee8dddb6b4c14fb6ef8afb9f2c86d8fcc4cb',
            'tests/v5/test_jepa_post_td_rehearsal_preflight_v1.py': '2f09627c68cd88c4fe20ab310ff6481f7eb8ada8',
            'tests/v5/test_jepa_post_td_tournament_controller_v1.py': '4e5ec0468f93568e4194dd6984f4c8aa00008583',
            'tests/v5/test_jepa_post_td_presentation_ema_v1.py': '523ca8b6a164b8254ef70c060bd6d66f5aaf833a',
          }
          for path, want in expected.items():
              got = subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert got == want, f'{path}: {got} != {want}'
          print('EXACT_POST_TD_HARNESS_BLOBS_PASS')
          PY
      - name: Verify authority remains off
        run: |
          python - <<'PY'
          import json
          p='results/target_discovery/JEPA_LANE_SUCCESSOR_AUDIT_STATE_20261013.json'
          x=json.load(open(p))
          assert x['authority'] and all(v is False for v in x['authority'].values())
          assert x['phase1']['controller_truth_opened'] is False
          print('NO_DOWNSTREAM_AUTHORITY_GRANTED')
          PY
      - name: Re-run historical takeover manifest validator
        run: |
          python scripts/v5/verify_jepa_lane_takeover_manifest_v1.py
      - name: Reject binary custody payloads under docs agent
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden={'.zip','.npz','.npy','.pt','.pth','.ckpt','.h5','.h5ad'}
          bad=[str(p) for p in Path('docs/agent').rglob('*') if p.is_file() and p.suffix.lower() in forbidden]
          assert not bad, bad
          print('NO_PUBLIC_BINARY_CUSTODY_PAYLOADS')
          PY
