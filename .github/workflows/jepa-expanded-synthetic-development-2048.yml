name: JEPA expanded 2048-address synthetic DEVELOPMENT only
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  frozen-source-and-development-fixture:
    name: Original PR328 + development 2048 fit-only (NO C PASS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Install original PR328 pinned runtime
        run: |
          python -m pip install -r requirements/unified-synthetic-integration-v1.txt
      - name: Check exact pinned environment
        run: |
          python - <<'PY'
          import sys
          from importlib.metadata import version
          actual = {
              "python": ".".join(str(v) for v in sys.version_info[:3]),
              "numpy": version("numpy"), "pandas": version("pandas"),
              "scipy": version("scipy"), "pytest": version("pytest"),
          }
          assert actual == {
              "python": "3.11.9", "numpy": "2.3.5", "pandas": "2.2.3",
              "scipy": "1.17.0", "pytest": "9.0.2",
          }, actual
          print(actual)
          PY
      - name: Verify original frozen PR328 and expanded fit-only mechanics
        run: |
          python -m pytest tests/v79/test_expanded_common_world_development_v1.py \
            tests/v79/test_unified_synthetic_integration_v1.py \
            tests/v79/test_unified_synthetic_fit_view_v1.py \
            tests/v79/test_unified_synthetic_controller_truth_v1.py \
            tests/v79/test_finalize_unified_synthetic_integration_v1.py \
            tests/test_v79_hierarchical_biology_v1.py \
            tests/test_v79_observation_operator_v1.py -q
      - name: Materialize the one predeclared development fit dataset
        env:
          OUTPUT_DIR: /tmp/jepa_expanded_dev_2048
        run: |
          python -m scripts.v79.expanded_common_world_development_v1 --output-dir "$OUTPUT_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads((Path(os.environ["OUTPUT_DIR"]) / "DEVELOPMENT_RECEIPT.json").read_text())
          assert d["status"] == "DEVELOPMENT_FIXTURE_ONLY__NO_MODEL_OR_CANDIDATE_QUALIFICATION"
          assert d["controller_truth_exported"] is False
          assert d["model_training_or_controller_scoring_executed"] is False
          assert d["all_six_candidate_recoverability"] == "UNASSESSED"
          assert d["real_biology_or_production_authority"] is False
          print("PUBLISHED_DEVELOPMENT_FIT_ONLY__NO_C1_TO_C6_PASS__STOP_A_B_C_UNTOUCHED")
          PY
      - name: Archive FIT-only development arrays and nonauthorizing receipt
        uses: actions/upload-artifact@v4
        with:
          name: expanded-synthetic-dev2048-fit-only
          path: |
            /tmp/jepa_expanded_dev_2048/teacher_measured.npz
            /tmp/jepa_expanded_dev_2048/student_qexcluded.npz
            /tmp/jepa_expanded_dev_2048/roster_evaluation_only.npz
            /tmp/jepa_expanded_dev_2048/atac_separate_nucleus_negative.npz
            /tmp/jepa_expanded_dev_2048/DEVELOPMENT_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
