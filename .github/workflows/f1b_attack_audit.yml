name: F1-B attack authority audit

on:
  push:
    branches:
      - f1b-executable-attacks-20260907
    paths:
      - scripts/v4/f1b_successor_attack_suite_v1.py
      - scripts/v4/f1b_reference_candidates_v1.py
      - tests/test_f1b_successor_attack_suite_v1.py
      - .github/workflows/f1b_attack_audit.yml

permissions:
  contents: read

jobs:
  attack-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused attack tests
        run: python -m pytest -q tests/test_f1b_successor_attack_suite_v1.py
      - name: Emit polarity terminals
        run: |
          python - <<'PY'
          import json
          from scripts.v4.f1b_reference_candidates_v1 import reference_correct, reference_empty, reference_vulnerable
          from scripts.v4.f1b_successor_attack_suite_v1 import prove_polarity, registry_audit, run_suite
          payload = {
              "polarity": prove_polarity(reference_vulnerable(), reference_correct()),
              "vulnerable": run_suite(reference_vulnerable()),
              "correct": run_suite(reference_correct()),
              "empty": run_suite(reference_empty()),
              "registry": registry_audit(reference_vulnerable(), reference_correct()),
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          assert payload["polarity"]["terminal"] == "PASS_ATTACK_POLARITY"
          assert payload["vulnerable"]["terminal"] == "STOP_F1B_ATTACK_SUITE"
          assert payload["correct"]["terminal"] == "PASS_F1B_ATTACK_SUITE"
          assert payload["empty"]["terminal"] == "STOP_F1B_ATTACK_SUITE"
          assert payload["registry"]["terminal"] == "PASS_F1B_ATTACK_REGISTRY"
          PY
