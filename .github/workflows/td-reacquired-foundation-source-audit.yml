name: Reacquired source/ETL audit receipt guard (NO AUTHORITY)
on:
  pull_request:
    paths:
      - 'docs/agent/JEPA_REACQUIRED_FOUNDATION_SOURCE_AUDIT_20261028.md'
      - 'results/target_discovery/unified_qualification_v1/JEPA_REACQUIRED_FOUNDATION_SOURCE_AUDIT_20261028.json'
      - 'results/target_discovery/unified_qualification_v1/JEPA_REACQUIRED_FOUNDATION_50K_OPERATOR_RESIDUALS_20261028.csv'
      - 'tests/v5/td_unified/test_reacquired_foundation_source_audit_20261028.py'
      - '.github/workflows/td-reacquired-foundation-source-audit.yml'
permissions:
  contents: read
jobs:
  receipt-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            results
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: bash
        run: python -m pip install pytest==9.1.1
      - shell: bash
        run: python -m pytest -q -rA tests/v5/td_unified/test_reacquired_foundation_source_audit_20261028.py
