name: PS Task1/2 #464 Macha recheck RED (tests only)
on:
  pull_request:
    paths:
      - 'scripts/production_synthetic/canonical_v1.py'
      - 'scripts/production_synthetic/custody_v1.py'
      - 'tests/production_synthetic/test_ps_t12_464_recheck_macha_red.py'
      - 'tests/production_synthetic/test_ps_t12_repair_recheck_macha_red.py'
      - '.github/workflows/ps-t12-464-recheck-macha-red.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==9.1.1' 'numpy==2.4.6'
      - name: Macha #464 recheck (V2 RED; V1 cannot fail here)
        run: python -m pytest -q -rf tests/production_synthetic/test_ps_t12_464_recheck_macha_red.py

  # NumPy scalar class identity is platform-specific (C int vs C long are distinct
  # classes on Windows), so the exact-type encoder is also checked there.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        numpy: ['numpy>=2,<3', 'numpy==1.26.4']
    steps:
      # This historical repository contains Windows-incompatible long
      # preservation paths. Check out only what these tests read.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        shell: bash
        run: python -m pip install 'pytest==9.1.1' '${{ matrix.numpy }}'
      - name: Macha #464 recheck (V1 and V2 RED)
        shell: bash
        run: python -m pytest -q -rf tests/production_synthetic/test_ps_t12_464_recheck_macha_red.py
      - name: Unchanged #458 mechanical cases (T2-D intentionally deselected)
        shell: bash
        run: >-
          python -m pytest -q tests/production_synthetic/test_ps_t12_repair_recheck_macha_red.py
          -k 'not test_t2d_'
