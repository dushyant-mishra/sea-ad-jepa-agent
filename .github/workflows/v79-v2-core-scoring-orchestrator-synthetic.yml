name: V79 V2_CORE scoring orchestrator (synthetic only)

# Runs only synthetic-universe and fixture suites. No step here reads the committed real controller
# truth, the unblinded root manifest or any real fit output.
on:
  push:
    branches:
      - feat/v79-v2-core-scoring-orchestrator-tdd-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestrator-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Preserve byte identity
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen V79 environment
        run: python -m pip install --disable-pip-version-check -r results/v79/v2_core_qualification/inputs/V79_BAYES_ENV_PIP_FREEZE.txt
      - name: Verify exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --short)"
      - name: Synthetic orchestrator, custody and scorer suites
        run: >-
          python -m pytest
          tests/v79/test_v79_v2_core_score_orchestrator.py
          tests/v79/test_v79_v2_core_score_authority.py
          tests/v79/test_v79_v2_core_score_runner.py
          tests/v79/test_v79_v2_core_score.py
          tests/v79/test_v79_v2_core_score_evaluate.py
          tests/v79/test_v79_v2_core_score_descriptive.py
          tests/v79/test_v79_v2_core_score_descriptive_contract.py
          tests/v79/test_v79_v2_core_score_oracle.py
          tests/v79/test_v79_v2_core_launch_authority.py
          tests/v79/test_v79_v2_core_qualification_custody.py
          tests/v79/test_v79_v2_core_qualification_runner.py
          -q -rA -p no:cacheprovider
      - name: Static trust-domain audit
        shell: python
        run: |
          from pathlib import Path
          fit_side = [
              Path('scripts/v79/v79_v2_core_fit_surface.py'),
              Path('scripts/v79/v79_v2_core_fit_model.py'),
              Path('scripts/v79/v79_v2_core_fit_runner.py'),
              Path('scripts/v79/run_v79_v2_core_benchmark.py'),
              Path('scripts/v79/run_v79_v2_core_qualification.py'),
              Path('scripts/v79/run_v79_v2_core_qualification_world.py'),
          ]
          for p in fit_side:
              text=p.read_text(encoding='utf-8')
              assert 'v79_v2_core_score' not in text
              assert 'controller_truth' not in text
              assert 'run_v79_v2_core_scoring_orchestrator' not in text
          print('SCORER_TRUST_DOMAIN_AUDIT=PASS')
      - name: Confirm tracked worktree unchanged
        shell: bash
        run: test -z "$(git status --short --untracked-files=no)"
