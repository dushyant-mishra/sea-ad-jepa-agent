name: Unified downstream preflight

on:
  pull_request:
    paths:
      - 'scripts/v5/td_unified/downstream_preflight_v1.py'
      - 'tests/v5/td_unified/test_downstream_preflight_v1.py'
      - 'scripts/v5/jepa_post_td_harness_contract_v1.py'
      - '.github/workflows/unified-downstream-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downstream-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Run downstream preflight contract
        run: python -m pytest -q tests/v5/td_unified/test_downstream_preflight_v1.py
