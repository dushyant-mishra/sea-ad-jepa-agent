name: G7 E3 — Macha #476 independent review (RED expected; NO AUTHORITY)
on:
  pull_request:
    paths:
      - 'scripts/v5/td_real_g7_content_enforcement_v1.py'
      - 'scripts/v5/td_real_g7_terminal_decision_v3.py'
      - 'tests/v5/test_td_real_g7_content_enforcement_v1_macha_476_red.py'
      - '.github/workflows/td-g7-e3-macha476-review-red.yml'
permissions:
  contents: read
jobs:
  inherited-unchanged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Original, #449, #472 and V3 suites unchanged, R1/R2/R1D excluded
        run: >-
          python -m pytest -q
          tests/v5/test_td_real_g7_content_enforcement_v1.py
          tests/v5/test_td_real_g7_content_enforcement_v1_macha_hostile.py
          tests/v5/test_td_real_g7_content_enforcement_v1_macha_recheck.py
          tests/v5/test_td_real_g7_content_enforcement_v1_macha_470_red.py
          tests/v5/test_td_real_g7_terminal_decision_v3.py
          -k 'not test_r1_ and not test_r2_ and not test_r1d_'
  macha476-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Macha #476 hostile cases (test_red_* expected to fail at 26031df2)
        run: python -m pytest -q -rA tests/v5/test_td_real_g7_content_enforcement_v1_macha_476_red.py
