name: JEPA frozen-quality four-world diagnostic
on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/evaluation/frozen_probe_v1.py'
      - 'tests/evaluation/test_frozen_probe_v1.py'
      - 'tests/evaluation/test_frozen_probe_v1_macha_hostile.py'
      - '.github/workflows/jepa-frozen-quality-four-world.yml'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only diagnostic dependencies
        run: python -m pip install pytest numpy
      - name: Test four-world actual evaluator
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/evaluation/test_frozen_probe_v1.py tests/evaluation/test_frozen_probe_v1_macha_hostile.py
