name: TD unified Task 1 A1 A9

on:
  pull_request:
    paths:
      - 'scripts/v5/td_unified/canonical_v1.py'
      - 'scripts/v5/td_unified/authority_v1.py'
      - 'schemas/target_discovery/unified_v1/**'
      - 'tests/v5/td_unified/test_canonical_v1.py'
      - 'tests/v5/td_unified/test_authority_v1.py'
      - 'docs/agent/UNIFIED_TASK1_EXECUTION_LEDGER_20261015.md'
      - 'results/target_discovery/unified_qualification_v1/UNIFIED_TASK1_REUSE_SUBSTRATE_V1.json'
      - '.github/workflows/td-unified-task1-a1-a9.yml'

jobs:
  task1-a1-a9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install 'pytest>=9,<10'
      - name: Run Unified Task 1 A1+A9
        run: python -m pytest -q tests/v5/td_unified/test_canonical_v1.py tests/v5/td_unified/test_authority_v1.py
