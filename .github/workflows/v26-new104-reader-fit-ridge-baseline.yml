name: V26 new104 reader-fit ridge baseline synthetic proof
on:
  pull_request:
    paths:
      - "analysis/v26_reader_fit_linear_baseline_20260925/**"
      - ".github/workflows/v26-new104-reader-fit-ridge-baseline.yml"
  workflow_dispatch:

jobs:
  synthetic-numeric-and-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pytest
      - name: Execute 24 independent numerical and adversarial tests
        run: |
          python -m pytest analysis/v26_reader_fit_linear_baseline_20260925/tests/test_reader_fit_linear_lodo_v1.py \
            -q --strict-markers --junitxml=v26_new104_junit.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("v26_new104_junit.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          counts = {key: int(suite.attrib.get(key, "0")) for key in ("tests","errors","failures","skipped")}
          assert counts["tests"] == 24 and all(counts[k] == 0 for k in ("errors","failures","skipped")), counts
          print("PASS_V26_NEW104_RIDGE_SYNTHETIC_24_OF_24_ZERO_SKIPPED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v26-new104-ridge-synthetic-junit
          path: v26_new104_junit.xml
