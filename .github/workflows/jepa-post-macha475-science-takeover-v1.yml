name: JEPA Macha475 exact-source review custody and no-science-promotion
on:
  pull_request:
    paths:
      - 'docs/agent/JEPA_MACHA_REVIEW_AND_READINESS_DELTA_20261027.md'
      - 'scripts/v5/review_probes/macha_20261027/**'
      - 'results/target_discovery/unified_qualification_v1/JEPA_MACHA_REVIEW_AND_READINESS_DELTA_20261027.json'
      - 'docs/agent/JEPA_MACHA475_REPAIR476_477_REVIEW478_DELTA_20261027.md'
      - 'results/target_discovery/unified_qualification_v1/JEPA_POST_MACHA475_REPAIR476_477_REVIEW478_20261027.json'
      - 'scripts/v5/verify_post_macha475_takeover_delta_v1.py'
      - 'tests/v5/test_verify_post_macha475_takeover_delta_v1.py'
      - '.github/workflows/jepa-post-macha475-science-takeover-v1.yml'
permissions:
  contents: read
jobs:
  preserve-original-and-no-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Verify exact archived Macha Git blobs and all current nonpromoting receipts
        run: python scripts/v5/verify_post_macha475_takeover_delta_v1.py
      - name: Hostile mutations of scientific custody and review authority
        run: python -m pytest -q tests/v5/test_verify_post_macha475_takeover_delta_v1.py
