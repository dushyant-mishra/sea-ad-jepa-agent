name: Healthy teacher training contract audit

on:
  push:
    branches:
      - planning/healthy-teacher-training-contract-20260907
    paths:
      - docs/agent/HEALTHY_TEACHER_TRAINING_AUTHORITY_RECOVERY_20260907.json
      - docs/agent/HEALTHY_TEACHER_TRAINING_CONTRACT_V1_20260907.json
      - docs/agent/HEALTHY_TEACHER_TRAINING_CONTRACT_V1_20260907.md
      - scripts/agent/validate_healthy_teacher_training_contract_v1.py
      - tests/test_healthy_teacher_training_contract_v1.py
      - .github/workflows/healthy_teacher_training_contract_audit.yml

permissions:
  contents: read

jobs:
  contract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest

      - name: Compile validator
        run: python -m py_compile scripts/agent/validate_healthy_teacher_training_contract_v1.py

      - name: Run adversarial contract tests
        run: python -m pytest -q tests/test_healthy_teacher_training_contract_v1.py

      - name: Confirm current draft fails closed only on unbound execution bindings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.agent.validate_healthy_teacher_training_contract_v1 import validate_contract

          contract_path = Path("docs/agent/HEALTHY_TEACHER_TRAINING_CONTRACT_V1_20260907.json")
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          report = validate_contract(contract)

          expected_unbound = {
              "integrated_successor_commit",
              "integrated_successor_source_manifest_root",
              "independent_external_review_terminal",
              "initialization_checkpoint_path",
              "initialization_checkpoint_sha256",
              "initialization_mode",
              "predictor_mandatory_registry_sha256",
              "movement_adjudicator_sha256",
          }

          assert report["terminal"] == "STOP_HEALTHY_TEACHER_TRAINING_CONTRACT_UNBOUND", report
          assert report["failures"] == [], report
          assert set(report["unbound_fields"]) == expected_unbound, report
          assert contract["execution_bindings"]["ready"] is False
          assert contract["known_nonfinal_successor_state"]["mechanics_kernel_commit"] == "c0eaf2acc0a5edc837fb2a48f726b9d626772f06"
          assert contract["known_nonfinal_successor_state"]["limitation"]
          assert contract["initialization_policy"]["required_new_u0"]["must_be_frozen_before_u1"] is True
          assert contract["training_population"]["reader_validation_included"] is False
          assert contract["training_population"]["reader_oracle_included"] is False
          assert contract["training_population"]["foundation_development_included"] is False
          assert contract["training_population"]["foundation_sealed_holdout_included"] is False
          assert contract["training_population"]["pathology_access"] is False
          assert contract["biological_firewall"]["d1_real_execution"] is False

          validator_text = Path("scripts/agent/validate_healthy_teacher_training_contract_v1.py").read_text(encoding="utf-8")
          assert "--skip" not in validator_text
          assert "KNOWN_INCOMPLETE_KERNEL" in validator_text

          print(json.dumps(report, indent=2, sort_keys=True))
          print("PASS_HEALTHY_TEACHER_DRAFT_FAIL_CLOSED_AUDIT")
          PY

      - name: Bind draft bytes
        run: |
          sha256sum \
            docs/agent/HEALTHY_TEACHER_TRAINING_AUTHORITY_RECOVERY_20260907.json \
            docs/agent/HEALTHY_TEACHER_TRAINING_CONTRACT_V1_20260907.json \
            docs/agent/HEALTHY_TEACHER_TRAINING_CONTRACT_V1_20260907.md \
            scripts/agent/validate_healthy_teacher_training_contract_v1.py \
            tests/test_healthy_teacher_training_contract_v1.py
