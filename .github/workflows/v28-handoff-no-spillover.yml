name: V28 evidence handoff consistency (non-authorizing)
on:
  pull_request:
    paths:
      - 'docs/agent/JEPA_V28_*'
      - 'docs/agent/JEPA_NEW_CHAT_HANDOFF_20260926_V28_*'
      - 'docs/agent/JEPA_LATEST_HANDOFF_POINTER.json'
      - 'START_HERE.md'
      - 'scripts/agent/verify_v28_handoff_consistency_v1.py'
      - 'tests/test_v28_handoff_consistency.py'
      - '.github/workflows/v28-handoff-no-spillover.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentary-consistency-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.4
      - name: Fail closed on stale or falsely promoting evidence state
        run: python scripts/agent/verify_v28_handoff_consistency_v1.py --repo-root .
      - name: Eleven positive and adversarial documentary tests
        run: python -m pytest -q tests/test_v28_handoff_consistency.py --junitxml=v28-handoff-tests.xml
      - name: Strict exact test/skip census and named adversary proof
        run: |
          python - <<'PY'
          from xml.etree import ElementTree as ET
          x=ET.parse('v28-handoff-tests.xml').getroot()
          t=x if x.tag=='testsuite' else x.find('testsuite')
          if t is None: raise SystemExit('STOP_NO_V28_TEST_CENSUS')
          counts={k:int(t.get(k,0)) for k in ('tests','skipped','failures','errors')}
          names={z.get('name') for z in t.iter('testcase')}
          required={'test_original_dossier_positive_control',
            'test_retracted_s9_must_never_reappear_as_defect',
            'test_six_self_validations_do_not_become_six_closed_roots',
            'test_hardcoded_gradient_counter_cannot_be_repromoted',
            'test_nine_archive_members_are_not_ten_public_individual_files',
            'test_incomplete_raw_l4_scan_cannot_become_a_pass',
            'test_no_protected_access_from_document_edits',
            'test_known_provenance_mismatch_npz_must_remain_quarantined',
            'test_local_asset_count_cannot_silently_shrink',
            'test_pointer_must_not_mix_up_data_and_handoff_roles',
            'test_missing_handoff_file_is_not_a_successful_recovery'}
          if counts!={'tests':11,'skipped':0,'failures':0,'errors':0} or names!=required:
              raise SystemExit(f'STOP_V28_FALSE_GREEN {counts}; missing={sorted(required-names)}')
          print('PASS_V28_HANDOFF_DOC_ONLY 11 executed, 0 skipped; NO SCIENTIFIC OR TRAINING AUTHORITY')
          PY
