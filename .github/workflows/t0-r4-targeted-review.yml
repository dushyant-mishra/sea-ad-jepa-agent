name: T0 R4 targeted review

on:
  push:
    branches:
      - review/t0-r4-dataset-bound-inputs-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install targeted test dependencies
        run: python -m pip install --upgrade pip pytest numpy scipy h5py
      - name: Compile changed T0 modules
        run: |
          python -m py_compile             scripts/v4/t0_v20_row_count_authority_v1.py             scripts/v4/t0_dataset_bound_technical_inputs_v1.py             scripts/v4/t0_technical_completeness_authority_v1.py             scripts/v4/t0_estimability_preflight_v1.py
      - name: Run targeted T0 R4 suites
        run: |
          pytest -q             tests/v4/test_t0_v20_feature_projection_authority_v1.py             tests/v4/test_t0_v20_row_count_authority_v1.py             tests/v4/test_t0_v20_row_count_authority_r2_red_v1.py             tests/v4/test_t0_technical_completeness_authority_v1.py             tests/v4/test_t0_estimability_preflight_v1.py             tests/v4/test_t0_r4_dataset_binding_red_v1.py
