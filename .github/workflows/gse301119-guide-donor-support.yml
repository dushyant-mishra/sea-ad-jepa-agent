name: GSE301119 authenticated guide-donor support audit

on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/perturbation/gse301119_support_audit_v1.py'
      - 'tests/test_gse301119_support_audit_v1.py'
      - 'analysis/therapeutic_perturbation_etl/evidence/gse301119_rawpb_v1/*_guide_donor_meta.csv'
      - '.github/workflows/gse301119-guide-donor-support.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-metadata-replication-census:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Reproduce support census and run adversarial tests
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m pytest -q -W error tests/test_gse301119_support_audit_v1.py | tee /tmp/gse301119-support-tests.txt
          python -m sea_ad_jepa.perturbation.gse301119_support_audit_v1 \
            --evidence-dir analysis/therapeutic_perturbation_etl/evidence/gse301119_rawpb_v1 \
            --out /tmp/gse301119_support_receipt.json
      - name: Reject skipped tests and missing receipt
        run: |
          if grep -qiE '^SKIPPED|[0-9]+ skipped' /tmp/gse301119-support-tests.txt; then
            echo 'GUIDE-SUPPORT QUALIFICATION SKIPPED — STOP'
            exit 1
          fi
          test -s /tmp/gse301119_support_receipt.json
