name: JEPA V8d self-audit head drift and nonpromotion
on:
  pull_request:
    paths:
      - 'docs/agent/JEPA_POST_V8C_DELTA_V8D_20261027.md'
      - 'results/target_discovery/unified_qualification_v1/JEPA_POST_V8C_DELTA_V8D_20261027.json'
      - 'scripts/v5/verify_jepa_lane_audit_v8d.py'
      - 'tests/v5/test_verify_jepa_lane_audit_v8d.py'
      - '.github/workflows/jepa-lane-v8d-selfaudit.yml'
permissions:
  contents: read
jobs:
  v8d-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==9.1.1'
      - run: python scripts/v5/verify_jepa_lane_audit_v8d.py
      - run: python -m pytest -q tests/v5/test_verify_jepa_lane_audit_v8d.py
