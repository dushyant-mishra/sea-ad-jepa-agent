name: JEPA Event91+ latest handoff first-read and historical custody (NO TRAINING)
on:
  pull_request:
    paths:
      - 'docs/agent/JEPA_NEW_AGENT_LIVE_POINTER_20261029.md'
      - 'docs/agent/JEPA_20261105_EVENT91_READONLY_CPU_FULL_ADAM_STRUCTURED_JOURNAL_BRIDGE_NO_TRAINING.md'
      - 'results/target_discovery/unified_qualification_v1/JEPA_20261105_EVENT91_V5_STRUCTURED_STATE_JOURNAL_SOURCE_MAP.json'
      - 'scripts/v5/verify_jepa_event90_takeover_integrity_v1.py'
      - 'tests/v5/test_verify_jepa_event90_takeover_integrity_v1.py'
      - '.github/workflows/jepa-event91-latest-handoff-pointer-no-training.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latest-first-read-no-repeated-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Latest #460 pointer keeps historical Event90 custody and exact audit head
        run: python scripts/v5/verify_jepa_event90_takeover_integrity_v1.py --role handoff
      - name: Event90 immutable source/custody negative tests remain green
        run: python -m pytest -q tests/v5/test_verify_jepa_event90_takeover_integrity_v1.py
      - name: Event91 topmost pointer is the new live first-read
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("docs/agent/JEPA_NEW_AGENT_LIVE_POINTER_20261029.md").read_text()
          assert p.startswith("# READ FIRST — EVENT91")
          top = p.split("\n---\n", 1)[0]
          assert "Audit head 2d1badbfab942af7ac8c9ec14ae829f9e120b32f" in top
          assert "91 append-only" in top and "56 no-repeat" in top
          assert "42088900620" in top
          assert "JEPA_20261105_EVENT90_TWO_BRANCH_TAKEOVER_MAP.json" in top
          assert "TARGET_WINNER_NONE__REPRESENTATION_WINNER_NONE__REAL_TRAINING_OFF__STAGE4_NOT_AUTHORIZED" in top
          print("EVENT91_LIVE_POINTER_HISTORY_AND_NO_PROMOTION_OK")
          PY
