name: Population access registry audit

on:
  push:
    branches:
      - planning/sealed-holdout-registry-20260907
    paths:
      - docs/agent/JEPA_POPULATION_ACCESS_REGISTRY_V1_20260907.json
      - docs/agent/JEPA_POPULATION_ACCESS_AND_SEALED_HOLDOUT_CONTRACT_20260907.md
      - scripts/agent/validate_population_access_registry_v1.py
      - tests/test_population_access_registry_v1.py
      - .github/workflows/population_access_registry_audit.yml

permissions:
  contents: read

jobs:
  registry-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Compile validator
        run: python -m py_compile scripts/agent/validate_population_access_registry_v1.py
      - name: Run adversarial registry tests
        run: python -m pytest -q tests/test_population_access_registry_v1.py
      - name: Audit registry governance invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("docs/agent/JEPA_POPULATION_ACCESS_REGISTRY_V1_20260907.json")
          r = json.loads(p.read_text(encoding="utf-8"))
          assert r["status"] == "PROSPECTIVE_GOVERNANCE__NO_NEW_DATA_ACCESS_AUTHORIZED"
          assert r["verified_relations"]["every_reader_donor_is_foundation_split_train"] is True
          assert r["populations"]["reader_oracle"]["current_state"] == "SEALED_INTERNAL_ORACLE"
          assert r["populations"]["foundation_sealed_holdout"]["current_state"] == "SEALED_FOUNDATION_HOLDOUT"
          assert r["populations"]["foundation_train_without_reader_partition"]["count"] == 17
          assert r["cross_cutting_firewalls"]["pathology"]["state"] == "CLOSED"
          assert r["lane_rules"]["f1b_c3"]["training_population_authorized"] is False
          assert r["lane_rules"]["d1"]["reader_oracle_or_sealed_use_for_discovery"] is False
          assert r["historical_exposure"]["current_reader_oracle_state"] == "SEALED_INTERNAL_ORACLE"
          print("PASS_POPULATION_REGISTRY_GOVERNANCE_INVARIANTS")
          PY
