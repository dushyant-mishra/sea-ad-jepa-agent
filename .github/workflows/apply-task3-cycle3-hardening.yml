name: Apply Task 3 cycle3 hardening

permissions:
  contents: write

on:
  push:
    branches:
      - 'work/unified-task3-registry-impl-20261015'
    paths:
      - 'scripts/v5/td_unified/apply_task3_cycle3_hardening.py'
      - 'tests/v5/td_unified/test_registry_v1_hostile_cycle3.py'
      - 'tests/v5/td_unified/registry_v1_dependency_fixtures.py'
      - '.github/workflows/apply-task3-cycle3-hardening.yml'

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1 numpy==1.26.4
      - name: Apply deterministic cycle3 hardening
        run: python scripts/v5/td_unified/apply_task3_cycle3_hardening.py
      - name: Verify Task 3 focused and all hostile cycles
        id: focused
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/v5/td_unified/test_registry_v1.py \
            tests/v5/td_unified/test_registry_v1_self_audit1.py \
            tests/v5/td_unified/test_registry_v1_self_audit2.py \
            tests/v5/td_unified/test_registry_v1_hostile_cycle1.py \
            tests/v5/td_unified/test_registry_v1_hostile_cycle2.py \
            tests/v5/td_unified/test_registry_v1_hostile_cycle3.py \
            2>&1 | tee task3-cycle3-focused.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task3-cycle3-focused-log
          path: task3-cycle3-focused.log
      - name: Require focused suite success
        run: test "${{ steps.focused.outputs.status }}" = "0"
      - name: Verify complete unified regression
        run: python -m pytest -q tests/v5/td_unified
      - name: Commit cycle3 repaired source
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v5/td_unified/registry_v1.py
          git commit -m 'task3 GREEN3: bind registry units to Task 2 execution table'
          git push origin HEAD:work/unified-task3-registry-impl-20261015
