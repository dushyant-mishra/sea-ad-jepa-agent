name: JEPA audit V8 custody / no-repeat static gate
on:
  pull_request:
    paths:
      - 'docs/agent/JEPA_LANE_AUDIT_SNAPSHOT_V8_20261027.md'
      - 'docs/agent/JEPA_NO_REPEAT_DELTA_V8_20261027.md'
      - 'docs/agent/JEPA_LOCAL_ATTACHMENT_CUSTODY_RECONCILIATION_V8_20261027.csv'
      - 'results/target_discovery/unified_qualification_v1/JEPA_LANE_AUDIT_SNAPSHOT_V8_20261027.json'
      - 'scripts/v5/verify_jepa_lane_audit_v8.py'
      - 'tests/v5/test_verify_jepa_lane_audit_v8.py'
      - '.github/workflows/jepa-lane-v8-custody-audit.yml'
permissions:
  contents: read
jobs:
  audit-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==9.1.1'
      - name: V8 independent static custody self-check
        run: python scripts/v5/verify_jepa_lane_audit_v8.py
      - name: V8 hostile audit mutations
        run: python -m pytest -q tests/v5/test_verify_jepa_lane_audit_v8.py
