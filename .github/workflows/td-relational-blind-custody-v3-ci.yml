name: TD relational blind custody V3 audit

on:
  push:
    branches:
      - audit/td-relational-blind-custody-v3-20261013
  pull_request:
    paths:
      - 'scripts/v5/td_relational_successor_qualification_runner_v3.py'
      - 'scripts/v5/td_relational_successor_disk_runner_v3.py'
      - 'tests/v5/test_td_relational_successor_v3_custody.py'
      - 'docs/agent/TD_RELATIONAL_PIPELINE_EXTERNAL_SELF_AUDIT_20261013.md'
      - '.github/workflows/td-relational-blind-custody-v3-ci.yml'

permissions:
  contents: read

jobs:
  custody-v3-and-v2-nonregression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scipy scikit-learn
      - name: Verify exact clean head
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          test -z "$(git status --short)"
      - name: Compile TD implementation
        run: python -m compileall -q scripts/v5
      - name: Run V3 custody tests
        run: python -m pytest -q tests/v5/test_td_relational_successor_v3_custody.py
      - name: Re-run frozen V2 focused qualification suite
        run: |
          python -m pytest -q \
            tests/v5/test_td_test_qualification_package_v1.py \
            tests/v5/test_td_test_of_test_controller_v1.py \
            tests/v5/test_td_relational_successor_estimability_v1.py \
            tests/v5/test_td_relational_successor_gate_v1.py \
            tests/v5/test_td_relational_successor_synthetic_adapter_v1.py \
            tests/v5/test_td_relational_successor_observed_executor_v1.py \
            tests/v5/test_td_relational_successor_prepared_context_v1.py \
            tests/v5/test_td_relational_successor_capability_reducer_v1.py \
            tests/v5/test_td_relational_successor_qualification_runner_v1.py \
            tests/v5/test_td_relational_successor_readiness_v1.py \
            tests/v5/test_td_relational_successor_disk_runner_v1.py \
            tests/v5/test_td_relational_successor_identity_boundary_v1.py \
            tests/v5/test_td_relational_successor_controller_open_order_v1.py \
            tests/v5/test_td_relational_successor_self_audit_regressions_v2.py \
            tests/v5/test_td_relational_successor_v2_pipeline.py
      - name: Run relational replay spillover
        run: |
          python -m pytest -q \
            tests/v5/test_build_td_relational_replay_manifest.py \
            tests/v5/test_run_td_relational_replay_preflight.py \
            tests/v5/test_audit_td_relational_replay_mapping_preflight.py
      - name: Confirm tracked worktree unchanged
        run: test -z "$(git status --short --untracked-files=no)"
