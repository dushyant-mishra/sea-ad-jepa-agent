name: V29 teacher target prospective draft firewall
on:
  pull_request:
    paths:
      - 'docs/agent/JEPA_V29_TEACHER_DECISION_REQUEST_20260926.json'
      - 'docs/agent/JEPA_V29_TEACHER_DECISION_REVIEW_20260926.md'
      - 'scripts/v5/v29_teacher_decision_firewall.py'
      - 'tests/test_v29_teacher_decision_firewall.py'
      - '.github/workflows/v29-teacher-decision-draft.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-spillover-no-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.4
      - name: Validate the original scientific decision REQUEST only
        run: PYTHONPATH=src:. python scripts/v5/v29_teacher_decision_firewall.py docs/agent/JEPA_V29_TEACHER_DECISION_REQUEST_20260926.json
      - name: Fifteen independent adversarial and positive tests
        run: PYTHONPATH=src:. python -m pytest -q tests/test_v29_teacher_decision_firewall.py --junitxml=/tmp/v29_teacher.xml
      - name: Exact nonvacuous test census
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          x=ET.parse('/tmp/v29_teacher.xml').getroot()
          if x.tag!='testsuite':x=x.find('testsuite')
          n={k:int(x.attrib.get(k,0)) for k in ('tests','failures','errors','skipped')}
          names={q.attrib.get('name') for q in x.iter('testcase')}
          required={'test_complete_original_proposal_is_non_authorizing_positive_control',
                    'test_hidden_scalar_objective_cannot_replace_latent_target',
                    'test_unapproved_synthetic_mask_fraction_does_not_spill_over',
                    'test_protected_or_B1_training_authority_cannot_be_issued_by_draft',
                    'test_reviving_retracted_S9_or_vacuous_gradient_claim_fails'}
          if n!={'tests':15,'failures':0,'errors':0,'skipped':0} or not required<=names:
              raise SystemExit(f'STOP_PROPOSAL_TEST_CENSUS {n} missing={required-names}')
          print('PASS_15_15_PROSPECTIVE_DRAFT_ONLY__TRAINING_OFF')
          PY
