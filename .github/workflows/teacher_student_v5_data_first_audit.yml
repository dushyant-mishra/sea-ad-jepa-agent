name: Teacher/student V5 data-first planning audit

on:
  push:
    branches:
      - planning/teacher-student-v5-data-first-20260908
      - planning/teacher-student-v5-data-contract-refine-20260908
  pull_request:
    branches:
      - candidate/teacher-student-unified-v4-relational-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-first-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest numpy pandas scipy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run frozen V4 active suite unchanged
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          tests=[line.strip() for line in Path("docs/agent/TEACHER_STUDENT_ACTIVE_TEST_SELECTION_V4.txt").read_text().splitlines() if line.strip() and not line.lstrip().startswith("#")]
          assert len(tests)==7 and len(set(tests))==7,tests
          subprocess.run([sys.executable,"-m","pytest","-q",*tests],check=True)
          PY

      - name: Import every live V5 planning module
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          import importlib
          names=[
            "sea_ad_jepa.v5",
            "sea_ad_jepa.v5.data_first_geometry",
            "sea_ad_jepa.v5.finite_relational_sampling",
            "sea_ad_jepa.v5.keyed_rng_reference",
            "sea_ad_jepa.v5.keyed_dropout_prototype",
            "sea_ad_jepa.v5.schedule_authority_v1",
            "sea_ad_jepa.v5.support_geometry_v1",
            "sea_ad_jepa.v5.data_contract_v2",
          ]
          for name in names: importlib.import_module(name)
          print("PASS_V5_LIVE_MODULE_IMPORT_CLOSURE")
          PY

      - name: Run exact V5 planning attack suite
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q \
            tests/test_teacher_student_data_first_v1.py \
            tests/test_teacher_student_packed_equivalence_v1.py \
            tests/test_teacher_student_v5_support_geometry_v1.py \
            tests/test_teacher_student_v5_data_contract_v2.py \
            tests/test_teacher_student_v5_convergence_coherence_v1.py

      - name: Compile V5 source and live profilers
        env:
          PYTHONPATH: src:.
        run: |
          python -m py_compile \
            src/sea_ad_jepa/v5/*.py \
            scripts/agent/profile_reader_fit_data_geometry_v1.py \
            scripts/agent/profile_reader_fit_support_overlap_v1.py

      - name: Verify V5 stays inactive and production schedule is unfrozen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          runtime=Path("src/sea_ad_jepa/v4/teacher_student_runtime.py").read_text()
          assert "sea_ad_jepa.v5" not in runtime
          assert "keyed_dropout_prototype" not in runtime
          support=json.loads(Path("docs/agent/READER_FIT_SUPPORT_OVERLAP_PROFILE_V1.json").read_text())
          assert support["candidate_use_only"] is True
          assert support["training_authorized"] is False
          assert support["all_42_operators_measured_scalar"]==17186
          authority=json.loads(Path("docs/agent/TEACHER_STUDENT_V5_DATA_FIRST_AUTHORITY_CANDIDATE.json").read_text())
          assert authority["training_authorized"] is False
          assert authority["successor_u0_materialization_authorized"] is False
          assert authority["td60_execution_authorized"] is False
          forbidden=[
              Path("docs/agent/HEALTHY_TEACHER_U0_U40_EXECUTION_AUTHORITY_V1.json"),
              Path("docs/agent/HEALTHY_TEACHER_CONTINUATION_EXECUTION_AUTHORITY_V1.json"),
          ]
          assert not any(p.exists() for p in forbidden),forbidden
          print("PASS_V5_DATA_FIRST_LIVE_CLOSURE__PRODUCTION_SCHEDULE_UNFROZEN__TRAINING_UNAUTHORIZED")
          PY
