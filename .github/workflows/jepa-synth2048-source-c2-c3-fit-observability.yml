name: JEPA synth2048 source/C2/C3 FIT observability (NO TRAINING)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-pr547-observed-fit-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Install pinned original synthetic fit runtime
        run: |
          python -m pip install -r requirements/unified-synthetic-integration-v1.txt
      - name: Read only exact PR547 FIT artifact
        env:
          GH_TOKEN: ${{ github.token }}
          JEPA_SYNTH2048_DEV_ZIP: /tmp/jepa_synth2048_fit_original_exact.zip
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts/13364085153/zip" > "$JEPA_SYNTH2048_DEV_ZIP"
          echo "87fe3ec2038305c797c439cd9780036fe22cc22b647242749b1af0bfb444c06f  $JEPA_SYNTH2048_DEV_ZIP" | sha256sum --check -
      - name: Independent source/identity/right adversarial tests
        env:
          PYTHONPATH: .
          JEPA_SYNTH2048_DEV_ZIP: /tmp/jepa_synth2048_fit_original_exact.zip
        run: |
          python -m pytest -q tests/v79/test_synth2048_source_depth_c3_feasibility_v1.py
      - name: Produce purely descriptive C2/C3 cross-source report
        env:
          PYTHONPATH: .
        run: |
          python -m scripts.v79.audit_synth2048_source_depth_c3_feasibility_v1 \
            --fit-zip /tmp/jepa_synth2048_fit_original_exact.zip \
            --report /tmp/jepa_synth2048_source_observability.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/jepa_synth2048_source_observability.json'))
          assert x['status']=="DESCRIPTIVE_OBSERVABILITY_ONLY__NO_TD_OR_JEPA_GATE_PASS"
          assert x['C1_C2_C3_C4_C5_C6_status']=="ALL_UNASSESSED"
          assert [x['per_source'][s]['C3_query_and_other8_structurally_estimable_cells']
                  for s in ("SYNTH_A","SYNTH_B","SYNTH_C")]==[480,480,480]
          assert x['training_or_student_scoring_executed'] is False
          assert x['selection_or_threshold_freeze_produced'] is False
          print("SOURCE_C2_C3_FIT_FEASIBILITY_ONLY__NO_JEPA_TRAINING__NO_C_TARGET_PASS")
          PY
      - name: Archive source/cell observational metrics only, no query values
        uses: actions/upload-artifact@v4
        with:
          name: synth2048-source-c2-c3-observability-only
          path: /tmp/jepa_synth2048_source_observability.json
          retention-days: 30
          if-no-files-found: error
