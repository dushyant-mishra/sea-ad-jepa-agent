name: Real original V5 initialized U0 modules to V2 journal (NO TRAINING)
on:
  pull_request:
    paths:
      - scripts/v5/jepa_v5_live_model_u0_journal_connector_v1.py
      - tests/test_jepa_v5_live_model_u0_journal_connector_v1.py
      - tests/test_jepa_v5_live_model_u0_journal_connector_v1_macha_review_red.py
      - scripts/v5/jepa_v5_structured_journal_preflight_v1.py
      - scripts/v5/jepa_v5_pipeline_identity_contract_v1.py
      - results/target_discovery/unified_qualification_v1/JEPA_V5_DEV2048_PIPELINE_IDENTITY_CONTRACT_V1.json
      - .github/workflows/jepa-v5-real-original-u0-to-v2-journal-no-training.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-v5-init-only-cpu-u0-no-forward-or-optimizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.9", "3.12.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU-only Torch 2.5.1 and NumPy for ORIGINAL PUBLIC FIT, plus pytest
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 pytest==9.0.2
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Fetch only PUBLIC original PR547 synthetic FIT bytes and verify before reading
        env:
          GH_TOKEN: ${{ github.token }}
          JEPA_PUBLIC_DEV_FIT_ZIP: ${{ runner.temp }}/ORIGINAL_PR547_PUBLIC_DEV2048_FIT_ONLY.zip
          JEPA_PUBLIC_FIT_ZIP: ${{ runner.temp }}/ORIGINAL_PR547_PUBLIC_DEV2048_FIT_ONLY.zip
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts/13364085153/zip" > "$JEPA_PUBLIC_DEV_FIT_ZIP"
          echo "87fe3ec2038305c797c439cd9780036fe22cc22b647242749b1af0bfb444c06f  $JEPA_PUBLIC_DEV_FIT_ZIP" | sha256sum --check -
      - name: Fail closed before test collection if a selected test can invoke a model update or EMA
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          allowlist = [
              "tests/test_jepa_v5_live_model_u0_journal_connector_v1.py",
              "tests/test_jepa_v5_live_model_u0_journal_connector_v1_macha_review_red.py",
              "tests/test_jepa_v5_pipeline_identity_contract_v1_macha.py",
              "tests/test_jepa_v5_source_data_custody_gate_v1.py",
              "tests/test_jepa_v5_structured_journal_preflight_v1.py",
              "tests/test_jepa_v5_full_state_readonly_audit_v1.py",
          ]
          forbidden_calls = {
              "step", "backward", "run_ema", "run_guarded_inactive_reference_update",
              "run_inactive_reference_update", "optimizer_step", "ema_update",
              "apply_ema", "update_ema", "run_training", "fit_model",
          }
          assert len(set(allowlist)) == len(allowlist)
          for name in allowlist:
              path = Path(name)
              assert path.is_file(), f"NO_STEP_ALLOWLIST_MISSING: {name}"
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=name)
              for call in (n for n in ast.walk(tree) if isinstance(n, ast.Call)):
                  name_at_call = (call.func.attr if isinstance(call.func, ast.Attribute)
                                  else call.func.id if isinstance(call.func, ast.Name)
                                  else None)
                  assert name_at_call not in forbidden_calls, (
                      f"FORBIDDEN_OPTIMIZER_BACKWARD_EMA_CALL_IN_TEST: "
                      f"{name}:{call.lineno}:{name_at_call}")
          print("ALL_6_EXPLICIT_NO_STEP_NO_BACKWARD_NO_EMA_TEST_FILES_AST_VERIFIED")
          PY
      - name: Actual PR224 original V5 modules initialized U0 ONLY, read-only capture + V2 journal, hostility tests
        env:
          PYTHONPATH: .:src
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          JEPA_PUBLIC_DEV_FIT_ZIP: ${{ runner.temp }}/ORIGINAL_PR547_PUBLIC_DEV2048_FIT_ONLY.zip
          JEPA_PUBLIC_FIT_ZIP: ${{ runner.temp }}/ORIGINAL_PR547_PUBLIC_DEV2048_FIT_ONLY.zip
        run: |
          python -m pytest -q \
            tests/test_jepa_v5_live_model_u0_journal_connector_v1.py \
            tests/test_jepa_v5_live_model_u0_journal_connector_v1_macha_review_red.py \
            tests/test_jepa_v5_pipeline_identity_contract_v1_macha.py \
            tests/test_jepa_v5_source_data_custody_gate_v1.py
      - name: Original structured journal and no-optimizer direct read-only test unchanged
        env:
          PYTHONPATH: .:src
          CUDA_VISIBLE_DEVICES: ""
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python -m pytest -q \
            tests/test_jepa_v5_structured_journal_preflight_v1.py \
            tests/test_jepa_v5_full_state_readonly_audit_v1.py
      - name: Explicit original V5 module connection is initialized snapshot not training
        env:
          PYTHONPATH: .:src
          CUDA_VISIBLE_DEVICES: ""
        run: |
          python - <<'PY'
          from scripts.v5 import jepa_v5_live_model_u0_journal_connector_v1 as live
          from scripts.v5 import jepa_v5_structured_journal_preflight_v1 as bridge
          assert live.AUTHORITY == "TARGET_WINNER_NONE__REPRESENTATION_WINNER_NONE__REAL_TRAINING_OFF__STAGE4_NOT_AUTHORIZED"
          assert bridge.AUTHORITY == live.AUTHORITY
          assert not hasattr(live, "run_guarded_inactive_reference_update")
          assert not hasattr(live, "commit_post_step")
          assert not hasattr(live, "restore_model")
          assert live.CONFIG["vocabulary_size"] == 2048
          assert live.CONFIG["width"] == 160 and live.CONFIG["blocks"] == 6
          assert live.CONFIG["init_seed"] == 8113002
          from scripts.v5 import jepa_v5_pipeline_identity_contract_v1 as pic
          assert pic.DATASET_CLASS == "PR547_PUBLIC_SYNTHETIC_DEV2048_FIT_ONLY"
          assert all(v is False for v in pic.AUTHORIZATION.values())
          print("REAL_V5_ORIGINAL_U0_WEIGHT_SNAPSHOT_IN_DEV_JOURNAL_ONLY__NO_FORWARD_BACKWARD_ADAM_EMA")
          PY
