name: Synthetic frozen measured-panel observability (fixture only)

on:
  pull_request:
    paths:
      - 'scripts/v79/audit_frozen_measured_panel_observability_v1.py'
      - 'tests/v79/test_frozen_measured_panel_observability_v1.py'
      - '.github/workflows/jepa-frozen-measured-panel-observability-v1.yml'
      - 'docs/agent/JEPA_SYNTHETIC_FROZEN_MEASUREMENT_REUSE_20261102.md'
  push:
    branches:
      - science/synthetic-r5-measured-panel-observability-20261102

permissions:
  contents: read

jobs:
  frozen-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - run: python -m pip install -r requirements/unified-synthetic-integration-v1.txt
      - name: Compile audit and tests
        run: python -m py_compile scripts/v79/audit_frozen_measured_panel_observability_v1.py tests/v79/test_frozen_measured_panel_observability_v1.py
      - name: Run frozen-world measured support and hostile invariants
        run: python -m pytest -q tests/v79/test_frozen_measured_panel_observability_v1.py
      - name: Emit aggregate-only frozen-panel diagnostic
        run: |
          python -m scripts.v79.audit_frozen_measured_panel_observability_v1 . > /tmp/frozen_measured_panel_observability.txt
          cat /tmp/frozen_measured_panel_observability.txt
      - name: Archive only aggregate diagnostic (no counts/truth)
        uses: actions/upload-artifact@v4
        with:
          name: frozen-measured-panel-observability-v1
          path: /tmp/frozen_measured_panel_observability.txt
          if-no-files-found: error
          retention-days: 30
