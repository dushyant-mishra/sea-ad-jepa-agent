name: TD real R1 depth-matched null V3

on:
  push:
    branches:
      - fix/td-real-r1-depth-matched-null-v3-20261014
  pull_request:
    paths:
      - 'scripts/v5/td_real_relational_executor_v3.py'
      - 'tests/v5/test_td_real_relational_executor_v3.py'
      - '.github/workflows/td-real-r1-depth-matched-null-v3.yml'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1 numpy==2.4.6 scipy==1.15.3
      - name: Run R1 V3 depth-matched-null tests
        run: python -m pytest -q tests/v5/test_td_real_relational_executor_v3.py
      - name: Authority guard
        run: |
          ! grep -R "TARGET_WINNER_\|REAL_TRAINING_ON\|STAGE4_AUTHORIZED" scripts/v5/td_real_relational_executor_v3.py 2>/dev/null
