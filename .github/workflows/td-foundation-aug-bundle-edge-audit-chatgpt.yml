name: TD August Foundation R2 archive edge contract mechanics (synthetic CI only)
on:
  pull_request:
    paths:
      - 'scripts/v5/td_unified/audit_foundation_bundle_edge_v1.py'
      - 'tests/v5/td_unified/test_audit_foundation_bundle_edge_v1.py'
      - '.github/workflows/td-foundation-aug-bundle-edge-audit-chatgpt.yml'
permissions:
  contents: read
jobs:
  synthetic-auditor-hostiles:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 numpy==1.26.4
      - name: Hostile collision-union, missing-supplement limitation and denominator witness
        run: python -m pytest -q -rA tests/v5/td_unified/test_audit_foundation_bundle_edge_v1.py
      - name: Syntax validation
        run: python -m py_compile scripts/v5/td_unified/audit_foundation_bundle_edge_v1.py
