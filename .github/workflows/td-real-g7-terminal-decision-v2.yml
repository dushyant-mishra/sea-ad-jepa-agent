name: TD real G7 terminal decision V2
on:
  push:
    branches: [implementation/td-real-g7-terminal-decision-v2-20261014]
  pull_request:
    paths:
      - 'scripts/v5/td_real_g7_terminal_decision_v2.py'
      - 'tests/v5/test_td_real_g7_terminal_decision_v2.py'
      - '.github/workflows/td-real-g7-terminal-decision-v2.yml'
jobs:
  qualify:
    runs-on: ubuntu-latest
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.17'}
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q tests/v5/test_td_real_g7_terminal_decision_v2.py
      - run: |
          echo HUMAN_VALUES_DOWNLOADED=false
          echo HUMAN_G7_EXECUTED=false
          echo AUTHORITY_ALL_FALSE=true
