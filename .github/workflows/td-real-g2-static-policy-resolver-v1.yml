name: TD real G2 static policy resolver V1

on:
  push:
    branches:
      - implementation/td-real-g2-static-policy-resolver-v1-20261014
  pull_request:
    paths:
      - 'scripts/v5/td_real_g2_static_policy_resolver_v1.py'
      - 'tests/v5/test_td_real_g2_static_policy_resolver_v1.py'
      - '.github/workflows/td-real-g2-static-policy-resolver-v1.yml'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      TD_G2_SUPPORT_ROOT: ${{ github.workspace }}/frozen/support
    steps:
      - name: Checkout policy harness
        uses: actions/checkout@v4
      - name: Checkout exact support registry head
        uses: actions/checkout@v4
        with:
          ref: 1ab453e5cb60efb209a8eee2aecb61c5ea0fbfc7
          path: frozen/support
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Run G2 static-policy resolver tests
        run: python -m pytest -q tests/v5/test_td_real_g2_static_policy_resolver_v1.py
      - name: Authority guard
        run: |
          ! grep -R "TARGET_WINNER_\|REAL_TRAINING_ON\|STAGE4_AUTHORIZED" scripts/v5/td_real_g2_static_policy_resolver_v1.py 2>/dev/null
