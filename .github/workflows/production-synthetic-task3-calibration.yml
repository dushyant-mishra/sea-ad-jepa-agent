name: Production synthetic Task 3 calibration firewall
on:
  pull_request:
    paths:
      - 'scripts/production_synthetic/calibration_v1.py'
      - 'tests/production_synthetic/test_calibration_v1.py'
      - 'tests/production_synthetic/test_calibration_v1_macha_hostile.py'
      - '.github/workflows/production-synthetic-task3-calibration.yml'
permissions:
  contents: read
jobs:
  calibration-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tooling
        run: python -m pip install pytest==9.1.1
      - name: Task 3 calibration hostile fixture tests
        run: python -m pytest -q tests/production_synthetic/test_calibration_v1.py tests/production_synthetic/test_calibration_v1_macha_hostile.py
