name: Task3 RED6 actor repair one-shot

on:
  push:
    branches:
      - work/unified-task3-registry-impl-20261015

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact RED6 production repair
        run: |
          python scripts/agent/task3_red6_actor_identity_repair.py
          python scripts/agent/task3_green6_actor_resolver_patch.py
      - name: Migrate pre-RED6 Task 3 fixtures
        run: python scripts/agent/task3_green6_fixture_migration.py
      - name: Commit repaired authority surface and fixture migration
        run: |
          if git diff --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v5/td_unified/registry_v1.py schemas/target_discovery/unified_v1/td_qualification_registry_v1.json tests/v5/td_unified/test_registry_v1*.py tests/v5/td_unified/registry_v1_dependency_fixtures.py
          git commit -m 'task3 GREEN6: migrate actor-bound registry fixtures'
          git push origin HEAD:work/unified-task3-registry-impl-20261015
