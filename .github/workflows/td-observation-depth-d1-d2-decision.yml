name: Observation depth D1/D2 decision guard (NO AUTHORITY)
on:
  pull_request:
    paths:
      - 'docs/agent/JEPA_OBSERVATION_DEPTH_DECISION_D1_D2_20261028.md'
      - 'results/target_discovery/unified_qualification_v1/JEPA_OBSERVATION_DEPTH_DECISION_D1_D2_20261028.json'
      - 'tests/v5/td_unified/test_observation_depth_decision_d1_d2_20261028.py'
      - '.github/workflows/td-observation-depth-d1-d2-decision.yml'
permissions:
  contents: read
jobs:
  decision-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            results
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: bash
        run: python -m pip install pytest==9.1.1
      - shell: bash
        run: python -m pytest -q -rA tests/v5/td_unified/test_observation_depth_decision_d1_d2_20261028.py
