name: D1-A synthetic contract audit

on:
  push:
    branches:
      - d1a-synthetic-estimation-atlas-20260907
    paths:
      - docs/agent/D1A_SYNTHETIC_ESTIMATION_ATLAS_CONTRACT_20260907.json
      - docs/agent/D1A_SYNTHETIC_CONTRACT_MANIFEST_20260907.csv
      - docs/agent/D1A_SYNTHETIC_CONTRACT_PACKAGE_ROOT_20260907.txt
      - docs/agent/D1A_SYNTHETIC_CONTRACT_FREEZE_20260907.json
      - scripts/agent/validate_d1a_synthetic_contract_v1.py
      - tests/test_d1a_synthetic_contract_v1.py
      - .github/workflows/d1a_synthetic_contract_audit.yml

permissions:
  contents: read

jobs:
  contract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Compile validator
        run: python -m py_compile scripts/agent/validate_d1a_synthetic_contract_v1.py
      - name: Run adversarial contract tests
        run: python -m pytest -q tests/test_d1a_synthetic_contract_v1.py
      - name: Validate exact contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.agent.validate_d1a_synthetic_contract_v1 import validate_contract
          path = Path("docs/agent/D1A_SYNTHETIC_ESTIMATION_ATLAS_CONTRACT_20260907.json")
          report = validate_contract(json.loads(path.read_text(encoding="utf-8")))
          assert report["terminal"] == "D1A_CONTRACT_VALID", report
          assert report["failures"] == [], report
          root_path = Path("docs/agent/D1A_SYNTHETIC_CONTRACT_PACKAGE_ROOT_20260907.txt")
          freeze_path = Path("docs/agent/D1A_SYNTHETIC_CONTRACT_FREEZE_20260907.json")
          if root_path.exists():
              import hashlib
              manifest = Path("docs/agent/D1A_SYNTHETIC_CONTRACT_MANIFEST_20260907.csv").read_bytes()
              manifest_sha = hashlib.sha256(manifest).hexdigest()
              assert root_path.read_text(encoding="ascii").strip() == manifest_sha
              assert freeze_path.exists()
              freeze = json.loads(freeze_path.read_text(encoding="utf-8"))
              assert freeze["package_root_sha256"] == manifest_sha
              assert freeze["terminal"] == "D1A_SYNTHETIC_CONTRACT_FREEZE__REAL_D1_UNAUTHORIZED"
          print("D1A_CONTRACT_VALID")
          PY
      - name: Bind contract bytes
        run: |
          sha256sum \
            docs/agent/D1A_SYNTHETIC_ESTIMATION_ATLAS_CONTRACT_20260907.json \
            scripts/agent/validate_d1a_synthetic_contract_v1.py \
            tests/test_d1a_synthetic_contract_v1.py \
            docs/agent/D1A_SYNTHETIC_CONTRACT_MANIFEST_20260907.csv
