name: JEPA G7 E3 Macha449 scoped audit delta nonpromotion
on:
  pull_request:
    paths:
      - 'results/target_discovery/unified_qualification_v1/JEPA_G7_E3_MACHA449_SCOPED_DELTA_20261027.json'
      - 'docs/agent/JEPA_G7_E3_MACHA449_SCOPED_AUDIT_DELTA_20261027.md'
      - 'scripts/v5/verify_jepa_g7_e3_macha449_scoped_delta_20261027.py'
      - 'tests/v5/test_verify_jepa_g7_e3_scoped_delta_20261027.py'
      - '.github/workflows/jepa-g7-e3-macha449-scoped-audit-delta.yml'
permissions:
  contents: read
jobs:
  source-record-no-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest==9.1.1
      - name: Source-pinned audit record nonpromotion
        run: python scripts/v5/verify_jepa_g7_e3_macha449_scoped_delta_20261027.py
      - name: Hostile claim escalation and RED erasure regressions
        run: python -m pytest -q tests/v5/test_verify_jepa_g7_e3_scoped_delta_20261027.py
