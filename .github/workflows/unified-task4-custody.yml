name: Unified Task 4 custody

on:
  pull_request:
    paths:
      - 'scripts/v5/td_unified/**'
      - 'schemas/target_discovery/unified_v1/**'
      - 'tests/v5/td_unified/test_task4*.py'
      - 'tests/v5/td_unified/test_challenge_custody_v1*.py'
      - 'results/target_discovery/unified_qualification_v1/TASK4_ATTACK_MATRIX_V1.json'
      - '.github/workflows/unified-task4-custody.yml'
  push:
    branches:
      - 'work/unified-task4-red-20261016'
      - 'work/unified-task4-impl-20261016'
    paths:
      - 'scripts/v5/td_unified/**'
      - 'schemas/target_discovery/unified_v1/**'
      - 'tests/v5/td_unified/test_task4*.py'
      - 'tests/v5/td_unified/test_challenge_custody_v1*.py'
      - 'results/target_discovery/unified_qualification_v1/TASK4_ATTACK_MATRIX_V1.json'
      - '.github/workflows/unified-task4-custody.yml'

permissions:
  contents: read

jobs:
  task4-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1 numpy==1.26.4
      - name: Focused Task 4 custody suites
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/v5/td_unified/test_task4*.py tests/v5/td_unified/test_challenge_custody_v1*.py)
          python -m pytest -q "${files[@]}"
      - name: Projected 100k custody replay benchmark
        env:
          TASK4_SCALE_BENCHMARK: '1'
        run: python -m pytest -q tests/v5/td_unified/test_task4_performance_v1.py::test_projected_100k_optimized_replay_meets_ceiling
      - name: Full unified Task 0-4 regression
        run: python -m pytest -q tests/v5/td_unified
