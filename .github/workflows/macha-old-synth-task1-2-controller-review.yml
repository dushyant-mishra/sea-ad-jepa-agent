name: Macha old synthetic Task 1-2 controller review

on:
  pull_request:
    branches:
      - implementation/production-synthetic-v3-1-1-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task1-task2-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused review dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run exact Task 1 and Task 2 suites
        run: |
          python -m pytest -q \
            tests/production_synthetic/test_canonical_v1.py \
            tests/production_synthetic/test_custody_v1.py \
            tests/production_synthetic/test_custody_v1_hostile.py
