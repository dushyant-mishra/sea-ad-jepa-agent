name: 'JEPA current student implementation: frozen Macha review + D1 integration'

on:
  pull_request:
    paths:
      - "scripts/v5/td_unified/observation_v2c_standalone_student_gate_v1.py"
      - "scripts/v5/td_unified/observation_d1_base_only_student_v2c_fixture_v1.py"
      - "tests/v5/td_unified/test_observation_d1_v2c_composed_fixture_v1.py"
      - ".github/workflows/jepa-current-student-review-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-boundary:
    name: Original reviewer tests, ${{ matrix.os }} NumPy ${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        numpy: ["1.26.4", "2.2.6"]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/v5/
            tests/v5/td_unified/test_observation_d1_v2c_composed_fixture_v1.py
            .github/workflows/jepa-current-student-review-replay.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8,<9" "numpy==${{ matrix.numpy }}"
      - name: Bring archived legacy modules only into ephemeral hostile-test workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          # Read original frozen Git blob, not newline-converted Windows worktree
          data=subprocess.check_output(["git","show","HEAD:scripts/v5/td_unified/observation_v2c_standalone_student_gate_v1.py"])
          digest=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\x00"+data).hexdigest()
          assert digest=="46b813fcbf598e12a2a9f209ca254d01aaeba784",digest
          Path("REPAIRED_V2C_TEST_ONLY.tmp").write_bytes(data)
          PY
          git fetch --no-tags --depth=1 origin fa06d486d5f8a130ff545690a8f0b12773c4f85d 881194aec9d99a9d42cbf206ffcb779429c4e768 32c0a22b9ae6220ed03fe7d6e944da753c0e4a0c
          git restore --source=fa06d486d5f8a130ff545690a8f0b12773c4f85d --worktree -- scripts/v5/td_unified/
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/v5/td_unified/observation_v2c_standalone_student_gate_v1.py")
          p.write_bytes(Path("REPAIRED_V2C_TEST_ONLY.tmp").read_bytes())
          Path("REPAIRED_V2C_TEST_ONLY.tmp").unlink()
          PY
      - name: Restore original immutable #516/#518 tests by SHA (never rewrite tests)
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib, subprocess
          out=pathlib.Path("tests/v5/td_unified");out.mkdir(parents=True,exist_ok=True)
          cases=[
            ("881194aec9d99a9d42cbf206ffcb779429c4e768","test_v2c_standalone_student_gate_514_macha_review_red.py","8647c07a893d932ffa5f05a79be50c89c3c28b53"),
            ("32c0a22b9ae6220ed03fe7d6e944da753c0e4a0c","test_d1_v2c_composed_515_macha_review_red.py","2a63a753081012e10a9c6cb39b80e79d16848ebe"),
          ]
          for commit,name,expected in cases:
              data=subprocess.check_output(["git","show",commit+":tests/v5/td_unified/"+name])
              sha=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\x00"+data).hexdigest()
              if sha!=expected:raise RuntimeError("immutable review test drift "+name)
              (out/name).write_bytes(data)
              print(name,sha)
          PY
      - name: Run current D1 tests and unchanged Macha adversarial tests against repaired V2C
        run: python -m pytest -q -p no:cacheprovider tests/v5/td_unified/test_observation_d1_v2c_composed_fixture_v1.py tests/v5/td_unified/test_v2c_standalone_student_gate_514_macha_review_red.py tests/v5/td_unified/test_d1_v2c_composed_515_macha_review_red.py
      - name: No promotion
        if: always()
        run: |
          echo 'Author replay only. Legacy code restored on CI test workspace, not student Docker image.'
          echo 'Macha independent acceptance of consolidated branch and external issuer still pending.'
