name: E2G portal public API metadata probe

on:
  push:
    branches:
      - audit/external-e2g-compat-20261027
    paths:
      - "scripts/regulatory/probe_e2g_portal_public_api_v1.py"
      - ".github/workflows/e2g-portal-public-api-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-graphql-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source-level compilation
        run: python -m py_compile scripts/regulatory/probe_e2g_portal_public_api_v1.py
      - name: Probe public GraphQL metadata ONLY (two bounded POSTs, no Google Cloud billing)
        run: python scripts/regulatory/probe_e2g_portal_public_api_v1.py --timeout 15
