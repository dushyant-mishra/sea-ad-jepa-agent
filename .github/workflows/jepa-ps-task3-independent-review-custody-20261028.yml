      - '.github/workflows/jepa-ps-task3-independent-review-custody-20261028.yml'
permissions:
  contents: read
jobs:
  original-review-red-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Verify verbatim reviewer source/test Git blobs and exact negative results
        run: python scripts/v5/verify_ps_task3_chatgpt_review_20261028.py
