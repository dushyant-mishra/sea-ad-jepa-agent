    paths:
      - 'results/production_synthetic/JEPA_TASK3_CHATGPT_INDEPENDENT_REVIEW_20261028.json'
      - 'docs/agent/JEPA_PS_TASK3_MACHA437_INDEPENDENT_REVIEW_20261028.md'
      - 'docs/agent/review_probes/chatgpt_20261028/ps_task3_437_expected_red_probe.py.txt'
      - 'scripts/v5/verify_ps_task3_chatgpt_review_20261028.py'
