name: V79 V2_CORE world generator

on:
  pull_request:
    paths:
      - 'scripts/v79/generate_v79_v2_core_worlds.py'
      - 'scripts/v79/v79_v2_core_planting.py'
      - 'scripts/v79/v79_v2_core_observation.py'
      - 'tests/v79/test_v79_v2_core_world_generator.py'
      - 'tests/v79/test_v79_v2_core_generator_hardening.py'
      - 'tests/v79/test_v79_v2_core_structural_seed.py'
      - 'tests/v79/test_v79_v2_core_baseline_planting.py'
      - 'tests/v79/test_v79_v2_core_observation.py'
      - '.github/workflows/v79-v2-core-world-generator.yml'

jobs:
  world-generator-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest
      - run: python -m pytest tests/v79/test_v79_v2_core_world_generator.py tests/v79/test_v79_v2_core_generator_hardening.py tests/v79/test_v79_v2_core_structural_seed.py tests/v79/test_v79_v2_core_baseline_planting.py tests/v79/test_v79_v2_core_observation.py -q
