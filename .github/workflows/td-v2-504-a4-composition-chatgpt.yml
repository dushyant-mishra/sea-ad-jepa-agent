name: TD V2 #502 #503 compose independently reviewed Macha #504 A4 (fixture only)
on:
  pull_request:
    paths:
      - 'scripts/v5/td_unified/q_excluded_depth_v1.py'
      - 'tests/v5/td_unified/test_q_excluded_depth_v1_a4_repair.py'
      - 'tests/v5/td_unified/test_observation_v2_503_with_macha504_a4_integration.py'
      - '.github/workflows/td-v2-504-a4-composition-chatgpt.yml'
permissions:
  contents: read
jobs:
  v2-a4-composed:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        numpy: ['1.26.4', '2.2.6']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install pytest==9.1.1 numpy==${{ matrix.numpy }}
      - name: Exact Macha source and V2 A4 composition
        run: python -m pytest -q -rA tests/v5/td_unified/test_observation_v2_503_with_macha504_a4_integration.py
      - name: Original Macha #504 A4 tests, byte-identical
        run: python -m pytest -q tests/v5/td_unified/test_q_excluded_depth_v1_a4_repair.py
      - name: Original #474 source producer tests
        run: >-
          python -m pytest -q
          tests/v5/td_unified/test_q_excluded_depth_v1.py
          tests/v5/td_unified/test_q_excluded_depth_v1_independent_limits.py
      - name: ChatGPT #502 versioned and historical V2 shape, #503 pair, adapted #481
        run: >-
          python -m pytest -q
          tests/v5/td_unified/test_observation_normalization_v2_bound_content.py
          tests/v5/td_unified/test_observation_normalization_view_v2_fixture.py
          tests/v5/td_unified/test_observation_v2_private_pair_coherence_v1.py
          tests/v5/td_unified/test_v2_bound_content_macha481_replay.py
