name: TD R1 depth matched null V2

on:
  push:
    branches:
      - fix/td-r1-depth-matched-null-v2-20261014
  pull_request:
    paths:
      - 'scripts/v5/td_r1_known_truth_stress_v1.py'
      - 'scripts/v5/td_r1_depth_matched_null_v2.py'
      - 'tests/v5/test_td_r1_known_truth_stress_v1.py'
      - 'tests/v5/test_td_r1_depth_matched_null_v2.py'
      - '.github/workflows/td-r1-depth-matched-null-v2.yml'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1 numpy==2.4.6
      - name: Run R1 V2 hostile repair RED
        run: python -m pytest -q tests/v5/test_td_r1_depth_matched_null_v2.py
      - name: Authority guard
        run: |
          ! grep -R "REAL_TRAINING_ON\|STAGE4_AUTHORIZED\|TARGET_WINNER_" scripts/v5/td_r1_depth_matched_null_v2.py 2>/dev/null
