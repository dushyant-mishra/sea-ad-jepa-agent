name: Post-TD 517 narrow source repair

on:
  pull_request:
    paths:
      - 'scripts/v5/jepa_post_td_harness_contract_v1.py'
      - 'tests/v5/test_jepa_post_td_517_repair_v1.py'
      - '.github/workflows/post-td-517-repair-v1.yml'
  push:
    branches:
      - fix/post-td-517-numeric-digest-address-20261102

jobs:
  inherited-and-hostile:
    name: Python ${{ matrix.python-version }} inherited + five repaired hostile assertions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONPATH: scripts/v5:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile implementation and regression tests
        run: python -m py_compile scripts/v5/jepa_post_td_harness_contract_v1.py tests/v5/test_jepa_post_td_517_repair_v1.py
      - name: Verify original post-TD and C4/C6 tests plus five repaired original failures
        run: |
          python -m unittest -v \
            tests.v5.test_jepa_post_td_harness_contract_v1 \
            tests.v5.test_jepa_post_td_c4_requires_c6_v1 \
            tests.v5.test_jepa_post_td_517_repair_v1
