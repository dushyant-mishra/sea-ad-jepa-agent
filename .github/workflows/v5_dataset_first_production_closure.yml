name: V5 dataset-first production closure

on:
  push:
    branches:
      - planning/v5-dataset-first-production-closure-20260912
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dataset-first-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest numpy scipy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run dataset-first closure tests
        env:
          PYTHONPATH: src:.
        run: >
          python -m pytest -q
          tests/test_full_reader_relational_target_preflight_v1.py
          tests/test_artifact_binding_v1.py
          tests/test_bind_corrected_train_cache_v1.py
          tests/test_bind_full104_expression_blocks_v4.py
          tests/test_full104_binding_dimension_interface_v1.py
          tests/test_dimension_execution_firewall_v1.py
          tests/test_dimension_authority_guard_v3.py
          tests/test_dimension_authority_guard_v4.py
          tests/test_preexecution_dependency_guard_v1.py
          tests/test_preexecution_qualification_bundle_v2.py
          tests/test_production_geometry_gpu_guard_v1.py
          tests/test_v5_qualified_target_optimizer_guard_v1.py
          tests/test_same_cell_technical_intervention_probe_v1.py
          tests/test_rejection_gate_power_calibration_v3.py
      - name: Compile changed authority sources
        run: >
          python -m py_compile
          scripts/v5_anticheat/full_reader_relational_target_preflight_v1.py
          scripts/v5_anticheat/bind_full104_expression_blocks_v4.py
          src/sea_ad_jepa/v5/artifact_binding_v1.py
          src/sea_ad_jepa/v5/full104_dimension_interface_v1.py
          src/sea_ad_jepa/v5/dimension_execution_firewall_v1.py
          src/sea_ad_jepa/v5/dimension_authority_guard_v3.py
          src/sea_ad_jepa/v5/dimension_authority_guard_v4.py
          src/sea_ad_jepa/v5/preexecution_dependency_guard_v1.py
          src/sea_ad_jepa/v5/preexecution_qualification_bundle_v2.py
          src/sea_ad_jepa/v5/production_geometry_gpu_guard_v1.py
