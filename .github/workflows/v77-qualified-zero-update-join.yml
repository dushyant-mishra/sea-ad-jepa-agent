name: v77-qualified-zero-update-join

on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/qualification/v77_join.py'
      - 'tests/integration/test_v77_joined_zero_update.py'
      - '.github/workflows/v77-qualified-zero-update-join.yml'
      - 'docs/superpowers/plans/2026-10-07-v77-qualified-zero-update-join.md'
  push:
    branches:
      - 'integrate/v77-qualified-zero-update-20261007'

jobs:
  joined-zero-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run V77 joined ZERO_UPDATE contract
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q tests/integration/test_v77_joined_zero_update.py
