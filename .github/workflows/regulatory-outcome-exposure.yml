name: Regulatory outcome exposure ledger

on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/regulatory/regulatory_exposure_ledger_v1.py'
      - 'tests/test_regulatory_exposure_ledger_v1.py'
      - '.github/workflows/regulatory-outcome-exposure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regulatory-exposure-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify granular monotonic exposure and fail-closed confirmation scope
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m pytest -q -W error tests/test_regulatory_exposure_ledger_v1.py | tee /tmp/regulatory-exposure.log
      - name: Reject skipped tests
        run: |
          if grep -qiE '^SKIPPED|[0-9]+ skipped' /tmp/regulatory-exposure.log; then
            echo 'REGULATORY EXPOSURE CONTRACT TEST SKIPPED — STOP'
            exit 1
          fi
