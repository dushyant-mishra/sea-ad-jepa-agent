name: V26 deterministic reader-fit proposal (synthetic)

on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/v5/reader_fit_development_sampler_v1.py'
      - 'scripts/agent/run_v26_reader_fit_development_proposal.py'
      - 'tests/test_v26_reader_fit_development_sampler_v1.py'
      - '.github/workflows/v26-reader-fit-development-proposal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-proposal-adversaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact CPU prerequisites
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pytest==8.3.4
      - name: Execute exact proposal and existing population adversaries
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q \
            tests/test_v26_reader_fit_development_sampler_v1.py \
            tests/test_v26_reader_fit_population_preflight_v1.py \
            tests/test_v26_frozen_pass1_reader_fit_count_bridge_v1.py \
            --junitxml=/tmp/v26-proposal.xml
      - name: Reject missing or skipped controls
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse("/tmp/v26-proposal.xml").getroot()
          suite=root if root.tag=="testsuite" else root.find("testsuite")
          if suite is None: raise SystemExit("STOP_NO_TEST_SUITE")
          counts={k:int(suite.attrib.get(k,0)) for k in ("tests","skipped","failures","errors")}
          cases={x.attrib.get("name","").split("[")[0] for x in suite.iter("testcase")}
          required={
            "test_exact_positive_control_and_no_training_authority",
            "test_same_seed_index_and_population_replay_bit_identical",
            "test_exact_donor_uniform_not_cell_uniform_large_draw",
            "test_cells_unique_per_update_and_donor_draws_remain_with_replacement",
            "test_oversubscribed_donor_slots_stop_before_returning_selection",
            "test_even_potential_capacity_oversubscription_rejected_before_draw",
            "test_unchanged_global_total_but_swapped_donor_masses_fails",
            "test_heldout_or_continuation_donor_identity_fails",
            "test_change_in_source_root_changes_rng_stream",
            "test_no_real_file_implies_no_real_selection",
            "test_synthetic_output_writer_records_npz_hash_without_training",
            "test_synthetic_output_writer_refuses_existing_output_dir",
            "test_synthetic_output_writer_rejects_forged_training_receipt",
            "test_synthetic_output_writer_rejects_selection_digest_mismatch",
          }
          if counts["tests"] < 79 or any(counts[k] for k in ("skipped","failures","errors")) or not required<=cases:
            raise SystemExit(f"STOP_PROPOSAL_INCOMPLETE {counts} missing={sorted(required-cases)}")
          print(f"PASS_V26_READER_FIT_PROPOSAL_SYNTHETIC_ONLY {counts['tests']} passed, zero skipped")
          PY
