name: TD unified Task 0 B1-B5 RED

on:
  pull_request:
    paths:
      - 'tests/v5/td_unified/test_task0_b1_b5_regressions.py'
      - 'results/target_discovery/unified_qualification_v1/**'
      - '.github/workflows/td-unified-task0-b1-b5-red.yml'
  workflow_dispatch:

jobs:
  task0-b1-b5-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install 'pytest>=9,<10'
      - name: Run B1-B5 hostile regressions
        run: python -m pytest -q tests/v5/td_unified/test_task0_b1_b5_regressions.py
