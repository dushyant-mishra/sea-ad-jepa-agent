name: V44 historical tiny teacher tournament evidence (non-authorizing)
on:
  pull_request:
    paths:
      - 'analysis/v44_tiny_teacher_team_tournament_20260926/**'
      - 'tests/test_v44_historical_teacher_tournament_v1.py'
      - 'docs/agent/JEPA_V44_*'
      - '.github/workflows/v44-tiny-teacher-tournament-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-descriptive-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile complete research-only producer and validator
        run: |
          set -euo pipefail
          python -m py_compile analysis/v44_tiny_teacher_team_tournament_20260926/run_historical_tournament_v1.py analysis/v44_tiny_teacher_team_tournament_20260926/verify_tournament_v1.py tests/test_v44_historical_teacher_tournament_v1.py
      - name: Verify exact original 15-result CSV against frozen research state
        run: |
          set -euo pipefail
          python analysis/v44_tiny_teacher_team_tournament_20260926/verify_tournament_v1.py | tee /tmp/v44_evidence.txt
          grep -q 'V44_15_EXACT_ORIGINAL_ROWS_FIVE_ARMS_THREE_HELDOUT_SPLITS' /tmp/v44_evidence.txt
          grep -q 'V44_48_UNIQUE_REPEATED_DONOR_CAVEAT_AND_RICH_EVIDENCE_BIAS' /tmp/v44_evidence.txt
          grep -q 'V44_NO_REAL_IPB_NO_Q_SPECIFICITY_NO_TRAINING_AUTHORITY' /tmp/v44_evidence.txt
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('analysis/v44_tiny_teacher_team_tournament_20260926')
          state=json.loads((root/'tournament_machine_state_v1.json').read_text())
          script=(root/'run_historical_tournament_v1.py').read_text()
          prepared=state['originals']['prepared_derived_CSR_npy_sha256']
          assert set(prepared)=={'data.npy','indices.npy','indptr.npy','shape.npy'}
          for name,digest in prepared.items():
              assert digest in script, 'derived array is not pinned by GitHub reproducer: '+name
          assert state['local_exact_artifacts']['github_reproducer_status'].endswith('NOT_PHYSICAL_ORIGINAL_SOURCE_EXECUTION')
          pointer=json.loads(pathlib.Path('docs/agent/JEPA_V44_LATEST_EXPERIMENTAL_POINTER_20260926.json').read_text())
          assert pointer['training_authorized'] is False
          assert pointer['actual_current_v5_ipb_tournament_tested'] is False
          assert pointer['scientific_champion_selected'] is False
          assert pointer['local_result_zip_sha256']==state['local_exact_artifacts']['portable_sha256']
          handoff=pathlib.Path('docs/agent/JEPA_V44_TINY_TOURNAMENT_NEW_CHAT_HANDOFF_20260926.md').read_text()
          for phrase in ('PR #177','48 unique','0.407823','NOT the canonical IPBEncoder','TRAINING=OFF'):
              assert phrase in handoff,phrase
          print('V44_NEW_CHAT_ORIGINAL_CUSTODY_FAIRNESS_AND_NO_FAKE_IPB_VERIFIED')
          PY
      - name: Adversarial false-green mutation suite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v44_historical_teacher_tournament_v1.py' -v 2>&1 | tee /tmp/v44_tests.txt
          grep -q '^Ran 15 tests' /tmp/v44_tests.txt
          grep -q '^OK$' /tmp/v44_tests.txt
          if grep -q 'skipped=' /tmp/v44_tests.txt; then echo V44_SKIPPED_TEST_FAIL_CLOSED; exit 1; fi
          echo V44_FIFTEEN_NEGATIVE_POSITIVE_CONTROLS_NO_SKIPS
