name: GSE178317 matched-well support-qualified V2 comparison

on:
  pull_request:
    paths:
      - 'analysis/therapeutic_perturbation_etl/scripts/build_gse178317_support_qualified_comparison_v2.py'
      - 'analysis/therapeutic_perturbation_etl/outputs/gse178317/gse178317_vs_crisprbrain_engagement_v1.csv'
      - 'analysis/therapeutic_perturbation_etl/evidence/gse178317_recovery/gse178317_guide_assignment_receipt_v2_lanegate.json'
      - 'tests/test_gse178317_support_qualified_comparison_v2.py'
      - '.github/workflows/gse178317-support-qualified-comparison-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-skips-and-physical-source-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency only
        run: python -m pip install --disable-pip-version-check pytest
      - name: Actual source-linked and adversarial tests
        run: |
          set -o pipefail
          python -m pytest -q -W error tests/test_gse178317_support_qualified_comparison_v2.py | tee /tmp/support33-tests.log
      - name: Fail on unexpected skips
        run: |
          if grep -qiE '^SKIPPED|[0-9]+ skipped' /tmp/support33-tests.log; then
            echo "STOP: required tests skipped"
            exit 1
          fi
      - name: Recompute from exact committed historical CSV and support receipt
        run: |
          python analysis/therapeutic_perturbation_etl/scripts/build_gse178317_support_qualified_comparison_v2.py \
            --comparison analysis/therapeutic_perturbation_etl/outputs/gse178317/gse178317_vs_crisprbrain_engagement_v1.csv \
            --support-receipt analysis/therapeutic_perturbation_etl/evidence/gse178317_recovery/gse178317_guide_assignment_receipt_v2_lanegate.json \
            --out-dir /tmp/gse178317-support33-development-v2
      - name: Reopen produced receipt and fail closed
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("/tmp/gse178317-support33-development-v2/gse178317_support_qualified_reference_comparison_receipt_v2.json")
          r=json.loads(p.read_text())
          assert r["targets_support_qualified"]==33
          assert r["direction_agreement"]=={"both_negative":33,"denominator":33}
          assert math.isclose(r["spearman_rho"],0.7473262032085561,abs_tol=1e-12)
          assert math.isclose(r["pearson_r"],0.6397544786275293,abs_tol=1e-12)
          assert not r["independent_validation"] and not r["biological_uncertainty_estimable"]
          assert not r["prospective_confirmation_eligible"] and not r["jepa_prediction_used"]
          print("PASS: physical source-linked 33-target DEVELOPMENT receipt")
          PY
      - name: Preserve versioned DEVELOPMENT result for independent review
        uses: actions/upload-artifact@v4
        with:
          name: gse178317-DEVELOPMENT-same-experiment-support33
          path: /tmp/gse178317-support33-development-v2/
