name: V79 rare-biology input authority

on:
  pull_request:
    paths:
      - 'tests/v79/test_v79_rare_biology_input_authority.py'
      - 'scripts/v79/v79_rare_biology_input_authority.py'
      - 'results/v79/rare_biology_integration/V79_RARE_BIOLOGY_INPUT_AUTHORITY_V1.json'
      - '.github/workflows/v79-rare-biology-input-authority.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest tests/v79/test_v79_rare_biology_input_authority.py -q
