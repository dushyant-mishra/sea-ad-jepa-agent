name: V5 synth2048 real atomic opaque checkpoint bytes (NO TRAINING)
on:
  pull_request:
    paths:
      - scripts/v5/jepa_synth2048_atomic_checkpoint_bytes_v1.py
      - tests/test_jepa_synth2048_atomic_checkpoint_bytes_v1.py
      - tests/test_jepa_synth2048_failed_onset_atomic_journal_v1.py
      - tests/test_jepa_synth2048_failed_onset_journal_macha_red.py
      - tests/test_jepa_synth2048_forensic_prefix_e2_successor_v1.py
      - docs/agent/JEPA_20261104_V5_ATOMIC_OPAQUE_CHECKPOINT_BYTES_IMPLEMENTATION_NO_TRAINING.md
      - .github/workflows/jepa-synth2048-atomic-checkpoint-bytes.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-disk-sha-no-model:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11.9", "3.12.7"]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install only pytest; no torch/CUDA or private data
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Original prefreeze and new physical filesystem hostile tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_jepa_synth2048_checkpoint_capture_prefreeze_v1.py \
            tests/test_jepa_synth2048_atomic_checkpoint_bytes_v1.py \
            tests/test_jepa_synth2048_failed_onset_atomic_journal_v1.py \
            tests/test_jepa_synth2048_failed_onset_journal_macha_red.py::test_e2_red_last_valid_checkpoint_stays_readable_after_interrupted_write \
            tests/test_jepa_synth2048_forensic_prefix_e2_successor_v1.py
      - name: Explicit source-scope refusal of model authority
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from scripts.v5 import jepa_synth2048_atomic_checkpoint_bytes_v1 as c
          assert c.STATUS == "OPAQUE_BYTES_STORAGE_ONLY__NO_TRAINING_OR_RESUME_AUTHORITY"
          assert c.SOURCE_FIT_SHA256 == "87fe3ec2038305c797c439cd9780036fe22cc22b647242749b1af0bfb444c06f"
          assert c.SOURCE_V5_HEAD == "cde03f738c758694aa66211b5021603af943675b"
          print("ACTUAL_FILE_WRITE_AND_FRESH_PROCESS_SHA_ONLY__NO_MODEL_OR_TRAINING")
          PY
