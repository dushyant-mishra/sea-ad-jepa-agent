name: v5-inactive-runtime-step-guard

on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/v5/inactive_runtime_step_guard_v1.py'
      - 'src/sea_ad_jepa/v5/inactive_guarded_update_v1.py'
      - 'src/sea_ad_jepa/v5/inactive_update_reference.py'
      - 'tests/test_v5_inactive_runtime_step_guard_v1.py'
      - 'tests/test_teacher_student_v5_inactive_update_reference.py'
      - '.github/workflows/v5-inactive-runtime-step-guard.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: |
          python -m pip install --disable-pip-version-check pytest numpy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run focused runtime safety tests
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q \
            tests/test_v5_inactive_runtime_step_guard_v1.py \
            tests/test_teacher_student_v5_inactive_update_reference.py
