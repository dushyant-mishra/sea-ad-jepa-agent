name: Independent review PR474 q-excluded depth scientific contract limitations
on:
  pull_request:
    paths:
      - 'tests/v5/td_unified/test_q_excluded_depth_v1_independent_limits.py'
      - 'docs/agent/JEPA_PR474_INDEPENDENT_Q_EXCLUDED_DEPTH_REVIEW_20261027.md'
      - '.github/workflows/q-excluded-depth474-independent-contract-review.yml'
permissions:
  contents: read
jobs:
  existing-and-independent-limits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Run original 101 laws and five independent adversarial scope tests
        run: >-
          python -m pytest -q
          tests/v5/td_unified/test_q_excluded_depth_v1.py
          tests/v5/td_unified/test_q_excluded_depth_v1_independent_limits.py
