name: T0 R5 independent review

on:
  pull_request:
    branches:
      - t0/v20-pathology-blind-materialization-20260908

permissions:
  contents: read

jobs:
  affected-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy h5py
      - name: Compile changed modules
        run: |
          python -m py_compile             scripts/v4/t0_raw_source_row_authority_v1.py             scripts/v4/t0_v20_row_count_authority_v1.py             scripts/v4/t0_technical_completeness_authority_v1.py             scripts/v4/t0_estimability_preflight_v1.py
      - name: Run affected T0 suites
        run: |
          pytest -q             tests/v4/test_t0_raw_source_row_authority_v1.py             tests/v4/test_t0_v20_row_count_authority_v1.py             tests/v4/test_t0_v20_row_count_authority_r2_red_v1.py             tests/v4/test_t0_technical_completeness_authority_v1.py             tests/v4/test_t0_estimability_preflight_v1.py             tests/v4/test_t0_r5_independent_acceptance_v1.py
