name: T0 R5 independent review

on:
  pull_request:
    branches:
      - t0/v20-pathology-blind-materialization-20260908

permissions:
  contents: read

jobs:
  full-t0:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy h5py
      - name: Compile changed modules
        run: >-
          python -m py_compile
          scripts/v4/t0_raw_source_row_authority_v1.py
          scripts/v4/t0_v20_row_count_authority_v1.py
          scripts/v4/t0_technical_completeness_authority_v1.py
          scripts/v4/t0_estimability_preflight_v1.py
          scripts/v4/t0_input_dependency_contract_v1.py
      - name: Run complete declared T0 suite plus R5 acceptance
        run: >-
          pytest -q
          tests/test_work_checkpoint_v1.py
          tests/v4/test_t0_at8_availability_authority_v1.py
          tests/v4/test_t0_v20_feature_projection_authority_v1.py
          tests/v4/test_t0_v20_row_count_authority_v1.py
          tests/v4/test_t0_v20_row_count_authority_r2_red_v1.py
          tests/v4/test_t0_input_dependency_contract_v1.py
          tests/v4/test_t0_immune_fraction_authority_v1.py
          tests/v4/test_t0_immune_fraction_authority_r2_v1.py
          tests/v4/test_t0_immune_support_count_authority_v1.py
          tests/v4/test_t0_age_sex_authority_v1.py
          tests/v4/test_t0_technical_completeness_authority_v1.py
          tests/v4/test_t0_estimability_preflight_v1.py
          tests/v4/test_t0_raw_source_row_authority_v1.py
          tests/v4/test_t0_r5_independent_acceptance_v1.py
