      - 'tests/test_v65_recoverability_geometry_gate_redundancy.py'
      - '.github/workflows/v64-privileged-architecture-smoke.yml'
  workflow_dispatch:

jobs:
  architecture-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable Claude audit source
        run: git fetch --no-tags --depth=1 origin 0d3874cb198f0fdeddff5a41777e3e0e9d0db5ab
      - name: Materialize immutable Claude Phase-A/Phase-B authorities for cross-branch audits
        run: |
          git fetch --no-tags --depth=1 origin dc30caede6369a31df3098205db11c83381784e5
          mkdir -p results/v64/phase_a_v3 results/v64/phase_b_design
          git show dc30caede6369a31df3098205db11c83381784e5:results/v64/phase_a_v3/PHASE_A_V3_ROWS.jsonl.gz > results/v64/phase_a_v3/PHASE_A_V3_ROWS.jsonl.gz
          git show dc30caede6369a31df3098205db11c83381784e5:results/v64/phase_b_design/V64_PHASE_B_ENUM_INTERVALS_V1.json > results/v64/phase_b_design/V64_PHASE_B_ENUM_INTERVALS_V1.json
          git show dc30caede6369a31df3098205db11c83381784e5:results/v64/phase_b_design/V64_PHASE_B_MEASUREMENT_SUBSTRATE_CONTRACT_V1.json > results/v64/phase_b_design/V64_PHASE_B_MEASUREMENT_SUBSTRATE_CONTRACT_V1.json
          git show dc30caede6369a31df3098205db11c83381784e5:results/v64/phase_b_design/V64_PHASE_B_R3_CONDITIONING_REFERENCE_V1.json > results/v64/phase_b_design/V64_PHASE_B_R3_CONDITIONING_REFERENCE_V1.json
          echo "ab103675e715fec32cee27b2d402ef1b45d63332b190bb4a6878e946059a24d4  results/v64/phase_a_v3/PHASE_A_V3_ROWS.jsonl.gz" | sha256sum -c -
          echo "4b78ef131b06f69729ca92db436ffaad3fe8f966b8d0e62e9771dc7d2c1fc619  results/v64/phase_b_design/V64_PHASE_B_ENUM_INTERVALS_V1.json" | sha256sum -c -
          echo "17987ce727382cd6fcd998de2cca285eb12063889236bdbc553dfe500a9ca32b  results/v64/phase_b_design/V64_PHASE_B_MEASUREMENT_SUBSTRATE_CONTRACT_V1.json" | sha256sum -c -
          echo "82045d8fe26c46ac03462adffeff1dca266465e44384b9e97bf58f32b4a2f0a2  results/v64/phase_b_design/V64_PHASE_B_R3_CONDITIONING_REFERENCE_V1.json" | sha256sum -c -
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install smoke-test dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run V64/V65 privileged-information architecture smoke suite
        run: |
          pytest -q \
            tests/test_v64_privileged_information_architecture_v1.py \
            tests/test_v64_privileged_information_smoke_producer_v1.py \
            tests/test_v64_regulatory_architecture_contracts_v1.py \
            tests/test_v64_universal_rna_privileged_critic_architecture_v1.py \
            tests/test_v64_open_regulatory_resource_registry_v1.py \
            tests/test_v64_address_and_resource_fetch_contracts_v1.py \
            tests/test_v64_privileged_recoverability_shortcut_smoke_v1.py \
            tests/test_v64_open_resource_fetch_utility_v1.py \
            tests/test_v64_open_resource_byte_validator_v1.py \
            tests/test_v64_paired_split_and_dong_bridge_v1.py \
            tests/test_v64_promoter_candidate_ledger_builder_v1.py \
            tests/test_v64_exact_supplement_independent_audit_v1.py \
            tests/test_v64_full104_and_sampler_status_v1.py \
            tests/test_v64_screen_pls_gencode_preflight_v1.py \
            tests/test_v64_phase_a_exact_independent_audit_v1.py \
            tests/test_v65_promoter_and_recoverability_contracts.py \
            tests/test_v65_promoter_dual_ledger_v2.py \
            tests/test_v65_recoverability_precision_contract.py \
            tests/test_v65_recoverability_train_validation_preflight.py \
            tests/test_v65_nested_rna_multimodal_student_architecture.py \
            tests/test_v65_recoverability_train_validation_authorization_gate.py \
            tests/test_v65_nested_rna_multimodal_student_synthetic.py \
            tests/test_v65_full104_like_nested_student_teacher_synthetic.py \
            tests/test_v65_nested_student_teacher_synthetic_training_mechanics.py \
            tests/test_v64_phase_b_interval_universe_audit_v1.py \
            tests/test_v64_phase_b_t6_t7_reference_audit_v1.py \
            tests/test_v65_recoverability_decision_synthetic.py \
            tests/test_v65_recoverability_numerical_synthetic_smoke.py \
            tests/test_v65_recoverability_permutation_geometry_smoke.py \
            tests/test_v65_recoverability_execution_mechanics.py \
            tests/test_v65_privileged_recoverability_decision_engine_smoke_v1.py \
            tests/test_v65_recoverability_authority_consistency.py \
            tests/test_v65_privileged_recoverability_numerical_synthetic_smoke_v1.py \
            tests/test_v65_recoverability_geometry_gate_redundancy.py \
            tests/test_v65_privileged_recoverability_geometry_gate_v2.py \
            tests/test_v65_privileged_recoverability_pairing_r2_gate_v2.py \
            tests/v64/test_stage4_execution_authority_validator_v1.py \
            tests/test_v67_nested_modality_mask_uncertainty_anticollapse.py
