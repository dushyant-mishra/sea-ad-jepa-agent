name: V64 privileged-information architecture smoke

on:
  pull_request:
    paths:
      - 'docs/agent/V64_*'
      - 'results/v64/V64_*'
      - 'scripts/v64/privileged_information_architecture_smoke_v1.py'
      - 'scripts/v64/privileged_recoverability_shortcut_smoke_v1.py'
      - 'scripts/v64/fetch_open_promoter_resources_v1.py'
      - 'scripts/v64/validate_open_promoter_resource_bytes_v1.py'
      - 'tests/test_v64_privileged_information_architecture_v1.py'
      - 'tests/test_v64_privileged_information_smoke_producer_v1.py'
      - 'tests/test_v64_regulatory_architecture_contracts_v1.py'
      - 'tests/test_v64_universal_rna_privileged_critic_architecture_v1.py'
      - 'tests/test_v64_open_regulatory_resource_registry_v1.py'
      - 'tests/test_v64_address_and_resource_fetch_contracts_v1.py'
      - 'tests/test_v64_privileged_recoverability_shortcut_smoke_v1.py'
      - 'tests/test_v64_open_resource_fetch_utility_v1.py'
      - 'tests/test_v64_full104_and_sampler_status_v1.py'
      - 'tests/test_v64_paired_split_and_dong_bridge_v1.py'
      - 'tests/test_v64_open_resource_byte_validator_v1.py'
      - 'tests/test_v64_screen_pls_gencode_preflight_v1.py'
      - '.github/workflows/v64-privileged-architecture-smoke.yml'
  workflow_dispatch:

jobs:
  architecture-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install smoke-test dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run V64 privileged-information architecture smoke suite
        run: |
          pytest -q \
            tests/test_v64_privileged_information_architecture_v1.py \
            tests/test_v64_privileged_information_smoke_producer_v1.py \
            tests/test_v64_regulatory_architecture_contracts_v1.py \
            tests/test_v64_universal_rna_privileged_critic_architecture_v1.py \
            tests/test_v64_open_regulatory_resource_registry_v1.py \
            tests/test_v64_address_and_resource_fetch_contracts_v1.py \
            tests/test_v64_privileged_recoverability_shortcut_smoke_v1.py \
            tests/test_v64_open_resource_fetch_utility_v1.py \
            tests/test_v64_open_resource_byte_validator_v1.py \
            tests/test_v64_paired_split_and_dong_bridge_v1.py \
            tests/test_v64_promoter_candidate_ledger_builder_v1.py \
            tests/test_v64_exact_supplement_independent_audit_v1.py \
            tests/test_v64_full104_and_sampler_status_v1.py \
            tests/test_v64_screen_pls_gencode_preflight_v1.py
