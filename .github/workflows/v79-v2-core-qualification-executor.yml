name: V79 V2_CORE qualification executor

on:
  pull_request:
    paths:
      - 'scripts/v79/v79_v2_core_fit_*.py'
      - 'scripts/v79/run_v79_v2_core_benchmark.py'
      - 'tests/v79/test_v79_v2_core_fit_*.py'
      - 'tests/v79/test_v79_v2_core_benchmark.py'
      - '.github/workflows/v79-v2-core-qualification-executor.yml'
      - 'docs/superpowers/plans/2026-10-12-v79-v2-core-qualification-executor.md'
  workflow_dispatch:

jobs:
  executor-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve byte identity
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen structural dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.0.2 jax==0.4.35 jaxlib==0.4.35 numpyro==0.15.3 pytest
      - name: Run executor structural tests
        run: python -m pytest tests/v79/test_v79_v2_core_fit_surface.py tests/v79/test_v79_v2_core_fit_model.py -q -rA -p no:cacheprovider
