name: Teacher/student unified V2 audit

on:
  push:
    branches:
      - production/teacher-student-unified-v1-20260907
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest numpy pandas scipy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify V2 source and active-test authorities
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/agent/audit_teacher_student_integration_freeze_v2.py --root .
      - name: Compile manifest-bound Python source
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          rows = list(csv.DictReader(Path(
              "docs/agent/TEACHER_STUDENT_INTEGRATED_SOURCE_MANIFEST_V2.csv"
          ).open(newline="", encoding="utf-8")))
          compiled = 0
          for row in rows:
              path = Path(row["path"])
              if path.suffix == ".py":
                  compile(path.read_bytes(), str(path), "exec")
                  compiled += 1
          print("compiled", compiled)
          PY
      - name: Run exact V2 active test selection
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          tests = [
              line.strip()
              for line in Path(
                  "docs/agent/TEACHER_STUDENT_ACTIVE_TEST_SELECTION_V2.txt"
              ).read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          print("active tests:", len(tests))
          subprocess.run([sys.executable, "-m", "pytest", "-q", *tests], check=True)
          PY
      - name: Confirm training remains unauthorized
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = [
              Path("docs/agent/HEALTHY_TEACHER_U0_U40_EXECUTION_AUTHORITY_V1.json"),
              Path("docs/agent/HEALTHY_TEACHER_CONTINUATION_EXECUTION_AUTHORITY_V1.json"),
          ]
          assert not any(path.exists() for path in forbidden), forbidden
          print("PASS_NO_HEALTHY_TEACHER_EXECUTION_AUTHORITY_PRESENT")
          PY
