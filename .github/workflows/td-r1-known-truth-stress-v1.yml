name: TD R1 known-truth stress V1

on:
  push:
    branches:
      - implementation/td-r1-known-truth-stress-v1-20261014
  pull_request:
    paths:
      - 'scripts/v5/td_r1_known_truth_stress_v1.py'
      - 'tests/v5/test_td_r1_known_truth_stress_v1.py'
      - '.github/workflows/td-r1-known-truth-stress-v1.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - run: python -m pip install pytest==9.1.1
      - name: Run R1 known-truth stress tests
        run: python -m pytest -q tests/v5/test_td_r1_known_truth_stress_v1.py
      - name: Authority guard
        run: |
          echo HUMAN_VALUES_DOWNLOADED=false
          echo HUMAN_R1_EXECUTED=false
          echo AUTHORITY_ALL_FALSE=true
