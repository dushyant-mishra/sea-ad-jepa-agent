name: V26 CRISPRbrain clean-head physical replay

on:
  pull_request:
    paths:
      - "analysis/therapeutic_perturbation_etl/scripts/clean_replay_crisprbrain_against_legacy_receipt_v1.py"
      - "tests/test_crisprbrain_clean_head_replay_v1.py"
      - ".github/workflows/v26-crisprbrain-clean-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-adversaries:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Assert exact complete adversarial test census
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q -p no:randomly tests/test_crisprbrain_clean_head_replay_v1.py --junitxml=/tmp/clean-replay-tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/clean-replay-tests.xml').getroot()
          suite=root if root.tag=='testsuite' else root.find('testsuite')
          if suite is None:
              raise SystemExit('STOP_NO_CRISPRBRAIN_TEST_SUITE')
          counts={k:int(suite.get(k,0)) for k in ('tests','skipped','failures','errors')}
          names={t.get('name','') for t in suite.iter('testcase')}
          for expected in ('test_02_byte_tamper_is_detected_even_with_correct_row_count',
                           'test_06_only_four_declared_volatile_keys_excluded',
                           'test_09_clean_replay_refuses_report_inside_checkout_without_touching_inputs'):
              if expected not in names:
                  raise SystemExit('STOP_MISSING_ADVERSARY: '+expected)
          if counts != dict(tests=10,skipped=0,failures=0,errors=0):
              raise SystemExit('STOP_INCOMPLETE_CRISPRBRAIN_SUITE: '+str(counts))
          print('PASS_CRISPRBRAIN_REPLAY_ADVERSARIES: 10 passed, zero skipped')
          PY

  physical-clean-head-replay:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install exact original major/minor numerical environment
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check numpy==1.24.2 pandas==1.5.3 scipy==1.10.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Physically rerun all committed CRISPRbrain input screens in a clean checkout
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "CRISPRBRAIN_CLEAN_HEAD_REPLAY_V1.json"
          python analysis/therapeutic_perturbation_etl/scripts/clean_replay_crisprbrain_against_legacy_receipt_v1.py --repo . --report "$report"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain only the small independent read-only replay certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crisprbrain-clean-head-replay-certificate
          path: ${{ runner.temp }}/CRISPRBRAIN_CLEAN_HEAD_REPLAY_V1.json
          if-no-files-found: warn
          retention-days: 30
