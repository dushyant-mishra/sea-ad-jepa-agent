name: TD qualification registry integration V1

on:
  push:
    branches:
      - integration/td-qualification-registry-v1-20261014
  pull_request:
    paths:
      - 'scripts/v5/td_qualification_registry_v1.py'
      - 'scripts/v5/td_execution_manifest_v1.py'
      - 'scripts/v5/td_case_bundle_v1.py'
      - 'scripts/v5/td_target_qualification_bundle_v1.py'
      - 'scripts/v5/td_downstream_certification_v1.py'
      - 'scripts/v5/td_qualification_integration_v1.py'
      - 'tests/v5/test_td_qualification_registry_v1.py'
      - 'tests/v5/test_td_execution_manifest_v1.py'
      - 'tests/v5/test_td_case_bundle_v1.py'
      - 'tests/v5/test_td_target_qualification_bundle_v1.py'
      - 'tests/v5/test_td_downstream_certification_v1.py'
      - 'tests/v5/test_td_qualification_integration_v1.py'
      - 'results/target_discovery/qualification/TD_QUALIFICATION_REGISTRY_V1.json'
      - '.github/workflows/td-qualification-registry-integration-v1.yml'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Run TD qualification integration plus inherited tournament regressions
        run: |
          python -m pytest -q \
            tests/v5/test_td_qualification_registry_v1.py \
            tests/v5/test_td_execution_manifest_v1.py \
            tests/v5/test_td_case_bundle_v1.py \
            tests/v5/test_td_target_qualification_bundle_v1.py \
            tests/v5/test_td_downstream_certification_v1.py \
            tests/v5/test_td_qualification_integration_v1.py \
            tests/v5/test_td_real_tournament_contract_v1.py \
            tests/v5/test_td_real_tournament_gates_v1.py \
            tests/v5/test_td_real_tournament_bundle_v1.py \
            tests/v5/test_td_target_tournament_routing_v4_c6.py
      - name: Authority guard
        run: |
          FILES="scripts/v5/td_qualification_registry_v1.py scripts/v5/td_execution_manifest_v1.py scripts/v5/td_case_bundle_v1.py scripts/v5/td_target_qualification_bundle_v1.py scripts/v5/td_downstream_certification_v1.py scripts/v5/td_qualification_integration_v1.py"
          ! grep -PR '(?<!NO_)TARGET_WINNER_(?!NONE)|REPRESENTATION_WINNER_(?!NONE)|REAL_TRAINING_ON|STAGE4_AUTHORIZED' $FILES 2>/dev/null
