name: JEPA lane takeover manifest audit

on:
  push:
    paths:
      - 'docs/agent/JEPA_HISTORICAL_ARCHITECTURE_DECISION_LEDGER_20261013.md'
      - 'docs/agent/JEPA_GENE_IDENTITY_RECLASSIFICATION_AUDIT_20261013.md'
      - 'docs/agent/JEPA_DOWNSTREAM_IMPLEMENTATION_READINESS_AUDIT_20261013.md'
      - 'results/target_discovery/JEPA_HISTORICAL_ARCHITECTURE_DECISION_LEDGER_20261013.json'
      - 'results/target_discovery/JEPA_DOWNSTREAM_IMPLEMENTATION_READINESS_AUDIT_20261013.json'
      - 'scripts/v5/verify_jepa_lane_takeover_manifest_v1.py'
      - 'tests/v5/test_verify_jepa_lane_takeover_manifest_v1.py'
      - '.github/workflows/jepa-lane-takeover-audit.yml'
  pull_request:
    paths:
      - 'docs/agent/JEPA_HISTORICAL_ARCHITECTURE_DECISION_LEDGER_20261013.md'
      - 'docs/agent/JEPA_GENE_IDENTITY_RECLASSIFICATION_AUDIT_20261013.md'
      - 'docs/agent/JEPA_DOWNSTREAM_IMPLEMENTATION_READINESS_AUDIT_20261013.md'
      - 'results/target_discovery/JEPA_HISTORICAL_ARCHITECTURE_DECISION_LEDGER_20261013.json'
      - 'results/target_discovery/JEPA_DOWNSTREAM_IMPLEMENTATION_READINESS_AUDIT_20261013.json'
      - 'scripts/v5/verify_jepa_lane_takeover_manifest_v1.py'
      - 'tests/v5/test_verify_jepa_lane_takeover_manifest_v1.py'
      - '.github/workflows/jepa-lane-takeover-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  takeover-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator and tests
        run: |
          python -m py_compile \
            scripts/v5/verify_jepa_lane_takeover_manifest_v1.py \
            tests/v5/test_verify_jepa_lane_takeover_manifest_v1.py
      - name: Validate frozen manifests
        run: |
          python scripts/v5/verify_jepa_lane_takeover_manifest_v1.py | tee /tmp/takeover_manifest.txt
          grep -q 'PASS_JEPA_LANE_TAKEOVER_MANIFEST_V1' /tmp/takeover_manifest.txt
      - name: Run hostile manifest mutations
        run: |
          python -m unittest tests.v5.test_verify_jepa_lane_takeover_manifest_v1 -v 2>&1 | tee /tmp/takeover_tests.txt
          grep -q '^Ran 10 tests' /tmp/takeover_tests.txt
          grep -q '^OK$' /tmp/takeover_tests.txt
      - name: Assert no authority language drift in machine manifests
        run: |
          python - <<'PY'
          import json, pathlib
          paths = [
              pathlib.Path('results/target_discovery/JEPA_HISTORICAL_ARCHITECTURE_DECISION_LEDGER_20261013.json'),
              pathlib.Path('results/target_discovery/JEPA_DOWNSTREAM_IMPLEMENTATION_READINESS_AUDIT_20261013.json'),
          ]
          for path in paths:
              value=json.loads(path.read_text())
              auth=value['authority']
              assert auth['target_selection_authorized'] is False
              assert auth['td60_authorized'] is False
              assert auth['stage4_authorized'] is False
              assert auth['multimodal_training_authorized'] is False
              assert auth['training_authorized'] is False
          print('NO_DOWNSTREAM_AUTHORITY_GRANTED')
          PY
