name: V5 journal v2 cache timing, live-writer recovery and damaged-history failures (Macha, NO TRAINING)
on:
  pull_request:
    paths:
      - scripts/v5/jepa_synth2048_attempt_journal_v2.py
      - scripts/v5/measure_attempt_journal_v2_io_no_training.py
      - tests/test_jepa_synth2048_attempt_journal_v2*.py
      - .github/workflows/jepa-v5-journal-v2-io-cache-liveness-macha-no-training.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fake-bytes-cache-liveness-damage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.9", "3.12.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Macha #574 RED and controls (synthetic bytes, no optimizer)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_jepa_synth2048_attempt_journal_v2_io_cache_macha_red.py \
            tests/test_jepa_synth2048_attempt_journal_v2_io_cache_macha_controls.py
      - name: Every earlier V2 journal suite (Sol #570/#573/#574, Macha #572)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_jepa_synth2048_attempt_journal_v2.py \
            tests/test_jepa_synth2048_attempt_journal_v2_macha_red.py \
            tests/test_jepa_synth2048_attempt_journal_v2_macha_controls.py \
            tests/test_jepa_synth2048_attempt_journal_v2_fork_writer_sol_red.py \
            tests/test_jepa_synth2048_attempt_journal_v2_incremental_io_sol_red.py
      - name: I/O budget smoke (1 KiB fake states, 40 updates)
        env:
          PYTHONPATH: .
        run: python scripts/v5/measure_attempt_journal_v2_io_no_training.py ci "$RUNNER_TEMP/io" 1024 40
