name: V43 complementary teacher/student design contract (non-authorizing)
on:
  pull_request:
    paths:
      - 'docs/agent/JEPA_V43_*'
      - 'scripts/agent/verify_v43_teacher_team_research_contract.py'
      - 'scripts/agent/v43_support_aware_teacher_fusion_research.py'
      - 'scripts/agent/v43_original_84_cell_support_preflight_research.py'
      - 'tests/test_v43_*.py'
      - '.github/workflows/v43-complementary-teacher-team-design-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nonauthorizing-design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact frozen-negative-space research contract
        run: |
          set -euo pipefail
          python scripts/agent/verify_v43_teacher_team_research_contract.py | tee /tmp/v43_design.log
          grep -q 'V43_EXACT_THREE_ARMS_AND_15_MANDATORY_CONTROLS' /tmp/v43_design.log
          grep -q 'V43_ALL_UNAPPROVED_PARAMETERS_UNSET_AND_ALL_AUTHORITIES_FALSE' /tmp/v43_design.log
          grep -q 'V43_HISTORICAL_NEGATIVE_RESULTS_AND_PROVENANCE_PRESERVED' /tmp/v43_design.log
          grep -q 'V43_EXACT_GITHUB_SCRIPT_AND_RECEIPT_84_ORIGINAL_LOCAL_REPLAY_TWO_NEGATIVE_CONTROLS' /tmp/v43_design.log
      - name: Hostile mutations and planted scientific failure-mode fixtures
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_v43_*.py' -v 2>&1 | tee /tmp/v43_tests.log
          grep -q '^Ran 60 tests' /tmp/v43_tests.log
          grep -q '^OK$' /tmp/v43_tests.log
          if grep -q 'skipped=' /tmp/v43_tests.log; then echo 'V43_TEST_SKIPPED_FAIL_CLOSED'; exit 1; fi
          echo V43_60_DESIGN_AND_FUSION_SYNTHETIC_TESTS_NO_SKIPS_RESEARCH_ONLY
