name: td-relational-synthetic-v2-1-ci

on:
  push:
    branches:
      - synthetic/td-relational-test-package-v2-1-20261013
  pull_request:
    paths:
      - 'scripts/v79/build_td_relational_synthetic_package_v2_1.py'
      - 'scripts/v79/finalize_td_relational_synthetic_package_v2_1.py'
      - 'scripts/v79/finalize_td_relational_synthetic_package_v2_1_1.py'
      - 'tests/v79/test_build_td_relational_synthetic_package_v2_1.py'
      - 'tests/v79/test_finalize_td_relational_synthetic_package_v2_1_1.py'
      - 'docs/agent/TD_RELATIONAL_SYNTHETIC_V2_1_EXTERNAL_AUDIT_REPAIR_20261013.md'
      - '.github/workflows/td-relational-synthetic-v2-1-ci.yml'

jobs:
  focused-v2-1-construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest numpy
      - name: Verify exact clean synthetic head
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          test -z "$(git status --short)"
      - name: Compile successor generator and finalizers
        run: python -m compileall -q scripts/v79/build_td_relational_synthetic_package_v2_1.py scripts/v79/finalize_td_relational_synthetic_package_v2_1.py scripts/v79/finalize_td_relational_synthetic_package_v2_1_1.py
      - name: Run sealed-construction and custody-identity tests
        run: python -m pytest -q tests/v79/test_build_td_relational_synthetic_package_v2_1.py tests/v79/test_finalize_td_relational_synthetic_package_v2_1_1.py
      - name: Re-run frozen V2 package tests
        run: python -m pytest -q tests/v79/test_build_td_relational_synthetic_package_v2.py tests/v79/test_finalize_td_relational_synthetic_package_v2.py
      - name: Confirm tracked worktree unchanged
        run: test -z "$(git status --short --untracked-files=no)"
