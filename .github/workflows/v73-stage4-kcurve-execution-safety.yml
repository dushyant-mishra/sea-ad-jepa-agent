name: V73 Stage4 K-curve execution safety

on:
  pull_request:
    paths:
      - 'scripts/v64/build_stage4_synthetic_worlds_v1.py'
      - 'scripts/v64/stage4_executor_v1.py'
      - 'scripts/v64/run_stage4_g2_sensitivity_curve_v1.py'
      - 'scripts/v64/verify_confound_block_geometry_v1.py'
      - 'tests/test_v73_stage4_execution_isolation.py'
      - 'results/v64/V73_*'
      - '.github/workflows/v73-stage4-kcurve-execution-safety.yml'
  workflow_dispatch:

jobs:
  execution-safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Compile repaired Stage4 synthetic execution path
        run: |
          python -m py_compile scripts/v64/build_stage4_synthetic_worlds_v1.py
          python -m py_compile scripts/v64/stage4_executor_v1.py
          python -m py_compile scripts/v64/run_stage4_g2_sensitivity_curve_v1.py
          python -m py_compile scripts/v64/verify_confound_block_geometry_v1.py
      - name: Run V73 execution-safety tests
        run: pytest -q tests/test_v73_stage4_execution_isolation.py
