name: V26 G3 objective-matched streamed attacker integration
on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/v5/g3_explicit_attacker_fit_objective_v1.py'
      - 'src/sea_ad_jepa/v5/full104_masking_streaming_executor_v1.py'
      - 'tests/test_v26_g3_explicit_attacker_fit_objective_v1.py'
      - 'tests/test_v26_g3_streaming_attacker_integration_v1.py'
      - '.github/workflows/v26-g3-streamed-attacker-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explicit-g3-ridge8-and-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numeric prerequisites
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 pytest==8.3.4
      - name: Execute independent G3 and existing original reference parity
        env:
          PYTHONPATH: src:tests:.
        run: |
          python -m pytest -q \
            tests/test_v26_g3_explicit_attacker_fit_objective_v1.py \
            tests/test_v26_g3_streaming_attacker_integration_v1.py \
            tests/test_v5_full104_masking_streaming_executor_v1.py \
            --junitxml=/tmp/g3-integrated.xml
      - name: Fail closed on any skipped or missing controls
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/g3-integrated.xml').getroot()
          suite=root if root.tag=='testsuite' else root.find('testsuite')
          if suite is None: raise SystemExit('STOP_G3_NO_JUNIT')
          count={k:int(suite.attrib.get(k,0)) for k in ('tests','skipped','failures','errors')}
          cases={x.attrib.get('name','').split('[')[0] for x in suite.iter('testcase')}
          required={
            'test_weighted_sufficient_statistics_match_independent_row_level_reference',
            'test_conflicting_source_effects_change_fit_objective_without_changing_data',
            'test_streaming_fold_matches_canonical_reference_for_all_policy_arms',
            'test_every_explicit_g3_objective_produces_separately_labeled_development_rows',
            'test_objective_is_forwarded_to_both_ridge8_partner_selection_and_primary_scoring',
            'test_unknown_fit_mode_rejected_without_starting_attacker',
            'test_legacy_default_retains_exact_historical_output_schema',
            'test_all_fold_wrapper_propagates_explicit_objective_with_no_crossfold_fallback',
          }
          if count['tests']!=50 or any(count[k] for k in ('skipped','failures','errors')) or not required<=cases:
            raise SystemExit(f'STOP_G3_STREAM_INCOMPLETE {count} missing={sorted(required-cases)}')
          print(f'PASS_G3_EXPLICIT_DEVELOPMENT_STREAM {count["tests"]} passed, zero skipped')
          PY
