name: V30 synthetic issuance-provenance red-team (non-authorizing)
on:
  pull_request:
    paths:
      - 'tests/test_v30_issuance_source_provenance.py'
      - 'docs/agent/JEPA_V30_SYNTHETIC_ISSUANCE_PROVENANCE_FINDING_20260926.md'
      - '.github/workflows/v30-issuance-provenance-redteam.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic-not-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.4
      - name: Three exact synthetic adversaries (no model, no expression)
        run: PYTHONPATH=src:. python -m pytest -q -s tests/test_v30_issuance_source_provenance.py --junitxml=/tmp/v30.xml | tee /tmp/v30.log
      - name: Require explicit positive demonstration and zero skipped tests
        run: |
          python - <<'PY'
          from xml.etree import ElementTree as ET
          d=ET.parse('/tmp/v30.xml').getroot()
          if d.tag!='testsuite': d=d.find('testsuite')
          counts={x:int(d.get(x,0)) for x in ('tests','errors','failures','skipped')}
          names={x.get('name') for x in d.iter('testcase')}
          if counts!={'tests':3,'errors':0,'failures':0,'skipped':0}:
              raise SystemExit(f'STOP_V30_MISSING_TESTS {counts}')
          if len(names)!=3: raise SystemExit('STOP_V30_TEST_IDENTITY_GAP')
          print('V30_SYNTHETIC_PROVENANCE_GAP_DIAGNOSTIC_ONLY__CURRENT_TRAINING_REMAINS_OFF')
          PY
          grep -q 'V30_FINDING_SELF_CONSISTENT_INVENTED_CLOSURE_ACCEPTED__B1_STILL_OFF' /tmp/v30.log
