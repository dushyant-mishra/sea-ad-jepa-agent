name: Macha review of #525 at 0588788f (RED-first, tests only)

on:
  pull_request:
    paths:
      - 'tests/v5/test_jepa_post_td_525_0588788f_macha_review.py'
      - '.github/workflows/macha-525-0588788f-review.yml'
      - 'scripts/v5/jepa_post_td_*.py'
  workflow_dispatch:

jobs:
  review:
    name: Python ${{ matrix.python-version }} - inherited, preserved Macha files, guards, limit and REDs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record exact source; preserved reviewer files byte-identical
        run: |
          git rev-parse HEAD
          for f in jepa_post_td_harness_contract_v1 jepa_post_td_tournament_controller_v1 jepa_post_td_presentation_ema_v1 jepa_post_td_rehearsal_preflight_v1; do
            echo "$f $(git rev-parse HEAD:scripts/v5/$f.py)"
          done
          test "$(git rev-parse HEAD:tests/v5/test_jepa_post_td_527_macha_repair_v1.py)" = 123e6c92f5dac0fb39e6d3023ec3c6093cfa56b3
          test "$(git rev-parse HEAD:tests/v5/test_jepa_post_td_530_macha_repair_v1.py)" = 577944c0d058f5eb329b21fd6e18134bed9a9ca1
      - name: Replay the unchanged #517 file (expect exactly five unexpected successes)
        run: |
          git fetch --no-tags origin +refs/pull/517/head:refs/remotes/origin/pr517
          RED517=tests/v5/test_jepa_post_td_351_chatgpt_hostile_red_20261102.py
          git show "origin/pr517:$RED517" > "$RED517"
          test "$(git hash-object "$RED517")" = 76666f3e6f320792e0b292c32411e74eafa97ca6
          set +e; python "$RED517" > red517.txt 2>&1; rc=$?; set -e
          cat red517.txt; rm "$RED517"
          test "$rc" -ne 0
          grep -q "FAILED (unexpected successes=5)" red517.txt
      - name: Inherited, #517 repair and preserved Macha #527 and #530 suites (expected green)
        run: |
          python -m unittest -v \
            tests.v5.test_jepa_post_td_harness_contract_v1 \
            tests.v5.test_jepa_post_td_c4_requires_c6_v1 \
            tests.v5.test_jepa_post_td_517_repair_v1 \
            tests.v5.test_jepa_post_td_527_macha_repair_v1 \
            tests.v5.test_jepa_post_td_530_macha_repair_v1 \
            tests.v5.test_jepa_post_td_presentation_ema_v1 \
            tests.v5.test_jepa_post_td_rehearsal_preflight_v1 \
            tests.v5.test_jepa_post_td_tournament_controller_v1
      - name: Macha guards and recorded limit (expected green)
        run: python -m unittest -v -k test_guard -k test_l06 tests.v5.test_jepa_post_td_525_0588788f_macha_review
      - name: Macha REDs M01, M02, S01 (expected to FAIL at 0588788f until repaired)
        run: python -m unittest -v tests.v5.test_jepa_post_td_525_0588788f_macha_review
