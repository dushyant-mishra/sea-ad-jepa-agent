name: TD real G7 terminal decision V3

on:
  push:
    branches:
      - implementation/td-real-g7-source-noncompensation-v3-20261014
  pull_request:
    paths:
      - 'scripts/v5/td_real_g7_terminal_decision_v3.py'
      - 'tests/v5/test_td_real_g7_terminal_decision_v3.py'
      - '.github/workflows/td-real-g7-terminal-decision-v3.yml'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - run: python -m pip install pytest==9.1.1
      - name: Run G7 V3 source noncompensation tests
        run: python -m pytest -q tests/v5/test_td_real_g7_terminal_decision_v3.py
      - name: Authority guard
        run: |
          ! grep -R "real_tournament_authorized.*True\|stage4_authorized.*True\|training_authorized.*True" scripts/v5/td_real_g7_terminal_decision_v3.py
