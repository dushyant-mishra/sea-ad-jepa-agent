name: JEPA Event90 canonical audit history/source and takeover custody (NO TRAINING)
on:
  pull_request:
    paths:
      - 'docs/agent/JEPA_20261105_EVENT90_COMPLETE_SOURCE_SCRIPT_DATA_RESULT_AND_AGENT_TAKEOVER.md'
      - 'results/target_discovery/unified_qualification_v1/JEPA_20261105_EVENT90_TWO_BRANCH_TAKEOVER_MAP.json'
      - 'results/target_discovery/unified_qualification_v1/JEPA_CONTINUOUS_CHRONOLOGY_PROGRESS_V1.json'
      - 'results/target_discovery/unified_qualification_v1/JEPA_20261104_MASTER_PRIMARY_SOURCE_NO_REPEAT_INDEX_V1.json'
      - 'scripts/v5/verify_jepa_event90_takeover_integrity_v1.py'
      - 'tests/v5/test_verify_jepa_event90_takeover_integrity_v1.py'
      - '.github/workflows/jepa-event90-audit-takeover-custody-no-training.yml'
permissions:
  contents: read
jobs:
  event90-canonical-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Read-only Event90 audit ledger, source map and no-repeat index
        run: python scripts/v5/verify_jepa_event90_takeover_integrity_v1.py --role audit
      - name: Hostile source custody and false-authority refusals
        run: python -m pytest -q tests/v5/test_verify_jepa_event90_takeover_integrity_v1.py
