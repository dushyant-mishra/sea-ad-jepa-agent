name: Materialize exact Teacher/student V5 66-pass snapshot

on:
  push:
    branches:
      - planning/teacher-student-v5-data-first-20260908
    paths:
      - '.github/workflows/materialize_teacher_student_v5_data_first_snapshot.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staged transfer and exact snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected_parts.sha256 <<'EOF'
          c64ee2e4b82849ab57a14beab848df571b9f2b5e7b1f16ab0b0c1fd1876fc34e  .v5_sync66/part000
          b41c282132bb310baada1e84ea5ca9433dd9a0d87bc085ca461b900cbd64bf15  .v5_sync66/part001
          9902590e17948e052754270a46140fb399745cce42d68349073a9406b970bb0b  .v5_sync66/part002
          d34150df8fc94f588a8bd08b5621d52082412066b8612f98e62f9aa24b76b990  .v5_sync66/part003
          4758f7a554a98a4386313aa63c047f0898818505a01f87e8aa0e97fd6f0cc4bf  .v5_sync66/part004
          a63886e158b86d1d1d240b8aa89ba02e31df7b6249c7e3bd0d1ea41fdbf0c4aa  .v5_sync66/part005
          c50edbd06bc8446d72785c86152b04238b485700abe4ae6978295af20839318d  .v5_sync66/part006
          e6978f25cecee508c98538756f07f626e9933af51a10e5f81c130431c36494a2  .v5_sync66/part007
          a52650f319c1a20f8afc92751a19da433a4d1528762410d84be8d2df6afe48f9  .v5_sync66/part008
          d0a6f8c2791cd8b20f4a10419fe2c54e3020d660e514cade5be581eb33562339  .v5_sync66/part009
          ea37c0bc055937ab419082af7a7870b0f73f0ec334e14e1a9d7c1d9eed8755e4  .v5_sync66/part010
          d067167ff84db1391da2c4c061bb142871925e264358e821587424e9a51bb2b8  .v5_sync66/part011
          3d5c3d2ec4207953ca8d4d06e6b7de6c3f434de4dc4a5a1812f059460998b30a  .v5_sync66/part012
          EOF
          sha256sum --check /tmp/expected_parts.sha256
          cat .v5_sync66/part??? | base64 --decode > /tmp/v5_snapshot.zip
          echo "39d70f235b06c1342398e318e665986c9dfa0c6e560878cd62a83ce1dadfc48d  /tmp/v5_snapshot.zip" | sha256sum --check

      - name: Validate archive closure before writing repository
        env:
          EXPECTED_ROOT: "9684f4c2b7eff1da863ae50124c6aad49d25f137a84898e05e98d2ae1f0c67ad"
        run: |
          set -euo pipefail
          rm -rf /tmp/v5_extract
          mkdir -p /tmp/v5_extract
          python - <<'PY'
          import csv, hashlib, os, pathlib, zipfile
          zpath=pathlib.Path('/tmp/v5_snapshot.zip')
          out=pathlib.Path('/tmp/v5_extract')
          expected_root=os.environ['EXPECTED_ROOT']
          with zipfile.ZipFile(zpath) as z:
              names=z.namelist()
              assert len(names)==len(set(names)), 'duplicate ZIP names'
              for n in names:
                  p=pathlib.PurePosixPath(n)
                  assert not p.is_absolute() and '..' not in p.parts, f'unsafe ZIP path {n}'
              z.extractall(out)
          manifest=out/'docs/agent/TEACHER_STUDENT_V5_DATA_FIRST_PROTOTYPE_MANIFEST.csv'
          rootfile=out/'docs/agent/TEACHER_STUDENT_V5_DATA_FIRST_PROTOTYPE_ROOT.txt'
          observed=hashlib.sha256(manifest.read_bytes()).hexdigest()
          assert observed==expected_root,(observed,expected_root)
          assert rootfile.read_text().strip()==expected_root
          rows=list(csv.DictReader(manifest.open(newline='')))
          assert len(rows)==53,len(rows)
          expected_paths=set()
          for row in rows:
              rel=row['path']
              expected_paths.add(rel)
              p=out/rel
              assert p.is_file(),rel
              b=p.read_bytes()
              assert len(b)==int(row['bytes']),(rel,len(b),row['bytes'])
              assert hashlib.sha256(b).hexdigest()==row['sha256'],rel
          extras=set()
          for p in out.rglob('*'):
              if p.is_file():
                  rel=p.relative_to(out).as_posix()
                  if rel not in expected_paths and rel not in {
                      'docs/agent/TEACHER_STUDENT_V5_DATA_FIRST_PROTOTYPE_MANIFEST.csv',
                      'docs/agent/TEACHER_STUDENT_V5_DATA_FIRST_PROTOTYPE_ROOT.txt',
                  }:
                      extras.add(rel)
          assert not extras,extras
          assert len([p for p in out.rglob('*') if p.is_file()])==55
          print(f'PASS_SNAPSHOT_CLOSURE rows={len(rows)} root={expected_root}')
          PY

      - name: Materialize exact snapshot and remove superseded planning bytes
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/v5_extract/. .
          rm -f tests/test_teacher_student_v5_support_geometry_v1.py src/sea_ad_jepa/v5/keyed_rng_reference.py src/sea_ad_jepa/v5/keyed_dropout_prototype.py tests/test_teacher_student_v5_keyed_packing_v1.py tests/test_teacher_student_v5_optimizer_boundary_v1.py tests/test_teacher_student_v5_rng_and_triplets.py tests/test_teacher_student_v5_keyed_training_boundary_v1.py tests/test_teacher_student_v5_rng_triplets_estimand_v1.py
          rm -rf .v5_sync66
          rm -f .github/workflows/materialize_teacher_student_v5_data_first_snapshot.yml

      - name: Commit exact materialized snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "STOP_NO_MATERIALIZATION_DIFF"; exit 1; }
          git commit -m "teacher-student v5: materialize exact 66-pass data-first snapshot"
          git push origin HEAD:planning/teacher-student-v5-data-first-20260908

# retrigger after verified 12000-byte part001 repair
