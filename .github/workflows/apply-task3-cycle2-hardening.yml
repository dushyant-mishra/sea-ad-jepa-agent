name: Apply Task 3 cycle2 hardening

permissions:
  contents: write

on:
  push:
    branches:
      - 'work/unified-task3-registry-impl-20261015'
    paths:
      - 'scripts/v5/td_unified/apply_task3_cycle2_hardening.py'
      - 'tests/v5/td_unified/test_registry_v1_hostile_cycle2.py'
      - 'tests/v5/td_unified/registry_v1_dependency_fixtures.py'
      - '.github/workflows/apply-task3-cycle2-hardening.yml'

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1 numpy==1.26.4
      - name: Apply deterministic cycle2 hardening
        run: python scripts/v5/td_unified/apply_task3_cycle2_hardening.py
      - name: Verify Task 3 focused and hostile cycles
        run: >-
          python -m pytest -q
          tests/v5/td_unified/test_registry_v1.py
          tests/v5/td_unified/test_registry_v1_self_audit1.py
          tests/v5/td_unified/test_registry_v1_self_audit2.py
          tests/v5/td_unified/test_registry_v1_hostile_cycle1.py
          tests/v5/td_unified/test_registry_v1_hostile_cycle2.py
      - name: Verify complete unified regression
        run: python -m pytest -q tests/v5/td_unified
      - name: Commit cycle2 repaired source and fixtures
        run: |
          if git diff --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v5/td_unified/registry_v1.py \
            tests/v5/td_unified/test_registry_v1.py \
            tests/v5/td_unified/test_registry_v1_self_audit1.py \
            tests/v5/td_unified/test_registry_v1_self_audit2.py
          git commit -m 'task3 GREEN2: bind dependencies and promotion provenance to resolved objects'
          git push origin HEAD:work/unified-task3-registry-impl-20261015
