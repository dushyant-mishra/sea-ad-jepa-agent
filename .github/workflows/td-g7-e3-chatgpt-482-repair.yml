name: ChatGPT G7 #476 metaclass + bind-snapshot-V3 repair (NO AUTHORITY)
on:
  pull_request:
    paths:
      - 'scripts/v5/td_real_g7_content_enforcement_v1.py'
      - 'tests/v5/test_td_real_g7_content_enforcement_v1_macha_476_red.py'
      - 'tests/v5/test_td_real_g7_content_enforcement_v1_chatgpt_482_repair.py'
      - '.github/workflows/td-g7-e3-chatgpt-482-repair.yml'
permissions:
  contents: read
jobs:
  repair:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: bash
        run: python -m pip install pytest==9.1.1 numpy==1.26.4
      - name: Immutable Macha #482 metaclass and composition review
        shell: bash
        run: python -m pytest -q -rA tests/v5/test_td_real_g7_content_enforcement_v1_macha_476_red.py
      - name: ChatGPT composed-path repair guards
        shell: bash
        run: python -m pytest -q -rA tests/v5/test_td_real_g7_content_enforcement_v1_chatgpt_482_repair.py
