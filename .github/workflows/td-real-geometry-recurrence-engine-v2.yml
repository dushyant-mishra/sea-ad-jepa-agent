name: TD real geometry recurrence engine V2

on:
  push:
    branches:
      - fix/td-real-geometry-producer-guard-v2-20261014
  pull_request:
    paths:
      - 'scripts/v5/td_real_geometry_recurrence_engine_v1.py'
      - 'scripts/v5/td_real_geometry_recurrence_engine_v2.py'
      - 'tests/v5/test_td_real_geometry_recurrence_engine_v1.py'
      - 'tests/v5/test_td_real_geometry_recurrence_engine_v1_hostile.py'
      - 'tests/v5/test_td_real_geometry_recurrence_engine_v2.py'
      - '.github/workflows/td-real-geometry-recurrence-engine-v2.yml'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1 numpy==2.4.6
      - name: Run inherited geometry V1 plus V2 hostile repair tests
        run: python -m pytest -q tests/v5/test_td_real_geometry_recurrence_engine_v1.py tests/v5/test_td_real_geometry_recurrence_engine_v1_hostile.py tests/v5/test_td_real_geometry_recurrence_engine_v2.py
      - name: Authority guard
        run: |
          ! grep -R "REAL_TRAINING_ON\|STAGE4_AUTHORIZED\|TARGET_WINNER_" scripts/v5/td_real_geometry_recurrence_engine_v2.py 2>/dev/null
