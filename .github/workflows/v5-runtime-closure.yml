name: V5 runtime closure

on:
  push:
    branches:
      - impl/v5-remaining-rna-target-semantics-20260917
  pull_request:
    paths:
      - 'src/sea_ad_jepa/v5/**'
      - 'tests/test_v5_current_runtime_source_authority_v1.py'
      - 'tests/test_v5_model_geometry_authority_v2.py'
      - 'tests/test_v5_geometry_memorization_qualification_authority_v1.py'
      - 'tests/test_v5_ema_timescale_authority_v2.py'
      - 'tests/test_v5_measurement_robustness_authority_v2.py'
      - '.github/workflows/v5-runtime-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run runtime authority regressions
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q -p no:randomly --strict-markers \
            tests/test_v5_current_runtime_source_authority_v1.py \
            tests/test_v5_model_geometry_authority_v2.py \
            tests/test_v5_geometry_memorization_qualification_authority_v1.py \
            tests/test_v5_ema_timescale_authority_v2.py \
            tests/test_v5_measurement_robustness_authority_v2.py
      - name: Fail closed on skips
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q \
            tests/test_v5_current_runtime_source_authority_v1.py \
            tests/test_v5_model_geometry_authority_v2.py \
            tests/test_v5_geometry_memorization_qualification_authority_v1.py \
            tests/test_v5_ema_timescale_authority_v2.py \
            tests/test_v5_measurement_robustness_authority_v2.py \
            -rs --tb=short | tee /tmp/runtime-v5.txt
          if grep -qiE '^SKIPPED|[0-9]+ skipped' /tmp/runtime-v5.txt; then echo 'RUNTIME V5 TESTS SKIPPED - FAIL CLOSED'; exit 1; fi
