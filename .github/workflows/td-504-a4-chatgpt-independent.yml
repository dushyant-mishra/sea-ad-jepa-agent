name: TD #504 A4 independent ChatGPT hostile review (NO SOURCE AUTHORITY)
on:
  pull_request:
    paths:
      - 'tests/v5/td_unified/test_q_excluded_depth_a4_chatgpt504_independent.py'
      - '.github/workflows/td-504-a4-chatgpt-independent.yml'
      - 'scripts/v5/td_unified/q_excluded_depth_v1.py'
permissions:
  contents: read
jobs:
  independent-a4:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        numpy: ['1.26.4','2.2.6']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install pytest==9.1.1 numpy==${{ matrix.numpy }}
      - name: Independent whole-refusal and declared-domain hostile cases
        run: python -m pytest -q -rA tests/v5/td_unified/test_q_excluded_depth_a4_chatgpt504_independent.py
      - name: Immutable Macha author A4 laws and self-audit
        run: python -m pytest -q tests/v5/td_unified/test_q_excluded_depth_v1_a4_repair.py
      - name: Inherited original #474 producer laws
        run: python -m pytest -q tests/v5/td_unified/test_q_excluded_depth_v1.py
