permissions:
  contents: read

jobs:
  full104-masking-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy scipy scikit-learn
      - name: Run FULL104 masking authority regressions
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q -p no:randomly --strict-markers \
            tests/test_v5_masking_qualification_run_contract_v1.py \
            tests/test_v5_masking_qualification_run_contract_v2.py \
            tests/test_v5_full104_masking_qualification_runner_v1.py \
            tests/test_v5_full104_masking_streaming_executor_v1.py \
            tests/test_v5_full104_streaming_executor_accepts_budget_v2.py \
            tests/test_v5_full104_masking_anti_spillover_v1.py \
            tests/test_v5_full104_census_receipt_v2.py \
            tests/test_v5_full104_control_calibration_cache_v1.py \
            tests/test_v5_full104_control_calibration_cache_evaluator_v1.py \
            tests/test_v5_masking_qualification_parameters_authority_v2.py \
            tests/test_v5_masking_burden_ladder_authority_v2.py \
            tests/test_v5_precision_authority_v2.py \
            tests/test_v5_masking_qualification_decision_v1.py \
            tests/test_v5_masking_qualification_decision_v2.py \
            tests/test_v5_masking_qualification_execution_authority_v4.py \
            tests/test_v5_masking_donor_evidence_v1.py \
            tests/test_v5_masking_control_executor_v1.py \
            tests/test_v5_masking_nonlinear_challenge_authority_v1.py \
            tests/test_v5_masking_nonlinear_challenge_authority_v2.py \
            tests/test_v5_masking_nonlinear_challenge_executor_v1.py \
            tests/test_v5_target_panel_selector_v2.py \
            tests/test_v5_masking_rng_replay_authority_v2.py \
            tests/test_v5_target_panel_sizing_and_precision_v3.py \
            tests/test_v5_target_panel_authority_v2.py \
            tests/test_v5_target_panel_authority_builder_v3.py \
            tests/test_v5_control_calibration_precision_authority_v1.py \
            tests/test_v5_control_calibration_interval_receipt_v1.py \
            tests/test_v5_control_capacity_calibration_receipt_v1.py \
            tests/test_v5_full104_masking_anti_spillover_v2.py \
            tests/test_v5_control_calibrated_panel_and_nonlinear_v1.py \
            tests/test_v5_nonlinear_capacity_model_and_calibration_v2.py \
            tests/test_v5_full104_nonlinear_capacity_cache_evaluator_v1.py \
            tests/test_v5_outer_split_and_precision_builders_current.py \
            tests/test_v5_masking_qualification_run_contract_v4.py
      - name: Fail closed on skips
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q \
            tests/test_v5_masking_qualification_run_contract_v1.py \
            tests/test_v5_masking_qualification_run_contract_v2.py \
            tests/test_v5_full104_masking_qualification_runner_v1.py \
            tests/test_v5_full104_masking_streaming_executor_v1.py \
            tests/test_v5_full104_streaming_executor_accepts_budget_v2.py \
            tests/test_v5_full104_masking_anti_spillover_v1.py \
            tests/test_v5_full104_census_receipt_v2.py \
            tests/test_v5_full104_control_calibration_cache_v1.py \
            tests/test_v5_full104_control_calibration_cache_evaluator_v1.py \
            tests/test_v5_masking_qualification_parameters_authority_v2.py \
            tests/test_v5_masking_burden_ladder_authority_v2.py \
            tests/test_v5_precision_authority_v2.py \
            tests/test_v5_masking_qualification_decision_v1.py \
            tests/test_v5_masking_qualification_decision_v2.py \
            tests/test_v5_masking_qualification_execution_authority_v4.py \
            tests/test_v5_masking_donor_evidence_v1.py \
            tests/test_v5_masking_control_executor_v1.py \
            tests/test_v5_masking_nonlinear_challenge_authority_v1.py \
            tests/test_v5_masking_nonlinear_challenge_authority_v2.py \
            tests/test_v5_masking_nonlinear_challenge_executor_v1.py \
            tests/test_v5_target_panel_selector_v2.py \
            tests/test_v5_masking_rng_replay_authority_v2.py \
            tests/test_v5_target_panel_sizing_and_precision_v3.py \
            tests/test_v5_target_panel_authority_v2.py \
            tests/test_v5_target_panel_authority_builder_v3.py \
            tests/test_v5_control_calibration_precision_authority_v1.py \
            tests/test_v5_control_calibration_interval_receipt_v1.py \
            tests/test_v5_control_capacity_calibration_receipt_v1.py \
            tests/test_v5_full104_masking_anti_spillover_v2.py \
            tests/test_v5_control_calibrated_panel_and_nonlinear_v1.py \
            tests/test_v5_nonlinear_capacity_model_and_calibration_v2.py \
            tests/test_v5_full104_nonlinear_capacity_cache_evaluator_v1.py \
            tests/test_v5_outer_split_and_precision_builders_current.py \
            tests/test_v5_masking_qualification_run_contract_v4.py \
            -rs --tb=short | tee /tmp/full104-mask-runner.txt
          if grep -qiE '^SKIPPED|[0-9]+ skipped' /tmp/full104-mask-runner.txt; then echo 'FULL104 MASK RUNNER TESTS SKIPPED - FAIL CLOSED'; exit 1; fi
