name: V79 V2_CORE contract launch authority

# Byte-for-byte contract regeneration and launch-authority semantics, in the locked V79 Bayesian environment
# (results/v79/v2_core_qualification/inputs/V79_BAYES_ENV_PIP_FREEZE.txt): Windows, Python 3.11.17, numpy 2.0.2,
# scipy 1.17.1. The contract embeds SciPy-derived numbers. On Linux, the same pinned versions give a reported power
# (worlds.gene_count_derivation.power) that differs in the last binary digit: 0.8003456396475286 against
# 0.8003456396475284. Every accepted quantity (G, t_critical, alpha, gates) is identical. The diagnosis was run
# in a python:3.11 container on the same machine, so the difference is the platform build, not the CPU. Byte-for-byte
# regeneration is therefore checked on the locked platform. core.autocrlf is disabled so checked-out bytes are exact.

on:
  pull_request:
    paths:
      - 'scripts/v79/build_v79_v2_core_contract.py'
      - 'scripts/v79/v79_v2_core_launch.py'
      - 'tests/v79/test_v79_v2_core_launch_authority.py'
      - 'results/v79/v2_core_qualification/**'
      - 'results/v79/development/s174_structure_replay_v4_masked/**'
      - 'results/v79/development/v2_core_planting_calibration/**'
      - '.github/workflows/v79-v2-core-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-authority:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Exact bytes on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - run: python -m pip install --disable-pip-version-check numpy==2.0.2 scipy==1.17.1 pytest
      - name: Launch-authority and byte-for-byte contract tests
        shell: bash
        run: |
          set -o pipefail
          python --version
          python -m pytest tests/v79/test_v79_v2_core_launch_authority.py -q -rA -p no:cacheprovider | tee v79_contract_authority.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v79-contract-authority-log
          path: v79_contract_authority.log
