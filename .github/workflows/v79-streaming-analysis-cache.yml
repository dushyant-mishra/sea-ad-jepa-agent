name: V79 streaming analysis cache

on:
  pull_request:
    paths:
      - 'scripts/v79/build_v79_analysis_cache.py'
      - 'scripts/v79/v79_data.py'
      - 'scripts/v79/v79_firewall.py'
      - 'scripts/v79/run_v79_scheduler.py'
      - 'tests/v79/test_v79_analysis_cache.py'
      - 'tests/v79/test_v79_scheduler_resource_defaults.py'
      - '.github/workflows/v79-streaming-analysis-cache.yml'

jobs:
  cache-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy pytest
      - run: python -m pytest tests/v79/test_v79_analysis_cache.py tests/v79/test_v79_scheduler_resource_defaults.py -q
