name: V5 structured CPU checkpoint to synthetic journal (NO OPTIMIZER)
on:
  pull_request:
    paths:
      - 'scripts/v5/jepa_v5_structured_journal_preflight_v1.py'
      - 'scripts/v5/jepa_v5_full_state_readonly_audit_v1.py'
      - 'tests/test_jepa_v5_structured_journal_preflight_v1.py'
      - 'tests/test_jepa_v5_full_state_readonly_audit_v1.py'
      - 'docs/agent/JEPA_20261105_V5_STRUCTURED_SNAPSHOT_TO_JOURNAL_PRECHECK_NO_TRAINING.md'
      - '.github/workflows/jepa-v5-structured-synthetic-checkpoint-journal-no-training.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-only-structural-adam-and-fake-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.9", "3.12.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Minimal pytest and CPU torch (no training/GPU)
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.2
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Structural model/Adam/EMA/rights binding before fake journal writes
        env:
          PYTHONPATH: .
          CUDA_VISIBLE_DEVICES: ""
        run: |
          python -m pytest -q \
            tests/test_jepa_v5_structured_journal_preflight_v1.py \
            tests/test_jepa_v5_full_state_readonly_audit_v1.py
      - name: Explicit zero-training authority check
        env:
          PYTHONPATH: .
          CUDA_VISIBLE_DEVICES: ""
        run: |
          python - <<'PY'
          from scripts.v5 import jepa_v5_structured_journal_preflight_v1 as bridge
          from scripts.v5 import jepa_synth2048_attempt_journal_v2 as journal
          assert bridge.AUTHORITY == "TARGET_WINNER_NONE__REPRESENTATION_WINNER_NONE__REAL_TRAINING_OFF__STAGE4_NOT_AUTHORIZED"
          assert journal.AUTHORITY == bridge.AUTHORITY
          assert not hasattr(bridge, "optimizer_step")
          assert not hasattr(bridge, "restore_model")
          print("STRUCTURAL_CPU_SYNTHETIC_COMPONENTS_AND_REPORTED_PROBE_ONLY__NO_TRAINING")
          PY
