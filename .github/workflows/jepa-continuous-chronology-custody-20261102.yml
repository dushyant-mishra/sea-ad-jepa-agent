name: JEPA continuous chronology and implementation custody (no promotion)
on:
  pull_request:
    paths:
      - 'docs/agent/JEPA_HISTORICAL_CHRONOLOGY_SOURCE_RECOVERY_20261102.md'
      - 'docs/agent/JEPA_HISTORICAL_CHRONOLOGY_RECOVERY_ROUNDS_17_20_20261102.md'
      - 'docs/agent/JEPA_HISTORICAL_CHRONOLOGY_RECOVERY_ROUNDS_21_24_20261102.md'
      - 'docs/agent/JEPA_CONTINUOUS_CHRONOLOGY_AND_IMPLEMENTATION_CUSTODY_20261102.md'
      - 'results/target_discovery/unified_qualification_v1/JEPA_HISTORICAL_CHRONOLOGY_SOURCE_RECOVERY_20261102.json'
      - 'results/target_discovery/unified_qualification_v1/JEPA_CONTINUOUS_CHRONOLOGY_PROGRESS_V1.json'
      - 'scripts/v5/verify_jepa_continuous_chronology_20261102.py'
      - 'tests/v5/test_verify_jepa_continuous_chronology_20261102.py'
      - '.github/workflows/jepa-continuous-chronology-custody-20261102.yml'
permissions:
  contents: read
jobs:
  audit-history-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - name: Verify preserved chronology, progress events and nonpromotion
        run: python scripts/v5/verify_jepa_continuous_chronology_20261102.py
      - name: Hostile negative tests for false history and authority
        run: python -m pytest -q tests/v5/test_verify_jepa_continuous_chronology_20261102.py
