name: V5 authority evidence integration

on:
  push:
    branches:
      - repair/v5-authority-evidence-integration-20260912
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-evidence-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest numpy scipy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run V5 integration regression suite
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q \
            tests/test_bind_full104_expression_blocks_v4.py \
            tests/test_materialize_full_population_schedule_v4.py \
            tests/test_v5_full_population_proposal_weight_restart_v1.py \
            tests/test_v5_qualified_target_optimizer_guard_v1.py \
            tests/test_same_cell_technical_intervention_probe_v1.py \
            tests/test_rejection_gate_power_calibration_v3.py \
            tests/test_postqualification_dependency_guard_v2.py \
            tests/test_qualification_phase_contract_v3.py \
            tests/test_preexecution_dependency_guard_v1.py \
            tests/test_preexecution_qualification_bundle_v2.py \
            tests/test_dimension_execution_firewall_v1.py \
            tests/test_dimension_metric_artifact_v1.py \
            tests/test_validate_base_learning_step_qualification_v1.py \
            tests/test_validate_full104_execution_plan_v1.py
      - name: Run new reconciliation regressions when present
        env:
          PYTHONPATH: src:.
        run: |
          shopt -s nullglob
          tests=(tests/test_v5_reconcile_*.py)
          if (( ${#tests[@]} )); then
            python -m pytest -q "${tests[@]}"
          else
            echo "No reconciliation regression tests yet"
          fi
      - name: Compile V5 authority sources
        env:
          PYTHONPATH: src:.
        run: |
          python -m py_compile \
            scripts/v5_anticheat/bind_full104_expression_blocks_v4.py \
            scripts/v5_anticheat/derive_full_population_schedule_optimum_v3.py \
            scripts/v5_anticheat/materialize_full_population_schedule_v4.py \
            scripts/v5_anticheat/audit_full_population_proposal_weight_restart_v1.py \
            src/sea_ad_jepa/v5/full104_metadata_authority_v1.py \
            src/sea_ad_jepa/v5/atomic_checkpoint_guard_v3.py \
            src/sea_ad_jepa/v5/qualified_teacher_student_runtime_v1.py \
            src/sea_ad_jepa/v5/qualified_optimizer_guard_v1.py \
            src/sea_ad_jepa/v5/rejection_gate_power_calibration_v3.py \
            src/sea_ad_jepa/v5/postqualification_dependency_guard_v2.py \
            src/sea_ad_jepa/v5/qualification_phase_contract_v3.py
