name: V73 synthetic stress twin

on:
  pull_request:
    paths:
      - 'results/v64/V73_SYNTHETIC_STRESS_TWIN_CONTRACT_V1.json'
      - 'scripts/v64/build_v73_sharded_master_truth.py'
      - 'scripts/v64/build_v73_full104_sharded_observer.py'
      - 'scripts/v64/estimate_v73_synthetic_stress_resources.py'
      - 'tests/test_v73_synthetic_stress_twin.py'
      - '.github/workflows/v73-synthetic-stress-twin.yml'
  workflow_dispatch:

jobs:
  stress-twin-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Compile stress-twin producers
        run: |
          python -m py_compile scripts/v64/build_v73_sharded_master_truth.py
          python -m py_compile scripts/v64/build_v73_full104_sharded_observer.py
          python -m py_compile scripts/v64/estimate_v73_synthetic_stress_resources.py
      - name: Run shard-invariance and resource tests
        run: pytest -q tests/test_v73_synthetic_stress_twin.py
      - name: Build a 2000-cell sharded smoke twin
        run: |
          rm -rf /tmp/v73_stress_smoke
          python scripts/v64/build_v73_sharded_master_truth.py --root /tmp/v73_stress_smoke --cells 2000 --shard-size 333 --seed 7302
          python scripts/v64/build_v73_full104_sharded_observer.py --root /tmp/v73_stress_smoke --seed 7302
          python scripts/v64/estimate_v73_synthetic_stress_resources.py --cells 100000 --shard-size 10000 --measure-root /tmp/v73_stress_smoke --out /tmp/v73_resource.json
