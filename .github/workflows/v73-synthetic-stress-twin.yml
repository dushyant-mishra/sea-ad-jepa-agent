name: V73 synthetic stress twin

on:
  pull_request:
    paths:
      - 'results/v64/V73_SYNTHETIC_STRESS_TWIN_CONTRACT_V1.json'
      - 'results/v64/V73_SYNTHETIC_STRESS_TWIN_CONTRACT_AMENDMENT_1_SOURCE_COMPOSITION.json'
      - 'results/v64/V73_FULL104_EMPIRICAL_CALIBRATION_CONTRACT_V1.json'
      - 'results/v64/V73_FULL104_EMPIRICAL_CALIBRATION_CONTRACT_AMENDMENT_1_SAMPLED_QC.json'
      - 'results/v64/V73_FULL104_POPULATION_GEOMETRY_AUTHORITY_V1.json'
      - 'results/v64/calibration/V73_FULL104_POPULATION_TRIPLETS.part*.txt'
      - 'scripts/v64/v73_full104_population_geometry.py'
      - 'scripts/v64/build_v73_sharded_master_truth.py'
      - 'scripts/v64/build_v73_full104_sharded_observer.py'
      - 'scripts/v64/build_v73_paired_multiome_sharded_observer.py'
      - 'scripts/v64/build_v73_synthetic_fragments.py'
      - 'scripts/v64/estimate_v73_synthetic_stress_resources.py'
      - 'scripts/v64/build_v73_full104_empirical_calibration_authority.py'
      - 'scripts/v64/validate_v73_real_vs_synthetic_calibration.py'
      - 'scripts/v64/validate_v73_stress_promotion_readiness.py'
      - 'tests/test_v73_synthetic_stress_twin.py'
      - 'tests/test_v73_full104_empirical_calibration.py'
      - 'tests/test_v73_real_vs_synthetic_calibration.py'
      - 'tests/test_v73_stress_promotion_readiness.py'
      - '.github/workflows/v73-synthetic-stress-twin.yml'
  workflow_dispatch:

jobs:
  stress-twin-ci:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Compile producers and calibration tools
        run: |
          python -m py_compile scripts/v64/v73_full104_population_geometry.py
          python -m py_compile scripts/v64/build_v73_sharded_master_truth.py
          python -m py_compile scripts/v64/build_v73_full104_sharded_observer.py
          python -m py_compile scripts/v64/build_v73_paired_multiome_sharded_observer.py
          python -m py_compile scripts/v64/build_v73_synthetic_fragments.py
          python -m py_compile scripts/v64/estimate_v73_synthetic_stress_resources.py
          python -m py_compile scripts/v64/build_v73_full104_empirical_calibration_authority.py
          python -m py_compile scripts/v64/validate_v73_real_vs_synthetic_calibration.py
          python -m py_compile scripts/v64/validate_v73_stress_promotion_readiness.py
      - name: Run shard-invariance, empirical-calibration and fail-closed tests
        run: |
          pytest -q tests/test_v73_synthetic_stress_twin.py
          pytest -q tests/test_v73_full104_empirical_calibration.py
          pytest -q tests/test_v73_real_vs_synthetic_calibration.py
          pytest -q tests/test_v73_stress_promotion_readiness.py
      - name: Build 2000-cell coupled smoke and prove population qualified but 100K QC-blocked
        run: |
          rm -rf /tmp/v73_stress_smoke
          python scripts/v64/build_v73_sharded_master_truth.py --root /tmp/v73_stress_smoke --cells 2000 --shard-size 333 --seed 7302
          python scripts/v64/build_v73_full104_sharded_observer.py --root /tmp/v73_stress_smoke --seed 7302
          python scripts/v64/build_v73_paired_multiome_sharded_observer.py --root /tmp/v73_stress_smoke --seed 7302
          python scripts/v64/build_v73_synthetic_fragments.py --root /tmp/v73_stress_smoke
          python scripts/v64/estimate_v73_synthetic_stress_resources.py --cells 100000 --shard-size 10000 --measure-root /tmp/v73_stress_smoke --out /tmp/v73_resource.json
          set +e
          python scripts/v64/validate_v73_stress_promotion_readiness.py --root /tmp/v73_stress_smoke --resource-receipt /tmp/v73_resource.json --out /tmp/v73_readiness.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          x=json.load(open('/tmp/v73_readiness.json'))
          assert x['status']=='BLOCKED'
          assert 'FULL104_EMPIRICAL_CALIBRATION_AUTHORITY_MISSING' in x['blockers']
          assert 'DONOR_STRUCTURE_NOT_QUALIFIED' not in x['blockers']
          assert 'SOURCE_OPERATOR_STRUCTURE_NOT_QUALIFIED' not in x['blockers']
          assert x['checks']['donor_structure_qualified']
          assert x['checks']['operator_structure_qualified']
          print(json.dumps(x, indent=2))
          PY
