name: JEPA current lane custody 20261014

on:
  push:
    branches:
      - science/jepa-robust-pipeline-post-jepa-anything-audit-20261013
  pull_request:
    paths:
      - 'docs/agent/JEPA_LANE_SUCCESSOR_AUDIT_UPDATE_20261014.md'
      - 'docs/agent/TD_REAL_BLOCKED_GATE_HISTORY_CROSSCHECK_20261014.md'
      - 'docs/agent/TD_REAL_RELATIONAL_HISTORY_CROSSCHECK_20261014.md'
      - 'results/target_discovery/JEPA_LANE_CURRENT_CUSTODY_STATE_20261014.json'
      - 'scripts/v5/td_real_measurement_reference_v1.py'
      - 'scripts/v5/td_real_teacher_information_probe_v1.py'
      - 'scripts/v5/td_real_evidence_ladder_contract_v1.py'
      - 'scripts/v5/td_real_relational_manifest_v1.py'
      - 'tests/v5/test_td_real_measurement_reference_v1.py'
      - 'tests/v5/test_td_real_teacher_information_probe_v1.py'
      - 'tests/v5/test_td_real_evidence_ladder_contract_v1.py'
      - 'tests/v5/test_td_real_relational_manifest_v1.py'
      - '.github/workflows/jepa-current-lane-custody-20261014.yml'

jobs:
  custody:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: scripts/v5:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - run: python -m pip install pytest==9.1.1 numpy==2.4.6
      - name: Validate machine custody JSON
        run: python -m json.tool results/target_discovery/JEPA_LANE_CURRENT_CUSTODY_STATE_20261014.json >/dev/null
      - name: Run current gate custody tests
        run: |
          python -m pytest -q \
            tests/v5/test_td_real_measurement_reference_v1.py \
            tests/v5/test_td_real_teacher_information_probe_v1.py \
            tests/v5/test_td_real_evidence_ladder_contract_v1.py \
            tests/v5/test_td_real_relational_manifest_v1.py
      - name: Run existing takeover and post-TD custody tests
        run: |
          python -m pytest -q \
            tests/v5/test_verify_jepa_lane_takeover_manifest_v1.py \
            tests/v5/test_jepa_post_td_harness_contract_v1.py \
            tests/v5/test_jepa_post_td_rehearsal_preflight_v1.py \
            tests/v5/test_jepa_post_td_tournament_controller_v1.py \
            tests/v5/test_jepa_post_td_presentation_ema_v1.py
      - name: Authority guard
        run: |
          python - <<'PY'
          import json
          p='results/target_discovery/JEPA_LANE_CURRENT_CUSTODY_STATE_20261014.json'
          d=json.load(open(p))
          a=d['authority']
          assert a['controller_adjudication_authorized_once'] is True
          assert a['phase2_executed'] is False
          for k,v in a.items():
              if k not in {'controller_adjudication_authorized_once','phase2_executed'}:
                  assert v is False, (k,v)
          print('AUTHORITY_GUARD_PASS')
          PY
