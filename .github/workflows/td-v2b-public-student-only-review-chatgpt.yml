name: TD V2B public student-only policy gate against Macha507 (NO AUTHORITY)
on:
  pull_request:
    paths:
      - 'scripts/v5/td_unified/observation_v2b_public_student_gate_v1.py'
      - 'tests/v5/td_unified/test_observation_v2b_public_student_gate.py'
      - '.github/workflows/td-v2b-public-student-only-review-chatgpt.yml'
permissions:
  contents: read
jobs:
  student-only-public-gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        numpy: ['1.26.4', '2.2.6']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned dependencies
        run: python -m pip install pytest==9.1.1 numpy==${{ matrix.numpy }}
      - name: V2B student-gate security and explicit external-issuer limitation
        run: python -m pytest -q -rA tests/v5/td_unified/test_observation_v2b_public_student_gate.py
      - name: Original V2 bound content tests (fresh issuer registry)
        run: python -m pytest -q tests/v5/td_unified/test_observation_normalization_v2_bound_content.py
      - name: Original private pair tests (fresh issuer registry)
        run: python -m pytest -q tests/v5/td_unified/test_observation_v2_private_pair_coherence_v1.py
      - name: Exact #504 source integration (fresh issuer registry)
        run: python -m pytest -q tests/v5/td_unified/test_observation_v2_503_with_macha504_a4_integration.py
      - name: Immutable #504 A4 source test replay
        run: python -m pytest -q tests/v5/td_unified/test_q_excluded_depth_v1_a4_repair.py
