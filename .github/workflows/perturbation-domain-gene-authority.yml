name: Perturbation domain and gene-authority contracts

on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/perturbation/benchmark_domain_contract_v1.py'
      - 'tests/test_perturbation_benchmark_domain_contract_v1.py'
      - 'docs/agent/CROSS_STUDY_GENE_ID_AUTHORITY_20260924.md'
      - '.github/workflows/perturbation-domain-gene-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run mandatory domain-transport checks
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m pytest -q -W error tests/test_perturbation_benchmark_domain_contract_v1.py | tee /tmp/domain-contract.log
      - name: Fail closed on skip
        run: |
          if grep -qiE '^SKIPPED|[0-9]+ skipped' /tmp/domain-contract.log; then
            echo 'MANDATORY DOMAIN TESTS SKIPPED — STOP'
            exit 1
          fi
