name: V5 Stage-A spillover firewall

on:
  push:
    branches:
      - audit/v5-stage-a-spillover-firewall-20260916
  pull_request:
    paths:
      - 'src/sea_ad_jepa/v5/**'
      - 'tests/test_v5_current_stage_a_spillover_firewall_v1.py'
      - '.github/workflows/v5-stage-a-spillover-firewall.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spillover-firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run current Stage-A spillover firewall
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q tests/test_v5_current_stage_a_spillover_firewall_v1.py
