name: TD G7 E3 real content enforcement
on:
  pull_request:
    paths:
      - 'scripts/v5/td_real_g7_content_enforcement_v1.py'
      - 'tests/v5/test_td_real_g7_content_enforcement_v1.py'
      - 'tests/v5/test_td_real_g7_content_enforcement_v1_macha_hostile.py'
      - '.github/workflows/td-real-g7-e3-content-v1.yml'
permissions:
  contents: read
jobs:
  g7-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tooling
        run: python -m pip install pytest
      - name: G7 E3 hostile content semantics
        run: python -m pytest -q tests/v5/test_td_real_g7_content_enforcement_v1.py tests/v5/test_td_real_g7_content_enforcement_v1_macha_hostile.py
