name: Unified Task 3 registry

on:
  pull_request:
    paths:
      - 'scripts/v5/td_unified/**'
      - 'schemas/target_discovery/unified_v1/**'
      - 'tests/v5/td_unified/**'
      - '.github/workflows/unified-task3-registry.yml'
  push:
    branches:
      - 'work/unified-task3-registry-red-20261015'
      - 'work/unified-task3-registry-impl-20261015'
    paths:
      - 'scripts/v5/td_unified/**'
      - 'schemas/target_discovery/unified_v1/**'
      - 'tests/v5/td_unified/**'
      - '.github/workflows/unified-task3-registry.yml'

permissions:
  contents: read

jobs:
  task3-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1 numpy==1.26.4
      - name: Focused Task 3 registry and hostile self-audit suites
        run: python -m pytest -q tests/v5/td_unified/test_registry_v1*.py 2>&1 | tee focused-task3-pytest.log
      - name: Preserve focused Task 3 pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-task3-pytest-${{ github.sha }}
          path: focused-task3-pytest.log
          if-no-files-found: error
      - name: Full unified Task 0-3 regression
        run: python -m pytest -q tests/v5/td_unified
