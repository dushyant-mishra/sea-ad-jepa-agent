name: Current authority surface guard

on:
  pull_request:
    paths:
      - START_HERE.md
      - README.md
      - docs/agent/JEPA_LATEST_HANDOFF_POINTER.json
      - docs/agent/CURRENT_AUTHORITY_INDEX.md
      - docs/agent/CURRENT_SUPERSESSION_MAP.md
      - docs/agent/memory-os/ACTIVE_STATE.md
      - docs/agent/ACTIVE_STATE.md
      - docs/agent/CURRENT_WORK_CHECKPOINT_STATE.json
      - docs/agent/memory-os/NEXT_ALLOWED_ACTION.json
      - docs/agent/memory-os/START_EVERY_JEPA_CHAT.txt
      - docs/agent/memory-os/JEPA_PROJECT_MEMORY_OS.md
      - scripts/agent/verify_current_authority_surface_v1.py
      - tests/test_current_authority_surface_guard_v1.py
      - scripts/agent/verify_current_authority_surface_v2.py
      - tests/test_current_authority_surface_guard_v2.py
      - docs/agent/JEPA_MAIN_CURRENT_EXECUTION_MAP_20261102.md
      - .github/workflows/current-authority-surface-guard.yml
  push:
    paths:
      - START_HERE.md
      - README.md
      - docs/agent/JEPA_LATEST_HANDOFF_POINTER.json
      - docs/agent/CURRENT_AUTHORITY_INDEX.md
      - docs/agent/CURRENT_SUPERSESSION_MAP.md
      - docs/agent/memory-os/ACTIVE_STATE.md
      - docs/agent/ACTIVE_STATE.md
      - docs/agent/CURRENT_WORK_CHECKPOINT_STATE.json
      - docs/agent/memory-os/NEXT_ALLOWED_ACTION.json
      - docs/agent/memory-os/START_EVERY_JEPA_CHAT.txt
      - docs/agent/memory-os/JEPA_PROJECT_MEMORY_OS.md
      - scripts/agent/verify_current_authority_surface_v1.py
      - tests/test_current_authority_surface_guard_v1.py
      - scripts/agent/verify_current_authority_surface_v2.py
      - tests/test_current_authority_surface_guard_v2.py
      - docs/agent/JEPA_MAIN_CURRENT_EXECUTION_MAP_20261102.md
      - .github/workflows/current-authority-surface-guard.yml

permissions:
  contents: read

jobs:
  authority-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run preserved October historical V1 guard tests and November main V2 tests
        run: python -m pytest -q tests/test_current_authority_surface_guard_v1.py tests/test_current_authority_surface_guard_v2.py
      - name: Validate actual current main-authority surface against V2
        run: python scripts/agent/verify_current_authority_surface_v2.py .
