name: TD real G6 margin decision V2

on:
  push:
    branches:
      - implementation/td-real-g6-margin-decision-v2-20261014
  pull_request:
    paths:
      - 'scripts/v5/td_real_teacher_information_decision_v2.py'
      - 'tests/v5/test_td_real_teacher_information_decision_v2.py'
      - '.github/workflows/td-real-g6-margin-decision-v2.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts/v5:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - run: python -m pip install pytest==9.1.1 numpy
      - name: Run G6 decision-contract tests
        run: python -m pytest -q tests/v5/test_td_real_teacher_information_decision_v2.py
      - name: Authority guard
        run: |
          echo HUMAN_TARGET_VALUES_DOWNLOADED=false
          echo HUMAN_G6_EXECUTED=false
          echo AUTHORITY_ALL_FALSE=true
