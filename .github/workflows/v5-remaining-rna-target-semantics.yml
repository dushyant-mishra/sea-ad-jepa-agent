name: V5 remaining-RNA and target-semantics successor

on:
  push:
    branches:
      - impl/v5-remaining-rna-target-semantics-20260917
  pull_request:
    paths:
      - 'src/sea_ad_jepa/v5/**'
      - 'tests/test_v5_remaining_rna_necessity_v1.py'
      - 'tests/test_v5_current_semantic_successor_spillover_v1.py'
      - 'tests/test_v5_current_authority_closure_v1.py'
      - 'tests/test_v5_current_stage_a_spillover_firewall_v1.py'
      - '.github/workflows/v5-remaining-rna-target-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run remaining-RNA and target-semantics regressions
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q -p no:randomly --strict-markers \
            tests/test_v5_remaining_rna_necessity_v1.py \
            tests/test_v5_current_semantic_successor_spillover_v1.py \
            tests/test_v5_current_authority_closure_v1.py
      - name: Fail closed on skipped focused tests
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q \
            tests/test_v5_remaining_rna_necessity_v1.py \
            tests/test_v5_current_semantic_successor_spillover_v1.py \
            tests/test_v5_current_authority_closure_v1.py \
            -rs --tb=short | tee /tmp/focused.txt
          if grep -qiE '^SKIPPED|[0-9]+ skipped' /tmp/focused.txt; then echo 'FOCUSED V5 TESTS SKIPPED - FAIL CLOSED'; exit 1; fi
