name: V5 remaining-RNA and target-semantics successor

on:
  push:
    branches:
      - impl/v5-remaining-rna-target-semantics-20260917
  pull_request:
    paths:
      - 'src/sea_ad_jepa/v5/**'
      - 'tests/test_v5_*.py'
      - 'scripts/agent/build_full104_target_qualification_sample_v1_20260921.py'
      - 'scripts/agent/validate_full104_target_qualification_sample_v1_20260921.py'
      - 'scripts/agent/run_full104_rare_tail_structural_preflight_v1_20260922.py'
      - 'scripts/agent/validate_full104_rare_tail_structural_preflight_v1_20260922.py'
      - 'scripts/agent/run_full104_rare_tail_molecular_prequalification_v1_20260922.py'
      - 'scripts/agent/preflight_full104_rare_tail_molecular_readonly_v1_20260922.py'
      - 'scripts/agent/preflight_full104_rare_tail_molecular_readonly_v2_20260922.py'
      - 'scripts/agent/run_full104_rare_tail_molecular_guarded_v1_20260922.py'
      - '.github/workflows/v5-remaining-rna-target-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-v5-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest numpy scipy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run current V5 semantic and spillover regression set
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q -p no:randomly --strict-markers \
            tests/test_v5_remaining_rna_necessity_v1.py \
            tests/test_v5_target_evidence_budget_authority_v1.py \
            tests/test_v5_precision_authority_v1.py \
            tests/test_v5_masking_design_population_authorities_v1.py \
            tests/test_v5_masking_rng_replay_authority_v1.py \
            tests/test_v5_masking_qualification_design_authority_v1.py \
            tests/test_v5_masking_qualification_execution_authority_v1.py \
            tests/test_v5_target_construction_authority_v1.py \
            tests/test_v5_remaining_rna_execution_authority_v1.py \
            tests/test_v5_teacher_target_construction_binding_v1.py \
            tests/test_v5_current_anti_cheat_authority_bundle_v2.py \
            tests/test_v5_current_closure_execution_evidence_v1.py \
            tests/test_v5_current_semantic_successor_spillover_v1.py \
            tests/test_v5_current_successor_schema_spillover_firewall_v1.py \
            tests/test_v5_current_authority_closure_v1.py \
            tests/test_v5_current_stage_a_spillover_firewall_v1.py \
            tests/test_v5_current_stage_a_spillover_firewall_v2.py \
            tests/test_v5_current_address_registry_and_policy_authority_v1.py \
            tests/test_v5_current_masking_policy_authority_v2.py \
            tests/test_v5_shared_address_query_provider_v1.py \
            tests/test_v5_full104_teacher_relational_target_qualification_authority_v1.py \
            tests/test_v5_full104_target_qualification_sample_authority_v1.py \
            tests/test_v5_full104_rare_biology_preservation_authority_v1.py \
            tests/test_v5_full104_rare_tail_structural_preflight_v1.py \
            tests/test_v5_full104_rare_tail_structural_preflight_cli_v1.py \
            tests/test_v5_full104_rare_tail_structural_preflight_receipt_v1.py \
            tests/test_v5_full104_rare_tail_molecular_authority_v1.py \
            tests/test_v5_full104_rare_tail_molecular_primitives_v1.py \
            tests/test_v5_full104_rare_tail_molecular_runner_v1.py \
            tests/test_v5_full104_rare_tail_molecular_execution_contract_v1.py \
            tests/test_v5_full104_rare_tail_molecular_readonly_preflight_v1.py \
            tests/test_v5_full104_rare_tail_molecular_readonly_preflight_v2.py \
            tests/test_v5_full104_rare_tail_molecular_guarded_v1.py \
            tests/test_v5_audit_b_scientific_resolution_v2.py
      - name: Fail closed on skipped regression tests
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q \
            tests/test_v5_remaining_rna_necessity_v1.py \
            tests/test_v5_target_evidence_budget_authority_v1.py \
            tests/test_v5_precision_authority_v1.py \
            tests/test_v5_masking_design_population_authorities_v1.py \
            tests/test_v5_masking_rng_replay_authority_v1.py \
            tests/test_v5_masking_qualification_design_authority_v1.py \
            tests/test_v5_masking_qualification_execution_authority_v1.py \
            tests/test_v5_target_construction_authority_v1.py \
            tests/test_v5_remaining_rna_execution_authority_v1.py \
            tests/test_v5_teacher_target_construction_binding_v1.py \
            tests/test_v5_current_anti_cheat_authority_bundle_v2.py \
            tests/test_v5_current_closure_execution_evidence_v1.py \
            tests/test_v5_current_semantic_successor_spillover_v1.py \
            tests/test_v5_current_successor_schema_spillover_firewall_v1.py \
            tests/test_v5_current_authority_closure_v1.py \
            tests/test_v5_current_stage_a_spillover_firewall_v1.py \
            tests/test_v5_current_stage_a_spillover_firewall_v2.py \
            tests/test_v5_current_address_registry_and_policy_authority_v1.py \
            tests/test_v5_current_masking_policy_authority_v2.py \
            tests/test_v5_shared_address_query_provider_v1.py \
            tests/test_v5_full104_teacher_relational_target_qualification_authority_v1.py \
            tests/test_v5_full104_target_qualification_sample_authority_v1.py \
            tests/test_v5_full104_rare_biology_preservation_authority_v1.py \
            tests/test_v5_full104_rare_tail_structural_preflight_v1.py \
            tests/test_v5_full104_rare_tail_structural_preflight_cli_v1.py \
            tests/test_v5_full104_rare_tail_structural_preflight_receipt_v1.py \
            tests/test_v5_full104_rare_tail_molecular_authority_v1.py \
            tests/test_v5_full104_rare_tail_molecular_primitives_v1.py \
            tests/test_v5_full104_rare_tail_molecular_runner_v1.py \
            tests/test_v5_full104_rare_tail_molecular_execution_contract_v1.py \
            tests/test_v5_full104_rare_tail_molecular_readonly_preflight_v1.py \
            tests/test_v5_full104_rare_tail_molecular_readonly_preflight_v2.py \
            tests/test_v5_full104_rare_tail_molecular_guarded_v1.py \
            tests/test_v5_audit_b_scientific_resolution_v2.py \
            -rs --tb=short | tee /tmp/current-v5.txt
          if grep -qiE '^SKIPPED|[0-9]+ skipped' /tmp/current-v5.txt; then echo 'CURRENT V5 REGRESSION TESTS SKIPPED - FAIL CLOSED'; exit 1; fi
