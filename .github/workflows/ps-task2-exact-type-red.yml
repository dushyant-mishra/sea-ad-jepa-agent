name: Independent PS Task 2 exact-type custody RED
on:
  pull_request:
    paths:
      - 'scripts/production_synthetic/custody_v1.py'
      - 'tests/production_synthetic/test_custody_v1_ps1_exact_type_independent_red.py'
      - '.github/workflows/ps-task2-exact-type-red.yml'
permissions:
  contents: read
jobs:
  hostile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==9.1.1' 'numpy==2.4.6'
      - run: python -m pytest -q tests/production_synthetic/test_custody_v1_ps1_exact_type_independent_red.py tests/production_synthetic/test_custody_v1.py tests/production_synthetic/test_custody_v1_hostile.py
