name: Apply Task 3 cycle1 hardening

permissions:
  contents: write

on:
  push:
    branches:
      - 'work/unified-task3-registry-impl-20261015'
    paths:
      - 'scripts/v5/td_unified/apply_task3_cycle1_hardening.py'
      - 'tests/v5/td_unified/test_registry_v1_hostile_cycle1.py'
      - '.github/workflows/apply-task3-cycle1-hardening.yml'
      - 'scripts/v5/td_unified/registry_v1.py'
      - 'tests/v5/td_unified/test_registry_v1.py'

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1 numpy==1.26.4
      - name: Apply deterministic hardening
        run: python scripts/v5/td_unified/apply_task3_cycle1_hardening.py
      - name: Verify Task 3 focused plus hostile cycle1
        run: python -m pytest -q tests/v5/td_unified/test_registry_v1.py tests/v5/td_unified/test_registry_v1_hostile_cycle1.py
      - name: Verify complete unified regression
        id: full_regression
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/v5/td_unified 2>&1 | tee task3-cycle1-full-regression.log
          status=${PIPESTATUS[0]}
          echo "pytest_status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload full-regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task3-cycle1-full-regression-log
          path: task3-cycle1-full-regression.log
      - name: Require complete unified regression success
        run: test "${{ steps.full_regression.outputs.pytest_status }}" = "0"
      - name: Commit repaired source and fixtures when changed
        run: |
          if git diff --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v5/td_unified/registry_v1.py tests/v5/td_unified/test_registry_v1.py
          git commit -m 'task3 GREEN1: harden dependency, independence, and R1/R4 authority'
          git push origin HEAD:work/unified-task3-registry-impl-20261015
