name: TD real relational manifest V2

on:
  push:
    branches:
      - implementation/td-real-relational-manifest-v2-20261014
  pull_request:
    paths:
      - 'scripts/v5/td_real_relational_manifest_v2.py'
      - 'tests/v5/test_td_real_relational_manifest_v2.py'
      - '.github/workflows/td-real-relational-manifest-v2.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts/v5:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - run: python -m pip install pytest==9.1.1
      - name: Run R1 manifest V2 tests
        run: python -m pytest -q tests/v5/test_td_real_relational_manifest_v2.py
      - name: Authority guard
        run: |
          echo BIOLOGICAL_OUTCOME_INPUTS_DOWNLOADED=false
          echo REAL_TOURNAMENT_EXECUTED=false
          echo HUMAN_R1_PASS_AUTHORIZED=false
          echo AUTHORITY_ALL_FALSE=true
