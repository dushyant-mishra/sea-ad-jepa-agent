name: V40 physical historical-vs-G3 default parity (non-authorizing)
on:
  pull_request:
    paths:
      - 'tests/test_v40_g3_historical_default_exact_parity.py'
      - '.github/workflows/v40-g3-historical-exact-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-source-default-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1 pytest==8.3.4
      - name: Replay exact historical source and compare all synthetic donor-heldout folds
        env:
          PYTHONPATH: src:tests:.
        run: |
          set -euo pipefail
          python -m pytest -q -s --strict-markers tests/test_v40_g3_historical_default_exact_parity.py --junitxml=/tmp/v40.xml | tee /tmp/v40.log
          python - <<'PY'
          from xml.etree import ElementTree as ET
          root=ET.parse('/tmp/v40.xml').getroot()
          if root.tag!='testsuite': root=root.find('testsuite')
          counts={x:int(root.get(x,0)) for x in ('tests','errors','failures','skipped')}
          names={x.get('name') for x in root.iter('testcase')}
          required={
            'test_historical_and_g3_default_exact_row_and_score_parity[0]',
            'test_historical_and_g3_default_exact_row_and_score_parity[1]',
            'test_historical_and_g3_default_exact_row_and_score_parity[2]',
            'test_historical_and_g3_default_full_wrapper_parity',
            'test_explicit_g3_is_labeled_and_not_silently_default',
            'test_unknown_objective_rejected_before_any_fold_result',
            'test_original_immutable_freeze_hash_must_not_be_rewritten',
          }
          if counts!={'tests':7,'errors':0,'failures':0,'skipped':0} or names!=required:
              raise SystemExit(f'STOP_V40_MISSING_OR_WRONG_TESTS counts={counts} missing={required-names} extra={names-required}')
          print('V40_EXACT_SEVEN_PHYSICAL_HISTORICAL_DEFAULT_PARITY_CONTROLS')
          PY
          grep -q 'V40_HISTORICAL_G3_DEFAULT_EXACT_24_ROW_PARITY_NONAUTHORIZING' /tmp/v40.log
