name: Teacher/student V5 data-first planning audit

on:
  push:
    branches:
      - planning/teacher-student-v5-data-first-20260908
    paths-ignore:
      - '.v5_sync66/**'
      - '.github/workflows/materialize_teacher_student_v5_data_first_snapshot.yml'
      - '.github/workflows/teacher_student_v5_data_first_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-first-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest numpy pandas scipy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run V5 governance audit
        env:
          PYTHONPATH: src:.
        run: python scripts/agent/audit_teacher_student_v5_data_first_v1.py
      - name: Run frozen V4 active suite unchanged
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          import subprocess,sys
          from pathlib import Path
          tests=[x.strip() for x in Path('docs/agent/TEACHER_STUDENT_ACTIVE_TEST_SELECTION_V4.txt').read_text().splitlines() if x.strip() and not x.lstrip().startswith('#')]
          assert len(tests)==7 and len(set(tests))==7,tests
          subprocess.run([sys.executable,'-m','pytest','-q',*tests],check=True)
          PY
      - name: Run exact V5 active suite
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          import subprocess,sys
          from pathlib import Path
          tests=[x.strip() for x in Path('docs/agent/TEACHER_STUDENT_V5_ACTIVE_TEST_SELECTION.txt').read_text().splitlines() if x.strip()]
          assert len(tests)==11 and len(set(tests))==11,tests
          subprocess.run([sys.executable,'-m','pytest','-q',*tests],check=True)
          PY
      - name: Compile V5 source and profilers
        env:
          PYTHONPATH: src:.
        run: |
          python -m py_compile src/sea_ad_jepa/v5/*.py scripts/agent/profile_reader_fit_*.py scripts/agent/audit_teacher_student_v5_data_first_v1.py scripts/agent/build_teacher_student_v5_prototype_manifest.py
