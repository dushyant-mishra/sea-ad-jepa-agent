  donor_linkage_audit: results/tables/stage41abc_donor_linkage_audit_v1.csv
  safe_feature_matrix_manifest: results/tables/stage41abc_safe_feature_matrix_manifest_v1.csv
  safe_metadata_mri_feature_matrix_summary: results/tables/stage41abc_safe_metadata_mri_feature_matrix_summary_v1.csv
  forbidden_predictor_audit: results/tables/stage41abc_forbidden_predictor_audit_v1.csv
  manual_acquisition_gaps: results/tables/stage41abc_manual_acquisition_gaps_v1.csv
