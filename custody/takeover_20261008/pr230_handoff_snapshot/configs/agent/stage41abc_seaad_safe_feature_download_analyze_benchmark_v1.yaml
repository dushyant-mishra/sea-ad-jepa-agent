stage: Stage41ABC
version: v1
description: SEA-AD safe resource discovery, bounded download, analysis, donor-linked feature matrix construction, and first benchmark gate.

references:
  locked_benchmark_condition: Stage27C module_pca_ridge
  locked_benchmark_mean_pooled_oof_spearman: 0.3267024400121495
  material_rescue_threshold: 0.3317
  stage39e_best_credible_unlocked: rank_inverse_normal_module_pca8_ridge
  stage39e_best_credible_unlocked_mean_pooled_oof_spearman: 0.35808116279206914
  resource_pages:
    sea_ad_data: https://brain-map.org/consortia/sea-ad/our-data
    sea_ad_resources: https://brain-map.org/consortia/sea-ad/our-resources
    cellxgene_collection: https://cellxgene.cziscience.com/collections/1ca90a2d-2943-483d-b678-b809bf464c30

paths:
  raw_dir: data/sea_ad/stage41abc/raw
  interim_dir: data/sea_ad/stage41abc/interim
  processed_dir: data/sea_ad/stage41abc/processed
  manifest_dir: data/sea_ad/stage41abc/manifests
  whitepaper_dir: data/sea_ad/stage41abc/whitepapers

download_policy:
  max_download_mb: 250
  max_pdf_mb: 100
  user_agent: Mozilla/5.0 Stage41ABC SEA-AD safe resource audit

inputs:
