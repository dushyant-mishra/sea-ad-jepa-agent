  download_manifest: results/tables/stage41abc_download_manifest_v1.csv
  file_checksum_manifest: results/tables/stage41abc_file_checksum_manifest_v1.csv
  whitepaper_inventory: results/tables/stage41abc_whitepaper_inventory_v1.csv
  downloaded_file_analysis: results/tables/stage41abc_downloaded_file_analysis_v1.csv
  donor_metadata_analysis: results/tables/stage41abc_donor_metadata_analysis_v1.csv
