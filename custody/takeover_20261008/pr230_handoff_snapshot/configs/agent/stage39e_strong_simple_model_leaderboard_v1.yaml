stage: Stage39E
version: v1
description: Strong low-capacity simple-model leaderboard under locked donor-held-out safeguards.

references:
  stage27c_reference_mean: 0.3267024400121495
  stage39c_best_mean: 0.3458094563126456
  stage39c_best_condition: rank_int_module_pca_ridge
  material_margin_vs_stage39c: 0.005
  target_drop_guard: 0.05
  bootstrap_iterations: 500
  random_seed: 7
  required_targets:
    - AT8
    - 6e10/A_beta
    - GFAP
    - Iba1
    - NeuN

inputs:
  stage27c_script: scripts/run_stage27c_non_graph_rescue_v1.py
  stage39c_mean_metrics: results/tables/stage39c_mean_metrics_v1.csv
  stage39c_target_metrics: results/tables/stage39c_target_metrics_v1.csv
  stage39d_restricted_composition_sensitivity: results/tables/stage39d_restricted_composition_sensitivity_v1.csv
  locked_folds: results/tables/v3_locked_donor_folds_v1.csv

outputs:
  input_inventory: results/tables/stage39e_input_inventory_v1.csv
  model_registry: results/tables/stage39e_model_registry_v1.csv
  oof_predictions: results/tables/stage39e_oof_predictions_v1.csv
  target_metrics: results/tables/stage39e_target_metrics_v1.csv
  mean_metrics: results/tables/stage39e_mean_metrics_v1.csv
  leaderboard: results/tables/stage39e_strong_simple_model_leaderboard_v1.csv
  negative_control_results: results/tables/stage39e_negative_control_results_v1.csv
  bootstrap_ci: results/tables/stage39e_bootstrap_ci_v1.csv
  delta_vs_stage39c_stage27c: results/tables/stage39e_delta_vs_stage39c_stage27c_v1.csv
  claim_boundary_audit: results/tables/stage39e_claim_boundary_audit_v1.csv
  pass_fail: results/tables/stage39e_pass_fail_v1.csv
  technical_report: results/reports/stage39e_strong_simple_model_leaderboard_report_v1.md
  pi_summary: results/reports/stage39e_pi_simple_model_leaderboard_summary_v1.md
  active_status: docs/ACTIVE_V3_STATUS.md
  v3_scorecard_md: docs/V3_SCORECARD.md
  v3_scorecard_csv: results/tables/v3_scorecard_status_v1.csv

models:
  ridge_alphas: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  elasticnet_alphas: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
  elasticnet_l1_ratios: [0.05, 0.1, 0.25, 0.5, 0.8]
  pca_components: [4, 8, 12, 16]
  pls_components: [2, 4, 6]
  max_direct_features: 256

target_transforms:
  - rank_inverse_normal
  - raw_log1p
  - winsor_log1p

safety:
  train_fold_only_preprocessing: true
  donor_heldout_only: true
  no_external_data: true
  no_composition_proxy_features: true
  no_candidate_selection: true
  no_clean_external_validation_claim: true
  no_causal_claim: true
  no_therapeutic_claim: true
  no_gene_ablation_claim: true
