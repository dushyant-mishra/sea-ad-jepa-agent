stage: Stage56
version: v1
stage_name: Stage56_target_gated_state_programming_ensemble_v1
description: Nested target-gated ensemble audit for programming-only versus state-module microglia programming branches.

inputs:
  programming_matrix: data/processed/sea_ad_mtg_microglia_pvm_pseudobulk.csv
  microglia_h5ad: data/processed/sea_ad_mtg_microglia_pvm_all_hvg3k_module_preserved.h5ad
  pathology_targets: data/processed/metadata/sea_ad_mtg_donor_pathology_targets.csv
  stage55_branch_comparison: results/tables/stage55_branch_comparison_v1.csv
  active_status: docs/ACTIVE_V3_STATUS.md
  v3_scorecard_md: docs/V3_SCORECARD.md
  v3_scorecard_csv: results/tables/v3_scorecard_status_v1.csv

parameters:
  donor_col: Donor ID
  state_col: Supertype
  max_programming_features: 3000
  latent_dims: [8, 16]
  random_seeds: [107, 211, 307]
  n_outer_splits: 5
  n_inner_splits: 4
  ridge_alpha: 1.0
  high_cell_quantile: 0.90
  min_cells_per_donor_state: 5

outputs:
  input_inventory: results/tables/stage56_input_inventory_v1.csv
  target_gate_registry: results/tables/stage56_target_gate_registry_v1.csv
  nested_gate_decisions: results/tables/stage56_nested_gate_decisions_v1.csv
  frozen_probe_results: results/tables/stage56_frozen_probe_results_v1.csv
  target_level_results: results/tables/stage56_target_level_results_v1.csv
  branch_comparison: results/tables/stage56_branch_comparison_v1.csv
  target_family_summary: results/tables/stage56_target_family_summary_v1.csv
  negative_control_results: results/tables/stage56_negative_control_results_v1.csv
  leakage_audit: results/tables/stage56_leakage_audit_v1.csv
  claim_boundary_audit: results/tables/stage56_claim_boundary_audit_v1.csv
  pass_fail: results/tables/stage56_pass_fail_v1.csv
  report: results/reports/stage56_target_gated_state_programming_ensemble_report_v1.md
  pi_summary: results/reports/stage56_pi_summary_v1.md
  claim_final_check: results/reports/stage56_claim_boundary_final_check_v1.md
