name: GSE178317 design-authority red-team

on:
  pull_request:
    paths:
      - 'analysis/therapeutic_perturbation_etl/scripts/build_gse178317_intervention_effects_v1.py'
      - 'analysis/therapeutic_perturbation_etl/scripts/recover_gse178317_guide_assignments_v2.py'
      - 'tests/test_gse178317_design_authority_v1.py'
      - '.github/workflows/gse178317-design-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Run fail-closed design semantics
        run: |
          set -o pipefail
          python -m pytest -q -W error tests/test_gse178317_design_authority_v1.py | tee /tmp/gse178317-design.log
      - name: Fail closed on skip
        run: |
          if grep -qiE '^SKIPPED|[0-9]+ skipped' /tmp/gse178317-design.log; then
            echo 'MANDATORY GSE178317 DESIGN TESTS SKIPPED — STOP'
            exit 1
          fi
