name: Teacher/student unified V4 self-contained audit and package

on:
  push:
    branches:
      - candidate/teacher-student-unified-v4-relational-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest numpy pandas scipy
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify exact V4 source and review authorities
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/agent/audit_teacher_student_integration_freeze_v4.py --root .

      - name: Run exact V4 active test selection
        env:
          PYTHONPATH: src:.
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          tests = [
              line.strip()
              for line in Path(
                  "docs/agent/TEACHER_STUDENT_ACTIVE_TEST_SELECTION_V4.txt"
              ).read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          assert len(tests) == 7 and len(set(tests)) == 7, tests
          subprocess.run([sys.executable, "-m", "pytest", "-q", *tests], check=True)
          PY

      - name: Confirm training remains unauthorized
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = [
              Path("docs/agent/HEALTHY_TEACHER_U0_U40_EXECUTION_AUTHORITY_V1.json"),
              Path("docs/agent/HEALTHY_TEACHER_CONTINUATION_EXECUTION_AUTHORITY_V1.json"),
          ]
          assert not any(path.exists() for path in forbidden), forbidden
          print("PASS_NO_HEALTHY_TEACHER_EXECUTION_AUTHORITY_PRESENT")
          PY

      - name: Build and replay-test self-contained V4 review package
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/agent/build_teacher_student_v4_review_package.py \
            --root . \
            --dist dist \
            --package-commit "${{ github.sha }}"

      - name: Upload exact self-contained V4 review package
        uses: actions/upload-artifact@v4
        with:
          name: teacher-student-unified-v4-self-contained-review
          path: |
            dist/TEACHER_STUDENT_UNIFIED_V4_SELF_CONTAINED_REVIEW_PACKAGE.zip
            dist/TEACHER_STUDENT_UNIFIED_V4_SELF_CONTAINED_REVIEW_PACKAGE_SHA256.txt
            dist/TEACHER_STUDENT_UNIFIED_V4_SELF_CONTAINED_PACKAGING_VALIDATION.json
          if-no-files-found: error
          retention-days: 30
