name: GSE178317 V2 lane-support independent red-team

on:
  pull_request:
    paths:
      - 'analysis/therapeutic_perturbation_etl/scripts/recover_gse178317_guide_assignments_v2.py'
      - 'tests/test_gse178317_v2_lane_support_redteam_20260924.py'
      - 'tests/test_gse178317_v2_count_binding_redteam_20260924.py'
      - '.github/workflows/gse178317-v2-lane-support-redteam.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-lane-negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused CPU dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Execute fail-closed paired-lane tests
        run: |
          set -o pipefail
          python -m pytest -q -W error tests/test_gse178317_v2_lane_support_redteam_20260924.py tests/test_gse178317_v2_count_binding_redteam_20260924.py | tee /tmp/gse178317-lane-redteam.log
      - name: Reject skipped mandatory checks
        run: |
          if grep -qiE '^SKIPPED|[0-9]+ skipped' /tmp/gse178317-lane-redteam.log; then
            echo "GSE178317 LANE-SUPPORT MANDATORY TESTS SKIPPED — STOP"
            exit 1
          fi
