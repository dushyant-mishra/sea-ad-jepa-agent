  nph_dataset_id: NPH52_exact_source_objects

split_contract:
  foundation:
    SEA_AD: {development: 8, sealed_holdout: 8}
    HVS: {development: 8, sealed_holdout: 8}
    NPH_Ctrl: {development: 3, sealed_holdout: 3}
  continuation:
    NPH_Abeta: {development: 3, sealed_holdout: 3}
    NPH_AbetaTau: {development: 2, sealed_holdout: 2}
  whole_study_external_holdouts:
    - siletti_hbca_all_non_neuronal
  validation_only:
    - gse243292_full_dlpfc_h5ad
    - gse146639_processed_microglia_archive

matrix_contract:
  sea_ad: {slot: layers/UMIs, orientation: cell_by_gene, semantics: raw_integer_counts}
  hvs: {slot: raw/X, orientation: cell_by_gene, semantics: raw_integer_counts}
  nph: {slot: counts, orientation: gene_by_cell, semantics: sparse_published_counts}
  transformation: library_size_normalize_to_10000_then_log1p_with_measurement_mask

vocabulary:
  bounded_cells_per_donor_class_source: 16
  minimum_study_family_fraction: 0.6666666667
  minimum_training_donor_measurement_fraction: 0.80
  minimum_donor_balanced_detection: 0.01
  score_weights:
    study_coverage: 0.25
    donor_measurement: 0.20
    donor_detection: 0.20
    donor_variability: 0.15
    broad_class_coverage: 0.10
    cross_study_stability: 0.05
    missingness_entropy: 0.05

sampling_contract:
  hierarchy: [tissue_state, study, donor, broad_cell_class, cell]
  source_weight_rule: inverse_training_donor_count_renormalized_across_tissue_state_then_study
  donor_weight_rule: uniform_within_source
  cell_class_weight_rule: inverse_available_class_frequency_with_exposure_cap
  sealed_donors_allowed: false
  pathology_labels_allowed: false
