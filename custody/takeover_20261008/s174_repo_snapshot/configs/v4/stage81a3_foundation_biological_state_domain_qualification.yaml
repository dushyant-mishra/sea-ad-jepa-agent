  evidence_response: results/v4/stage81a3_evidence_response.csv
  depth_response: results/v4/stage81a3_depth_response.csv
  evidence_depth_separation: results/v4/stage81a3_evidence_depth_separation.csv
  domain_support: results/v4/stage81a3_domain_support_2axis.csv
  sampling_analysis: results/v4/stage81a3_sampling_analysis.csv
  observation_input_policy: results/v4/stage81a3_observation_input_policy.csv
