  recommended_stage68_inputs: results/tables/stage67_recommended_stage68_inputs_v1.csv
  claim_boundary_audit: results/tables/stage67_claim_boundary_audit_v1.csv
  pass_fail: results/tables/stage67_pass_fail_v1.csv
  report: results/reports/stage67_legacy_cell_level_artifact_and_seaad_availability_audit_report_v1.md
  pi_summary: results/reports/stage67_pi_summary_v1.md
  claim_boundary_final_check: results/reports/stage67_claim_boundary_final_check_v1.md
