stage: Stage67
version: v1
stage_name: Stage67_legacy_cell_level_artifact_and_seaad_availability_audit_v1
description: Inventory v1/v2/v3 legacy cell-level JEPA/Graph-JEPA artifacts and SEA-AD data availability for rare-tail cell extraction.

inputs:
  results_root: results
  data_root: data
  stage64_cell_scores: results/tables/stage64_cell_level_module_score_table_v1.csv
  stage64_handoff: results/tables/stage64_external_handoff_signature_v1.csv
  stage65_handoff: results/tables/stage65_external_handoff_signature_v1.csv
