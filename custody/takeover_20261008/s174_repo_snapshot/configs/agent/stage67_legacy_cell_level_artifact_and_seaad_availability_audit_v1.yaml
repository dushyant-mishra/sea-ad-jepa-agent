  active_status: docs/ACTIVE_V3_STATUS.md
  v3_scorecard_md: docs/V3_SCORECARD.md
  v3_scorecard_csv: results/tables/v3_scorecard_status_v1.csv

parameters:
  artifact_name_patterns:
    - "*cell_embeddings*.csv"
    - "*cell_trajectory*.csv"
    - "*cell_scores*.csv"
    - "*trajectory_scores*.csv"
    - "*umap_coordinates*.csv"
    - "*coordinates*.csv"
    - "*latent*.csv"
    - "*module_scores*.csv"
    - "*mixing*.csv"
  h5ad_patterns:
