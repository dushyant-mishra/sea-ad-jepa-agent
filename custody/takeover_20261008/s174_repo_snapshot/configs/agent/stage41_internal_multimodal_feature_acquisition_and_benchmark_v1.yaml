stage: Stage41
version: v1
description: Internal multimodal/spatial/image feature acquisition and safe benchmark workflow.

references:
  stage27c_reference_mean: 0.3267024400121495
  stage39e_pca8_reference_mean: 0.35808116279206914
  stage39h_context_reference_mean: 0.38781411359724616
  material_threshold: 0.3317024400121495
  target_drop_guard: 0.05
  recommended_next_stage_if_missing: Stage41A_manual_internal_feature_acquisition
  required_targets:
    - AT8
    - 6e10/A_beta
    - GFAP
    - Iba1
    - NeuN

inputs:
  stage27c_oof: results/tables/stage27c_rescue_oof_predictions_v1.csv
  stage39e_oof: results/tables/stage39e_oof_predictions_v1.csv
  stage39h_lock_decision: results/tables/stage39h_benchmark_lock_decision_v1.csv
  stage39h_feature_blocks: results/tables/stage39h_feature_risk_tier_assignment_v1.csv
  stage40a_decision: results/tables/stage40a_benchmark_decision_v1.csv
  stage40b_multimodal_plan: results/tables/stage40b_multimodal_feature_acquisition_plan_v1.csv
  locked_folds: results/tables/v3_locked_donor_folds_v1.csv
  donor_metadata_targets: results/tables/sea_ad_full_metadata_targets_with_covariates.csv

search:
  include_roots:
    - results/tables
    - results/reports
    - data
    - docs
  filename_keywords:
    - image
    - morphology
    - morph
    - spatial
    - section
    - slide
    - tile
    - patch
    - embedding
    - pathology
    - neighborhood
    - region
    - anatomy
    - density
    - composition
    - covariate

outputs:
  input_inventory: results/tables/stage41_input_inventory_v1.csv
  multimodal_source_inventory: results/tables/stage41_multimodal_source_inventory_v1.csv
  feature_block_inventory: results/tables/stage41_feature_block_inventory_v1.csv
  feature_risk_tier_assignment: results/tables/stage41_feature_risk_tier_assignment_v1.csv
  missing_feature_acquisition_plan: results/tables/stage41_missing_feature_acquisition_plan_v1.csv
  safe_feature_matrix_manifest: results/tables/stage41_safe_feature_matrix_manifest_v1.csv
  model_registry: results/tables/stage41_model_registry_v1.csv
  oof_results: results/tables/stage41_oof_results_v1.csv
  target_level_results: results/tables/stage41_target_level_results_v1.csv
  delta_vs_references: results/tables/stage41_delta_vs_references_v1.csv
  bootstrap_ci: results/tables/stage41_bootstrap_ci_v1.csv
  fold_sensitivity: results/tables/stage41_fold_sensitivity_v1.csv
  donor_influence_audit: results/tables/stage41_donor_influence_audit_v1.csv
  target_guard_audit: results/tables/stage41_target_guard_audit_v1.csv
  abeta_guard_audit: results/tables/stage41_abeta_guard_audit_v1.csv
  iba1_rescue_audit: results/tables/stage41_iba1_rescue_audit_v1.csv
  negative_control_results: results/tables/stage41_negative_control_results_v1.csv
  proxy_leakage_decision: results/tables/stage41_proxy_leakage_decision_v1.csv
  benchmark_lock_decision: results/tables/stage41_benchmark_lock_decision_v1.csv
  claim_boundary_audit: results/tables/stage41_claim_boundary_audit_v1.csv
  pass_fail: results/tables/stage41_pass_fail_v1.csv
  technical_report: results/reports/stage41_internal_multimodal_feature_acquisition_and_benchmark_report_v1.md
  pi_summary: results/reports/stage41_pi_multimodal_next_steps_summary_v1.md
  active_status: docs/ACTIVE_V3_STATUS.md
  v3_scorecard_md: docs/V3_SCORECARD.md
  v3_scorecard_csv: results/tables/v3_scorecard_status_v1.csv

safety:
  no_external_data_used_for_model_training: true
  no_external_model_selection: true
  no_candidate_selection: true
  frozen_candidates_preserved: true
  donor_held_out_evaluation_preserved: true
  train_fold_only_preprocessing_preserved: true
  no_clean_external_validation_claim: true
  no_causal_claim: true
  no_therapeutic_claim: true
  no_gene_ablation_claim: true
  no_disease_modifying_claim: true
