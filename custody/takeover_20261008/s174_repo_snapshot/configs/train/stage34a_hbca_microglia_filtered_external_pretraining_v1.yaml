stage: stage34a_hbca_microglia_filtered_external_pretraining_v1
random_seed: 7
approved_dataset_id: b165f033-9dec-468a-9248-802fc6902a74
approved_dataset_name: Human Brain Cell Atlas v1.0 / All non-neuronal cells
official_metric: pooled_donor_level_oof_spearman
minimum_success_threshold: 0.3228
stage27c_reference_mean: 0.3267024400121495
stage31_best_reference_mean: 0.32637035537106407
stage33c_best_mean: 0.3049387465829706
stage33c_best_condition: ext_svd32_raw_count_size_factor_log1p_direct_no_graph
max_target_drop_vs_stage27c_reference: -0.02

stage32c_pass_fail: results/tables/stage32c_pass_fail_v1.csv
stage32c_matrix: data/external_pretraining/stage32c/stage32c_human_external_pretraining_matrix.h5ad
stage34a_filtered_matrix: data/external_pretraining/stage34a/stage34a_hbca_microglia_filtered_pretraining_matrix.h5ad
canonical_gene_universe: results/tables/ablation_edge_sets/no_graph_identity_edges_v1.csv
minimum_filter_cells: 5000
minimum_gene_overlap_fraction: 0.85
max_cells: 100000

metadata:
  cell_type_columns: [cell_type, cell_type_ontology_term_id]
  candidate_columns:
    cell_type: [cell_type, cell_type_ontology_term_id]
    assay: [assay, assay_ontology_term_id]
    tissue: [tissue, tissue_ontology_term_id]
    region: [tissue]
    donor: [donor_id]
    sample: [donor_id]
    disease_condition: [disease, disease_ontology_term_id]
    suspension_type: []
    dataset_id: [dataset_id, stage32c_source_dataset_id]
  exact_or_myeloid_terms:
    - microglia
    - macrophage
    - myeloid
    - monocyte
    - perivascular
    - pvm
    - border-associated macrophage
    - bam
  broad_terms:
    - immune

references:
  stage27c_oof: results/tables/stage27c_rescue_oof_predictions_v1.csv
  stage31_oof: results/tables/stage31_residual_graph_oof_predictions_v1.csv
  stage31_condition: weak_diffusion_real_graph_residual_pca_ridge_alpha_0_05
  stage33c_target_metrics: results/tables/stage33c_target_metrics_v1.csv
  stage33c_mean_metrics: results/tables/stage33c_mean_metrics_v1.csv

external_encoder:
  method: truncated_svd_frozen_external_encoder
  transform: raw_count_size_factor_log1p
  components: [16, 32]

module_pca:
  n_components: 8

downstream:
  ridge_alphas: [0.1, 1.0, 10.0, 100.0]

graph:
  real_edges: results/tables/v2_graph_consensus_edges.csv
  no_graph_edges: results/tables/ablation_edge_sets/no_graph_identity_edges_v1.csv
  strict_shuffled_edges: results/tables/ablation_edge_sets/strict_shuffled_graph_edges_v1.csv
  alpha: 0.05

required_targets:
  - AT8
  - 6e10/A_beta
  - GFAP
  - Iba1
  - NeuN
