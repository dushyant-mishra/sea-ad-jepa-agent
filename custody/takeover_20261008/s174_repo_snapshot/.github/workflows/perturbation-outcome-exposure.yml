name: Experimental outcome exposure ledger

on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/perturbation/outcome_exposure_ledger_v1.py'
      - 'tests/test_perturbation_outcome_exposure_ledger_v1.py'
      - '.github/workflows/perturbation-outcome-exposure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exposure-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Verify monotonic exposure and known historical floor
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m pytest -q -W error tests/test_perturbation_outcome_exposure_ledger_v1.py | tee /tmp/perturbation-exposure.log
      - name: Reject skipped tests
        run: |
          if grep -qiE '^SKIPPED|[0-9]+ skipped' /tmp/perturbation-exposure.log; then
            echo 'EXPOSURE CONTRACT TEST SKIPPED — STOP'
            exit 1
          fi
