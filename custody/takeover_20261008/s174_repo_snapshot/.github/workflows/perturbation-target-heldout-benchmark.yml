name: Perturbation target-heldout synthetic benchmark

on:
  pull_request:
    paths:
      - 'src/sea_ad_jepa/perturbation/benchmark_target_holdout_v1.py'
      - 'tests/test_perturbation_target_holdout_benchmark_v1.py'
      - 'tests/test_perturbation_donor_balanced_redteam_v1.py'
      - '.github/workflows/perturbation-target-heldout-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-no-leakage-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install --disable-pip-version-check numpy pytest
      - name: Run target-holdout and baseline adversaries
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m pytest -q -W error tests/test_perturbation_target_holdout_benchmark_v1.py tests/test_perturbation_donor_balanced_redteam_v1.py | tee /tmp/target-holdout.txt
      - name: Reject skipped tests
        run: |
          if grep -qiE '^SKIPPED|[0-9]+ skipped' /tmp/target-holdout.txt; then
            echo "TARGET HOLDOUT BENCHMARK TESTS SKIPPED — STOP"
            exit 1
          fi
