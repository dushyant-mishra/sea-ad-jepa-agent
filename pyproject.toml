[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sea-ad-jepa"
version = "0.1.0"
description = "JEPA-agent prototype for SEA-AD Alzheimer disease gene-network discovery."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

